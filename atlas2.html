<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Tech Atlas Studio — a bilingual interactive atlas of software technologies: explore, compare, and combine languages, frameworks, databases, hosting and tools.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#080a10">
<title>Tech Atlas Studio</title>
<style>
/* ============================================================
   TECH ATLAS STUDIO — styles
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#070910;
  --bg-2:#0b0f18;
  --surface:rgba(255,255,255,.038);
  --surface-2:rgba(255,255,255,.062);
  --surface-3:rgba(255,255,255,.09);
  --border:rgba(255,255,255,.085);
  --border-2:rgba(255,255,255,.16);
  --text:#e9eef9;
  --text-2:#b9c3d8;
  --muted:#8d99b3;
  --accent:#22d3ee;
  --accent-2:#3b82f6;
  --accent-3:#8b5cf6;
  --good:#34d399;
  --warn:#fbbf24;
  --bad:#fb7185;
  --info:#60a5fa;
  --radius:16px;
  --radius-sm:10px;
  --radius-lg:22px;
  --shadow:0 18px 40px -22px rgba(0,0,0,.85);
  --shadow-sm:0 8px 20px -14px rgba(0,0,0,.8);
  --ring:0 0 0 2px rgba(34,211,238,.55);
  --maxw:1380px;
  --fs:1;
}
html[data-theme="light"]{
  --bg:#f4f6fb;
  --bg-2:#eaeef7;
  --surface:rgba(255,255,255,.82);
  --surface-2:rgba(255,255,255,.95);
  --surface-3:rgba(15,23,42,.05);
  --border:rgba(15,23,42,.10);
  --border-2:rgba(15,23,42,.20);
  --text:#0d1526;
  --text-2:#2c3a55;
  --muted:#5c6b87;
  --accent:#0891b2;
  --accent-2:#2563eb;
  --accent-3:#7c3aed;
  --good:#059669;
  --warn:#b45309;
  --bad:#dc2626;
  --info:#2563eb;
  --shadow:0 18px 40px -26px rgba(15,23,42,.35);
  --shadow-sm:0 8px 20px -16px rgba(15,23,42,.3);
  --ring:0 0 0 2px rgba(8,145,178,.5);
}
html{font-size:calc(100% * var(--fs));scroll-behavior:smooth}
html[data-motion="reduced"]{scroll-behavior:auto}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
html[dir="rtl"] body{font-family:"Vazirmatn","Segoe UI",Tahoma,"Iranian Sans",system-ui,sans-serif}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 520px at 10% -12%, rgba(34,211,238,.14), transparent 62%),
    radial-gradient(820px 520px at 92% -4%, rgba(139,92,246,.13), transparent 62%),
    radial-gradient(760px 620px at 50% 112%, rgba(59,130,246,.10), transparent 62%);
}
html[data-theme="light"] body::before{opacity:.55}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.015em;line-height:1.25}
p{margin:0 0 .6em}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.skip{position:absolute;inset-inline-start:-9999px;top:8px;z-index:999;background:var(--accent);color:#04121a;padding:10px 16px;border-radius:10px;font-weight:700}
.skip:focus{inset-inline-start:8px}

/* ---------- header ---------- */
.app-header{
  position:sticky;top:0;z-index:60;backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  background:linear-gradient(180deg, rgba(7,9,16,.92), rgba(7,9,16,.72));
  border-bottom:1px solid var(--border);
}
html[data-theme="light"] .app-header{background:linear-gradient(180deg,rgba(244,246,251,.95),rgba(244,246,251,.78))}
.header-inner{max-width:var(--maxw);margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:4px;border-radius:12px}
.brand-mark{
  width:36px;height:36px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
  background:conic-gradient(from 210deg,var(--accent),var(--accent-2),var(--accent-3),var(--accent));
  box-shadow:0 6px 18px -8px rgba(34,211,238,.75);
}
.brand-mark svg{width:20px;height:20px}
.brand-text{display:flex;flex-direction:column;text-align:start;line-height:1.1}
.brand-name{font-weight:750;font-size:.98rem;letter-spacing:-.02em}
.brand-sub{font-size:.66rem;color:var(--muted);letter-spacing:.13em;text-transform:uppercase}
.header-actions{display:flex;align-items:center;gap:8px;margin-inline-start:auto;flex-wrap:wrap}
.nav-scroll{
  max-width:var(--maxw);margin:0 auto;padding:0 12px 10px;display:flex;gap:6px;
  overflow-x:auto;scrollbar-width:thin;-webkit-overflow-scrolling:touch;
}
.nav-scroll::-webkit-scrollbar{height:6px}
.nav-scroll::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:99px}
.nav-btn{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;
  background:transparent;border:1px solid transparent;color:var(--text-2);cursor:pointer;
  font-size:.83rem;font-weight:560;white-space:nowrap;transition:background .16s,color .16s,border-color .16s;
}
.nav-btn:hover{background:var(--surface-2);color:var(--text)}
.nav-btn[aria-current="page"]{
  background:linear-gradient(135deg,rgba(34,211,238,.16),rgba(139,92,246,.16));
  border-color:var(--border-2);color:var(--text);box-shadow:var(--shadow-sm);
}
.nav-btn .ic{font-size:.95rem;line-height:1}

/* ---------- layout ---------- */
main{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:22px 16px 90px}
.view-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.view-title{font-size:clamp(1.4rem,3vw,2rem)}
.view-desc{color:var(--muted);font-size:.9rem;max-width:70ch;margin-top:4px}
.section{margin-bottom:26px}
.section-title{font-size:.78rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:700}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
.grid-2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid-3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1 1 auto}

/* ---------- surfaces ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.card.interactive{cursor:pointer;transition:transform .18s cubic-bezier(.2,.7,.3,1),border-color .18s,box-shadow .18s}
.card.interactive:hover{transform:translateY(-3px);border-color:var(--border-2);box-shadow:var(--shadow)}
html[data-motion="reduced"] .card.interactive:hover{transform:none}
@media (prefers-reduced-motion:reduce){.card.interactive:hover{transform:none}}
.card::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;
  background:linear-gradient(135deg,rgba(34,211,238,.10),transparent 45%);
}
.card.interactive:hover::after{opacity:1}
.panel{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
html[data-theme="light"] .panel{background:var(--surface-2)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:11px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  cursor:pointer;font-size:.85rem;font-weight:570;transition:background .15s,border-color .15s,transform .12s;
  text-decoration:none;white-space:nowrap;
}
.btn:hover{background:var(--surface-3);border-color:var(--border-2);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#04121a;border-color:transparent;
  box-shadow:0 10px 26px -14px rgba(34,211,238,.9);font-weight:680;
}
html[data-theme="light"] .btn.primary{color:#fff}
.btn.purple{background:linear-gradient(135deg,var(--accent-3),var(--accent-2));color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{background:rgba(251,113,133,.14);border-color:rgba(251,113,133,.35);color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:.78rem;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{
  width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:var(--surface-2);
  border:1px solid var(--border);cursor:pointer;font-size:.95rem;transition:background .15s,border-color .15s;
}
.icon-btn:hover{background:var(--surface-3);border-color:var(--border-2)}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:.78rem;font-weight:600;color:var(--text-2);letter-spacing:.01em}
.input,.select,textarea.input{
  width:100%;padding:10px 12px;border-radius:11px;background:var(--bg-2);border:1px solid var(--border);
  color:var(--text);transition:border-color .15s,box-shadow .15s;
}
html[data-theme="light"] .input,html[data-theme="light"] .select,html[data-theme="light"] textarea.input{background:#fff}
.input:focus,.select:focus,textarea.input:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
textarea.input{min-height:84px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.82rem}
.checkline{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:.84rem}
.checkline:hover{border-color:var(--border-2)}
.checkline input{accent-color:var(--accent);width:16px;height:16px;flex:0 0 auto}

/* ---------- chips / badges ---------- */
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:.75rem;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);cursor:pointer;
  transition:background .15s,border-color .15s,color .15s;white-space:nowrap;
}
.chip:hover{border-color:var(--border-2);color:var(--text)}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(139,92,246,.22));color:var(--text);border-color:var(--border-2)}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.68rem;
  font-weight:650;letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2);
  border:1px solid var(--border);color:var(--muted);
}
.badge.good{color:var(--good);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.10)}
.badge.warn{color:var(--warn);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.10)}
.badge.bad{color:var(--bad);border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.10)}
.badge.info{color:var(--info);border-color:rgba(96,165,250,.35);background:rgba(96,165,250,.10)}
.badge.accent{color:var(--accent);border-color:rgba(34,211,238,.35);background:rgba(34,211,238,.10)}

/* ---------- misc ---------- */
.muted{color:var(--muted)}
.small{font-size:.8rem}
.tiny{font-size:.72rem}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.divider{height:1px;background:var(--border);margin:14px 0;border:0}
.tag-list{display:flex;flex-wrap:wrap;gap:6px}
.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:6px 14px;font-size:.85rem}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}
ul.clean{margin:0;padding-inline-start:18px}
ul.clean li{margin-bottom:3px;font-size:.85rem}
.empty{
  padding:34px 18px;text-align:center;color:var(--muted);border:1px dashed var(--border-2);
  border-radius:var(--radius);background:var(--surface);
}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.83rem}
th,td{padding:11px 13px;text-align:start;vertical-align:top;border-bottom:1px solid var(--border)}
th{background:var(--surface-2);font-weight:660;color:var(--text-2);position:sticky;top:0;font-size:.76rem;
   text-transform:uppercase;letter-spacing:.07em;z-index:1}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.stat-value{font-size:1.85rem;font-weight:750;letter-spacing:-.03em;line-height:1.1;
  background:linear-gradient(135deg,var(--accent),var(--accent-3));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-label{font-size:.73rem;color:var(--muted);text-transform:uppercase;letter-spacing:.11em;font-weight:650;margin-top:4px}
.toast-wrap{position:fixed;inset-block-end:18px;inset-inline-end:18px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(92vw,360px)}
.toast{
  padding:11px 15px;border-radius:12px;background:var(--bg-2);border:1px solid var(--border-2);
  box-shadow:var(--shadow);font-size:.84rem;animation:slideIn .25s cubic-bezier(.2,.7,.3,1);
}
html[data-theme="light"] .toast{background:#fff}
.toast.good{border-inline-start:3px solid var(--good)}
.toast.bad{border-inline-start:3px solid var(--bad)}
.toast.warn{border-inline-start:3px solid var(--warn)}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
html[data-motion="reduced"] .toast{animation:none}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.modal-back{
  position:fixed;inset:0;z-index:150;background:rgba(3,6,12,.68);backdrop-filter:blur(6px);
  display:grid;place-items:center;padding:18px;
}
.modal{
  width:min(760px,100%);max-height:86vh;overflow:auto;background:var(--bg-2);border:1px solid var(--border-2);
  border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);
}
html[data-theme="light"] .modal{background:#fff}
.progress{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-3));border-radius:99px}
.diff-add{color:var(--good)}
.diff-del{color:var(--bad)}
.diff-chg{color:var(--warn)}
pre.code{
  background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;overflow:auto;
  font-size:.78rem;line-height:1.6;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-height:420px;
}
html[data-theme="light"] pre.code{background:#0d1526;color:#e9eef9}
.arch-svg{width:100%;height:auto;display:block;border-radius:12px;background:var(--bg-2)}
html[data-theme="light"] .arch-svg{background:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:8px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--border);cursor:pointer;font-size:.83rem;font-weight:570}
.tab[aria-selected="true"]{background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(139,92,246,.2));border-color:var(--border-2)}
.hint{font-size:.78rem;color:var(--muted);display:flex;gap:7px;align-items:flex-start;margin-top:8px}
.score-bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.score-bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-3))}
.cat-icon{font-size:1.2rem;line-height:1}
.nowrap{white-space:nowrap}
@media (max-width:600px){
  main{padding:16px 12px 90px}
  .header-inner{padding:8px 12px;gap:10px}
  .brand-sub{display:none}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px}
}
</style>
</head>
<body>
<a class="skip" href="#main" id="skipLink">Skip to content</a>

<header class="app-header">
  <div class="header-inner">
    <button class="brand" data-nav="dashboard" aria-label="Tech Atlas Studio — go to dashboard">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#04121a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 3 2.6 15 0 18M12 3c-2.6 3-2.6 15 0 18"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Tech Atlas Studio</span>
        <span class="brand-sub" id="brandSub">Technology Atlas</span>
      </span>
    </button>
    <div class="header-actions">
      <button class="icon-btn" id="langBtn" title="Language / زبان" aria-label="Switch language">🌐</button>
      <button class="icon-btn" id="themeBtn" title="Theme" aria-label="Toggle theme">🌙</button>
      <button class="btn sm ghost" data-nav="settings" id="settingsBtn">⚙ <span data-i18n="nav.settings">Settings</span></button>
    </div>
  </div>
  <nav class="nav-scroll" id="mainNav" aria-label="Main navigation"></nav>
</header>

<main id="main" tabindex="-1" aria-live="polite"></main>

<div class="toast-wrap" id="toastWrap" role="status" aria-live="polite" aria-atomic="false"></div>
<div id="modalRoot"></div>

<script>
"use strict";
/* ============================================================================
   TECH ATLAS STUDIO
   Single-file, dependency-free, offline-first bilingual technology atlas.

   Sections:
     1. Utilities
     2. i18n
     3. Catalog data (CATEGORIES / CATALOG / RELATIONS / GLOSSARY)
     4. Advisor + layer definitions
     5. Persistence (IndexedDB with localStorage fallback)
     6. Application state
     7. Rendering / router
     8. Views
     9. Event wiring
    10. Bootstrap
   ========================================================================== */

/* ==========================================================================
   1. UTILITIES
   ========================================================================== */
const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

/** Escape text for safe insertion into HTML/SVG. */
function esc(v){
  return String(v == null ? "" : v).replace(/[&<>"']/g, m => (
    { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[m]
  ));
}
/** Escape for use inside a double-quoted HTML attribute. */
const escAttr = esc;

function uid(prefix){
  return (prefix || "id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function nowIso(){ return new Date().toISOString(); }
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return String(iso);
  try{
    return d.toLocaleDateString(state.lang === "fa" ? "fa-IR" : "en-GB",
      { year:"numeric", month:"short", day:"numeric" });
  }catch(_){ return d.toISOString().slice(0,10); }
}
function debounce(fn, ms){
  let t;
  return function(){ const a = arguments, c = this; clearTimeout(t); t = setTimeout(() => fn.apply(c, a), ms); };
}
/** Deep clone that only accepts JSON-safe data. */
function clone(v){ return JSON.parse(JSON.stringify(v)); }
function isPlainObject(v){ return !!v && typeof v === "object" && !Array.isArray(v); }
function asArray(v){ return Array.isArray(v) ? v : []; }

/** Trigger a client-side file download. */
function downloadBlob(filename, content, mime){
  try{
    const blob = content instanceof Blob ? content : new Blob([content], { type: mime || "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  }catch(err){
    toast(t("toast.downloadFailed") + " " + err.message, "bad");
    return false;
  }
}
function downloadJson(filename, obj){
  return downloadBlob(filename, JSON.stringify(obj, null, 2), "application/json");
}

/** Read a File object as text with size guard. */
function readFileText(file, maxBytes){
  const limit = maxBytes || 8 * 1024 * 1024;
  return new Promise((resolve, reject) => {
    if(!file) return reject(new Error("No file selected."));
    if(file.size > limit) return reject(new Error("File is larger than the " + Math.round(limit/1048576) + " MB limit."));
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result));
    fr.onerror = () => reject(new Error("Could not read the file."));
    fr.readAsText(file);
  });
}

/** Toast notification (accessible live region). */
function toast(message, kind){
  const wrap = $("#toastWrap");
  if(!wrap) return;
  const div = document.createElement("div");
  div.className = "toast " + (kind || "");
  div.textContent = message;
  wrap.appendChild(div);
  setTimeout(() => {
    div.style.transition = "opacity .3s";
    div.style.opacity = "0";
    setTimeout(() => div.remove(), 320);
  }, kind === "bad" ? 6000 : 3800);

function t(key, vars){
  const dict = I18N[state.lang] || I18N.en;
  let s = dict[key];
  if(s == null) s = I18N.en[key];
  if(s == null) s = key;
  if(vars) Object.keys(vars).forEach(k => { s = s.replace(new RegExp("\\{" + k + "\\}", "g"), vars[k]); });
  return s;
}

/* ==========================================================================
   5. PERSISTENCE
   ========================================================================== */
const Store = (function(){
  const DB_NAME = "tech-atlas-studio";
  const DB_VERSION = 1;
  const STORE = "kv";
  const LS_PREFIX = "tas:";
  let dbPromise = null;
  let mode = "indexeddb";

  function openDb(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      if(typeof indexedDB === "undefined"){ reject(new Error("IndexedDB is not available.")); return; }
      let req;
      try{ req = indexedDB.open(DB_NAME, DB_VERSION); }
      catch(err){ reject(err); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error("IndexedDB open failed."));
      req.onblocked = () => reject(new Error("IndexedDB upgrade blocked by another tab."));
    });
    return dbPromise;
  }

  function tx(modeName, fn){
    return openDb().then(db => new Promise((resolve, reject) => {
      let transaction;
      try{ transaction = db.transaction(STORE, modeName); }
      catch(err){ reject(err); return; }
      const store = transaction.objectStore(STORE);
      let result;
      try{ result = fn(store); }
      catch(err){ reject(err); return; }
      transaction.oncomplete = () => resolve(result && result.__req ? result.__req.result : result);
      transaction.onerror = () => reject(transaction.error || new Error("IndexedDB transaction failed."));
      transaction.onabort = () => reject(transaction.error || new Error("IndexedDB transaction aborted."));
    }));
  }

  return {
    get mode(){ return mode; },
    async init(){
      try{ await openDb(); mode = "indexeddb"; }
      catch(err){
        mode = "localstorage";
        console.warn("[Tech Atlas Studio] IndexedDB unavailable, falling back to localStorage:", err && err.message);
      }
      return mode;
    },
    async get(key){
      if(mode === "indexeddb"){
        try{
          const raw = await tx("readonly", s => { const r = s.get(key); return { __req:r }; });
          return raw === undefined ? undefined : raw;
        }catch(err){ console.warn("IDB get failed, using localStorage:", err); }
      }
      try{
        const v = localStorage.getItem(LS_PREFIX + key);
        return v == null ? undefined : JSON.parse(v);
      }catch(_){ return undefined; }
    },
    async set(key, value){
      if(mode === "indexeddb"){
        try{
          await tx("readwrite", s => { s.put(value, key); return null; });
          return true;
        }catch(err){
          if(err && (err.name === "QuotaExceededError")){ toast("Storage quota exceeded.", "bad"); }
          else console.warn("IDB set failed, trying localStorage:", err);
        }
      }
      try{ localStorage.setItem(LS_PREFIX + key, JSON.stringify(value)); return true; }
      catch(err){
        toast("Could not persist data: " + (err && err.message ? err.message : "unknown error"), "bad");
        return false;
      }
    },
    async del(key){
      if(mode === "indexeddb"){
        try{ await tx("readwrite", s => { s.delete(key); return null; }); return true; }
        catch(err){ console.warn("IDB delete failed:", err); }
      }
      try{ localStorage.removeItem(LS_PREFIX + key); }catch(_){}
      return true;
    },
    async clearAll(){
      if(mode === "indexeddb"){
        try{ await tx("readwrite", s => { s.clear(); return null; }); return true; }
        catch(err){ console.warn("IDB clear failed:", err); }
      }
      try{
        Object.keys(localStorage).filter(k => k.indexOf(LS_PREFIX) === 0).forEach(k => localStorage.removeItem(k));
      }catch(_){}
      return true;
    },
    async estimate(){
      try{
        if(navigator.storage && navigator.storage.estimate){
          const e = await navigator.storage.estimate();
          return { usage: e.usage || 0, quota: e.quota || 0 };
        }
      }catch(_){}
      return null;
    }
  };
})();

function renderNav(){
  const nav = $("#mainNav");
  nav.innerHTML = NAV_ITEMS.map(item => {
    const current = state.view === item.id ? ' aria-current="page"' : "";
    return '<button class="nav-btn" data-nav="' + escAttr(item.id) + '"' + current + '>' +
      '<span class="ic" aria-hidden="true">' + esc(item.icon) + '</span>' +
      '<span>' + esc(t(item.key)) + '</span></button>';
  }).join("");
}

function navigate(view, param){
  const hash = "#/" + view + (param ? "/" + encodeURIComponent(param) : "");
  if(location.hash === hash) route();
  else location.hash = hash;
}

function route(){
  const raw = location.hash.replace(/^#\/?/, "");
  const parts = raw.split("/").filter(Boolean);
  const view = parts[0] || "dashboard";
  const param = parts[1] ? decodeURIComponent(parts[1]) : null;
  const known = NAV_ITEMS.some(n => n.id === view);
  state.view = known ? view : "dashboard";
  state.param = param;
  render();
}

function render(){
  applyChrome();
  renderNav();
  const main = $("#main");
  const fn = VIEWS[state.view] || VIEWS.dashboard;
  main.innerHTML = fn();
  main.setAttribute("aria-label", t("nav." + state.view));
  if(state.view === "architecture"){ paintArchitecture(); }
  window.scrollTo({ top:0, behavior: state.motion === "reduced" ? "auto" : "smooth" });
}

function applyChrome(){
  const html = document.documentElement;
  html.lang = state.lang;
  html.dir = state.lang === "fa" ? "rtl" : "ltr";
  html.dataset.theme = state.theme;
  html.dataset.motion = state.motion;
  document.documentElement.style.setProperty("--fs", String(state.fontScale));
  const themeBtn = $("#themeBtn");
  themeBtn.textContent = state.theme === "dark" ? "☀" : "☾";
  themeBtn.setAttribute("aria-label", state.theme === "dark" ? "Switch to light theme" : "Switch to dark theme");
  $("#langBtn").setAttribute("aria-label", state.lang === "en" ? "تغییر زبان به فارسی" : "Switch language to English");
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", state.theme === "dark" ? "#080a10" : "#f4f6fb");
  const sub = $("#brandSub");
  if(sub) sub.textContent = t("app.tagline");
}

/* ---------- Explorer ---------- */
VIEWS.explorer = function(){
  const f = state.filters;
  let items = (state.catalog || []).slice();
  const q = f.q.trim().toLowerCase();
  if(q){
    items = items.filter(x =>
      L(x.name).toLowerCase().indexOf(q) !== -1 ||
      x.id.toLowerCase().indexOf(q) !== -1 ||
      L(x.d).toLowerCase().indexOf(q) !== -1 ||
      Llist(x.u).join(" ").toLowerCase().indexOf(q) !== -1 ||
      (x.tags || []).join(" ").toLowerCase().indexOf(q) !== -1
    );
  }
  if(f.cat !== "all") items = items.filter(x => x.cat === f.cat);
  if(f.pricing !== "all") items = items.filter(x => x.pr === f.pricing);
  if(f.curve !== "all") items = items.filter(x => x.cv === f.curve);

  const curveOrder = { easy:0, moderate:1, steep:2 };
  if(f.sort === "name") items.sort((a,b) => L(a.name).localeCompare(L(b.name), state.lang === "fa" ? "fa" : "en"));
  else if(f.sort === "curve") items.sort((a,b) => (curveOrder[a.cv]||9) - (curveOrder[b.cv]||9) || L(a.name).localeCompare(L(b.name)));
  else if(f.sort === "category") items.sort((a,b) => a.cat.localeCompare(b.cat) || L(a.name).localeCompare(L(b.name)));

  return '' +
  '<div class="view-head">' +
    '<div><h1 class="view-title">' + esc(t("exp.title")) + '</h1>' +
    '<p class="view-desc">' + esc(t("exp.desc")) + '</p></div>' +
  '</div>' +

  '<div class="panel" style="margin-bottom:18px">' +
    '<div class="field" style="margin-bottom:10px">' +
      '<label for="expSearch">' + esc(t("common.search")) + '</label>' +
      '<input class="input" id="expSearch" type="search" placeholder="' + escAttr(t("common.search") + "…") + '" value="' + escAttr(f.q) + '" autocomplete="off">' +
    '</div>' +
    '<div class="row" style="margin-bottom:10px">' +
      '<button class="chip" data-filter-cat="all" aria-pressed="' + (f.cat === "all") + '">' + esc(t("common.all")) + '</button>' +
      CATEGORIES.map(c =>
        '<button class="chip" data-filter-cat="' + escAttr(c.id) + '" aria-pressed="' + (f.cat === c.id) + '">' +
        esc(c.icon) + ' ' + esc(state.lang === "fa" ? c.fa : c.en) + '</button>').join("") +
    '</div>' +
    '<div class="row">' +
      '<select class="select" data-filter="pricing" aria-label="' + escAttr(t("common.pricing")) + '" style="max-width:200px">' +
        '<option value="all"' + (f.pricing === "all" ? " selected" : "") + '>' + esc(t("common.pricing")) + ': ' + esc(t("common.all")) + '</option>' +
        Object.keys(PRICING_LABEL).map(k =>
          '<option value="' + escAttr(k) + '"' + (f.pricing === k ? " selected" : "") + '>' +
          esc(state.lang === "fa" ? PRICING_LABEL[k].fa : PRICING_LABEL[k].en) + '</option>').join("") +
      '</select>' +
      '<select class="select" data-filter="curve" aria-label="' + escAttr(t("common.curve")) + '" style="max-width:200px">' +
        '<option value="all"' + (f.curve === "all" ? " selected" : "") + '>' + esc(t("common.curve")) + ': ' + esc(t("common.all")) + '</option>' +
        Object.keys(CURVE_LABEL).map(k =>
          '<option value="' + escAttr(k) + '"' + (f.curve === k ? " selected" : "") + '>' +
          esc(state.lang === "fa" ? CURVE_LABEL[k].fa : CURVE_LABEL[k].en) + '</option>').join("") +
      '</select>' +
      '<select class="select" data-filter="sort" aria-label="' + escAttr(t("exp.sort")) + '" style="max-width:200px">' +
        '<option value="name"' + (f.sort === "name" ? " selected" : "") + '>' + esc(t("exp.sort.name")) + '</option>' +
        '<option value="curve"' + (f.sort === "curve" ? " selected" : "") + '>' + esc(t("exp.sort.curve")) + '</option>' +
        '<option value="category"' + (f.sort === "category" ? " selected" : "") + '>' + esc(t("exp.sort.category")) + '</option>' +
      '</select>' +

      '<span class="spacer"></span>' +
      '<span class="badge">' + esc(items.length) + ' ' + esc(t("exp.results")) + '</span>' +

  (items.length

function relBadge(lv){
  const map = {
    supported:   { cls:"good", key:"compat.supported" },
    conditional: { cls:"warn", key:"compat.conditional" },
    unsupported: { cls:"bad",  key:"compat.unsupported" },
    unknown:     { cls:"",     key:"compat.unknown" }
  };
  const m = map[lv] || map.unknown;
  return '<span class="badge ' + m.cls + '">' + esc(t(m.key)) + '</span>';
}

/** Build the architecture SVG string from the current stack. */
function buildArchitectureSVG(){
  const layers = LAYERS.filter(l => state.stack[l.id]);
  const nodeW = 240, nodeH = 62, gapY = 46, padX = 30, padY = 28;
  const width = nodeW + padX * 2;
  const height = padY * 2 + layers.length * nodeH + Math.max(0, layers.length - 1) * gapY;
  const isRtl = state.lang === "fa";
  const parts = [];
  parts.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + width + ' ' + height + '" width="' + width + '" height="' + height + '" role="img" aria-label="' + escAttr(t("arch.title")) + '">');
  parts.push('<defs>');
  parts.push('<linearGradient id="tasNode" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0%" stop-color="rgba(34,211,238,0.20)"/>' +
    '<stop offset="100%" stop-color="rgba(139,92,246,0.18)"/></linearGradient>');
  parts.push('<marker id="tasArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
    '<path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/></marker>');
  parts.push('</defs>');
  parts.push('<rect x="0" y="0" width="' + width + '" height="' + height + '" fill="none"/>');

  const yFor = i => padY + i * (nodeH + gapY);
  const cx = width / 2;

  layers.forEach((layer, i) => {
    const tech = byId(state.stack[layer.id]);
    if(!tech) return;
    const y = yFor(i);
    const x = cx - nodeW / 2;
    parts.push('<g>');
    parts.push('<rect x="' + x + '" y="' + y + '" width="' + nodeW + '" height="' + nodeH + '" rx="14" ' +
      'fill="url(#tasNode)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>');
    const labelX = isRtl ? x + nodeW - 14 : x + 14;
    const anchor = isRtl ? "end" : "start";
    parts.push('<text x="' + labelX + '" y="' + (y + 24) + '" text-anchor="' + anchor + '" ' +
      'font-family="system-ui, sans-serif" font-size="11" fill="#8d99b3" letter-spacing="1.2">' +
      esc((state.lang === "fa" ? layer.fa : layer.en).toUpperCase()) + '</text>');
    parts.push('<text x="' + labelX + '" y="' + (y + 46) + '" text-anchor="' + anchor + '" ' +
      'font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#e9eef9">' +
      esc(L(tech.name)) + '</text>');
    parts.push('</g>');
    if(i < layers.length - 1){
      const y1 = y + nodeH, y2 = y + nodeH + gapY;
      parts.push('<line x1="' + cx + '" y1="' + y1 + '" x2="' + cx + '" y2="' + (y2 - 2) + '" ' +
        'stroke="#22d3ee" stroke-width="1.6" marker-end="url(#tasArrow)" opacity="0.75"/>');
    }
  });
  parts.push('</svg>');
  return parts.join("");
}

/* ---------- Project Advisor ---------- */
function advisorInput(){
  return state.advisor;
}
function runAdvisor(input){
  const catalog = state.catalog || [];
  const affinity = PROJECT_CATEGORY_AFFINITY[input.projectType] || [];
  const results = [];

  catalog.forEach(tech => {
    let score = 0;
    const why = [];

    /* R1 — project type affinity */
    if(affinity.indexOf(tech.cat) !== -1){
      score += 3;
      why.push({ d:1, en:"Category is relevant to the selected project type (" + catLabel(tech.cat) + ").",
                      fa:"دستهٔ این فناوری با نوع پروژهٔ انتخابی مرتبط است (" + catLabel(tech.cat) + ")." });
    } else {
      score -= 2;
      why.push({ d:-1, en:"Category is not typical for this project type.",
                        fa:"این دسته برای این نوع پروژه معمول نیست." });
    }

    /* R2 — budget */
    if(input.budget === "free-only"){
      if(tech.pr === "oss"){ score += 2; why.push({ d:1, en:"Free and open source — fits a zero-budget constraint.", fa:"رایگان و متن‌باز — با محدودیت بودجهٔ صفر سازگار است." }); }
      else { score -= 4; why.push({ d:-1, en:"Not fully free; conflicts with a zero-budget constraint.", fa:"کاملاً رایگان نیست؛ با محدودیت بودجهٔ صفر تعارض دارد." }); }
    } else if(input.budget === "low"){
      if(tech.pr === "oss"){ score += 1; why.push({ d:1, en:"Open source keeps running costs low.", fa:"متن‌باز هزینهٔ اجرا را پایین نگه می‌دارد." }); }
      else if(tech.pr === "freemium"){ score += 0; why.push({ d:0, en:"Free tier available, but paid limits may apply as usage grows.", fa:"طرح رایگان دارد، اما با رشد مصرف محدودیت‌های پولی ممکن است اعمال شود." }); }
      else { score -= 2; why.push({ d:-1, en:"Typically requires paid usage.", fa:"معمولاً نیازمند پرداخت هزینه است." }); }
    } else {
      if(tech.pr === "freemium" || tech.pr === "paid"){ score += 1; why.push({ d:1, en:"Commercial options can provide support and managed operations.", fa:"گزینه‌های تجاری می‌توانند پشتیبانی و بهره‌برداری مدیریت‌شده فراهم کنند." }); }
    }

    /* R3 — experience level */
    if(input.experience === "beginner"){
      if(tech.cv === "easy"){ score += 2; why.push({ d:1, en:"Learning curve is reported as easy in the catalog.", fa:"شیب یادگیری در کاتالوگ آسان ثبت شده است." }); }
      else if(tech.cv === "steep"){ score -= 3; why.push({ d:-1, en:"Steep learning curve for a beginner team.", fa:"شیب یادگیری برای تیم مبتدی دشوار است." }); }
    } else if(input.experience === "advanced"){
      if(tech.cv === "steep"){ score += 1; why.push({ d:1, en:"Advanced team can absorb the steeper learning curve.", fa:"تیم پیشرفته می‌تواند شیب یادگیری دشوارتر را بپذیرد." }); }
    }

    /* R4 — devices */
    if(input.devices.length){
      const needsMobile = input.devices.indexOf("mobile") !== -1;
      const needsDesktop = input.devices.indexOf("desktop") !== -1;
      if(needsMobile && tech.tags.indexOf("mobile") !== -1){
        score += 3; why.push({ d:1, en:"Catalog tags mark this as mobile-relevant.", fa:"برچسب‌های کاتالوگ این را مرتبط با موبایل معرفی می‌کنند." });
      }
      if(needsDesktop && tech.tags.indexOf("desktop") !== -1){
        score += 2; why.push({ d:1, en:"Catalog tags mark this as desktop-relevant.", fa:"برچسب‌های کاتالوگ این را مرتبط با دسکتاپ معرفی می‌کنند." });
      }
    }

    /* R5 — offline requirement */
    if(input.offline){
      if(tech.tags.indexOf("offline") !== -1 || tech.tags.indexOf("pwa") !== -1){
        score += 2; why.push({ d:1, en:"Supports offline or installable-web patterns.", fa:"الگوهای آفلاین یا وب نصب‌شدنی را پشتیبانی می‌کند." });
      }
      if(tech.cat === "hosting" || tech.cat === "devops"){ score -= 1; }
    }

    /* R6 — hosting preference */
    if(input.hosting === "static"){
      if(tech.tags.indexOf("static-friendly") !== -1){ score += 2; why.push({ d:1, en:"Can be served from static hosting.", fa:"قابل ارائه از میزبانی ایستا است." }); }
      if(tech.cat === "backend" || tech.cat === "runtime" || tech.cat === "cms"){ score -= 2; why.push({ d:-1, en:"Normally requires a server runtime, which static hosting cannot provide.", fa:"معمولاً به محیط اجرای سرور نیاز دارد که میزبانی ایستا فراهم نمی‌کند." }); }
    } else if(input.hosting === "serverless"){
      if(tech.tags.indexOf("serverless") !== -1 || tech.tags.indexOf("static-friendly") !== -1){ score += 1; }
      if(tech.cat === "cms"){ score -= 2; why.push({ d:-1, en:"CMS platforms typically need a persistent server and database.", fa:"سامانه‌های مدیریت محتوا معمولاً به سرور پایدار و پایگاه‌داده نیاز دارند." }); }
    } else if(input.hosting === "server"){
      if(tech.cat === "backend" || tech.cat === "runtime" || tech.cat === "database"){ score += 1; }
    }

    /* R7–R11 — priorities */
    input.priorities.forEach(p => {
      if(p === "performance" && tech.tags.indexOf("performance") !== -1){
        score += 2; why.push({ d:1, en:"Tagged as performance-oriented in the catalog.", fa:"در کاتالوگ با برچسب کارایی‌محور مشخص شده است." });
      }
      if(p === "security" && tech.tags.indexOf("secure-strong") !== -1){
        score += 2; why.push({ d:1, en:"Tagged with strong security characteristics.", fa:"با ویژگی‌های امنیتی قوی برچسب‌گذاری شده است." });
      }
      if(p === "accessibility" && (tech.tags.indexOf("a11y-strong") !== -1)){
        score += 2; why.push({ d:1, en:"Relevant to accessible interface delivery.", fa:"برای ارائهٔ رابط دسترس‌پذیر مرتبط است." });
      }
      if(p === "maintainability" && tech.tags.indexOf("maint-strong") !== -1){
        score += 2; why.push({ d:1, en:"Tagged as maintainability-friendly for larger codebases.", fa:"برای کدبیس‌های بزرگ‌تر با برچسب نگهداشت‌پذیری مناسب." });
      }
      if(p === "ecosystem" && tech.tags.indexOf("huge-ecosystem") !== -1){
        score += 2; why.push({ d:1, en:"Very large ecosystem, which helps hiring and library availability.", fa:"اکوسیستم بسیار بزرگ که به استخدام و دسترسی به کتابخانه کمک می‌کند." });
      }
      if(p === "speed" && (tech.cv === "easy" || tech.tags.indexOf("beginner-friendly") !== -1)){
        score += 1; why.push({ d:1, en:"Quick to adopt, which shortens time to first release.", fa:"پذیرش سریع که زمان تا نخستین انتشار را کوتاه می‌کند." });
      }
      if(p === "lowcost" && tech.pr === "oss"){
        score += 1; why.push({ d:1, en:"No licence cost.", fa:"بدون هزینهٔ مجوز." });
      }
    });

    /* R12 — team size */
    if(input.teamSize === "large" && tech.tags.indexOf("large-team") !== -1){
      score += 2; why.push({ d:1, en:"Suits larger teams through opinionated structure and typing.", fa:"با ساختار نظر‌محور و تایپ‌دار برای تیم‌های بزرگ‌تر مناسب است." });
    }
    if(input.teamSize === "solo" && tech.tags.indexOf("large-team") !== -1 && tech.cv === "steep"){
      score -= 1; why.push({ d:-1, en:"Its structure may be heavier than a solo developer needs.", fa:"ساختار آن ممکن است برای یک توسعه‌دهندهٔ تنها سنگین‌تر از حد نیاز باشد." });
    }

    /* R13 — AI/data project specialisation */
    if(input.projectType === "ai-data" && tech.cat === "aidata"){
      score += 3; why.push({ d:1, en:"Directly belongs to the AI and data category required by this project.", fa:"مستقیماً به دستهٔ هوش مصنوعی و دادهٔ مورد نیاز این پروژه تعلق دارد." });
    }

    if(score > 0) results.push({ tech:tech, score:score, why:why });
  });

  results.sort((a,b) => b.score - a.score || L(a.tech.name).localeCompare(L(b.tech.name)));
  return results;
}

function findRelation(a, b){
  return RELATIONS.find(r => (r.a === a && r.b === b) || (r.a === b && r.b === a)) || null;
}

};

/* ---------- Docs & QA ---------- */
function docsReadme(){
  return [
"# TECH ATLAS STUDIO",
"",
"An interactive, bilingual (English / Persian) atlas of software technologies.",
"Single file. No build step. No backend. No external dependencies at runtime.",
"",
"## Running locally",
"1. Save this file as `index.html`.",
"2. Double-click it, or serve the folder: `python3 -m http.server 8080` then open http://localhost:8080/",
"   (Serving over http:// rather than file:// gives the most reliable IndexedDB behaviour.)",
"",
"## Installing on iPhone / iPad",
"1. Open the page in Safari.",
"2. Tap the Share button.",
"3. Choose 'Add to Home Screen'.",
"4. Launch it from the home screen — it opens without browser chrome.",
"",
"Note: a fully offline install needs a real service worker file (see 'PWA files' below).",
"Without one the app opens from cache-less network access, but all *data* features",
"(catalog, comparisons, stacks, workspaces) work offline because the catalog is embedded.",
"",
"## Deploying to GitHub Pages",
"1. Create a repository and add `index.html` at the root (or in `/docs`).",
"2. Repository Settings → Pages → Source: 'Deploy from a branch'.",
"3. Choose the branch and folder, then save.",
"4. Wait for the deployment, then open the published URL.",
"",
"GitHub Pages serves static files only. It cannot run backend scripts, cron jobs,",
"or any server-side catalog check. Automated checks must run in GitHub Actions",
"(see the GitHub Actions tab).",
"",
"## Backups",
"* Settings → 'Export all local data' writes a single JSON file containing preferences,",
"  workspaces, stack, comparison and any catalog override.",
"* Update Center → 'Export active catalog' writes just the catalog.",
"* Workspaces → 'Export all workspaces' writes only the workspace list.",
"* Restore with the matching Import button. Imports are validated before anything is written.",
"* There is no cloud sync. Browser storage is per-device and per-browser-profile.",
"",
"## PWA files (optional, for a full offline install)",
"Create these two files next to `index.html` and the app will register them automatically",
"if you add the registration snippet shown in the Docs. Without them, the app still works;",
"it simply will not pre-cache its own shell.",
"",
"`manifest.webmanifest`:",
"{",
'  "name": "Tech Atlas Studio",',
'  "short_name": "Tech Atlas",',
'  "start_url": "./index.html",',
'  "display": "standalone",',
'  "background_color": "#070910",',
'  "theme_color": "#070910",',
'  "icons": [{ "src": "icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable" }]',
"}",
"",
"`sw.js`:",
"const CACHE = 'tech-atlas-v1';",
"const ASSETS = ['./', './index.html', './manifest.webmanifest'];",
"self.addEventListener('install', e => {",
"  e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)).then(() => self.skipWaiting()));",
"});",
"self.addEventListener('activate', e => {",
"  e.waitUntil(caches.keys().then(ks => Promise.all(",
"    ks.filter(k => k !== CACHE).map(k => caches.delete(k)))).then(() => self.clients.claim()));",
"});",
"self.addEventListener('fetch', e => {",
"  if (e.request.method !== 'GET') return;",
"  e.respondWith(",
"    caches.match(e.request).then(hit => hit || fetch(e.request).then(res => {",
"      const copy = res.clone();",
"      caches.open(CACHE).then(c => c.put(e.request, copy)).catch(() => {});",
"      return res;",
"    }).catch(() => caches.match('./index.html')))",
"  );",
"});",
"",
"Then add this to `index.html` before `</body>`:",
"<script>",
"if ('serviceWorker' in navigator) {",
"  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));",
"}",
"</" + "script>",
"",
"## Limitations (disclosed honestly)",
"1. **No live version or price data.** The catalog deliberately contains no version numbers,",
"   release dates or prices. Those change constantly and cannot be verified offline.",
"   Each record instead carries a stable snapshot date and links to official documentation.",
"2. **Compatibility data is curated, not exhaustive.** 60 relationships are recorded.",
"   Any pair without a recorded relationship is reported as *Unknown*, never as unsupported.",
"3. **The Advisor is rule-based.** Scores come from catalog attributes, not benchmarks.",
"4. **GitHub Pages cannot run backend jobs.** Remote catalog checks run in the browser",
"   and require the remote file to send permissive CORS headers.",
"5. **Local storage is not secure storage.** It is unencrypted, readable by anyone with",
"   access to the browser profile, and never synchronised between devices.",
"6. **Installability is best-effort.** The manifest is injected at runtime from a data URL.",
"   For guaranteed installability, ship the separate `manifest.webmanifest` and `sw.js` above."
  ].join("\n");
}

function docsRules(){
  return [
"# Recommendation rules",
"",
"The advisor scores every catalog record against the form inputs and returns a ranked list.",
"Every point added or removed is shown to the user with a plain-language reason.",
"No technology is ever described as universally best.",
"",
"| Rule | Input | Effect |",
"|---|---|---|",
"| R1 | Project type | +3 if the record's category is in that project type's affinity list; −2 otherwise. |",
"| R2a | Budget = free only | +2 for `oss`; −4 for anything else. |",
"| R2b | Budget = low | +1 for `oss`; 0 for `freemium` (with a caveat message); −2 for `paid` / `paid-usage`. |",
"| R2c | Budget = flexible | +1 for `freemium` / `paid`. |",
"| R3a | Experience = beginner | +2 for `easy` curve; −3 for `steep`. |",
"| R3b | Experience = advanced | +1 for `steep`. |",
"| R4 | Devices | +3 if mobile is required and the record is tagged `mobile`; +2 if desktop is required and tagged `desktop`. |",
"| R5 | Offline required | +2 if tagged `offline` or `pwa`; −1 for hosting/devops categories. |",
"| R6a | Hosting = static | +2 if tagged `static-friendly`; −2 for backend, runtime or CMS categories. |",
"| R6b | Hosting = serverless | +1 if tagged `serverless` or `static-friendly`; −2 for CMS. |",
"| R6c | Hosting = server | +1 for backend, runtime or database categories. |",
"| R7 | Priority: performance | +2 if tagged `performance`. |",
"| R8 | Priority: security | +2 if tagged `secure-strong`. |",
"| R9 | Priority: accessibility | +2 if tagged `a11y-strong`. |",
"| R10 | Priority: maintainability | +2 if tagged `maint-strong`. |",
"| R11 | Priority: ecosystem | +2 if tagged `huge-ecosystem`. |",
"| R12 | Priority: speed to market | +1 if `easy` curve or tagged `beginner-friendly`. |",
"| R13 | Priority: low running cost | +1 for `oss`. |",
"| R14 | Team size = large | +2 if tagged `large-team`. |",
"| R15 | Team size = solo | −1 if tagged `large-team` **and** the curve is `steep`. |",
"| R16 | Project type = AI / data | +3 for records in the AI & data category. |",
"",
"Records scoring zero or below are not shown. The top 18 are displayed.",

"## Stack Builder",
"Layers are fixed (see the layer table). Each layer offers only records whose category",

}

function docsWorkflow(){
  return [
"# Automated catalog check with GitHub Actions",
"",
"GitHub Pages cannot run scheduled jobs. This workflow runs on GitHub's own runners,",
"uses the minimum permissions required, and produces a reviewable artefact rather than",
"pushing anything automatically.",
"",
"Save as `.github/workflows/catalog-check.yml`:",
"",
"name: Catalog check",
"",
"on:",
"  schedule:",
"    - cron: '0 6 * * 1'   # every Monday at 06:00 UTC",
"  workflow_dispatch:",
"",
"permissions:",
"  contents: read",
"",
"jobs:",
"  validate:",
"    runs-on: ubuntu-latest",
"    steps:",
"      - name: Checkout",
"        uses: actions/checkout@v4",
"",
"      - name: Set up Node.js",
"        uses: actions/setup-node@v4",
"        with:",
"          node-version: '20'",
"",
"      - name: Fetch remote catalog",
"        run: |",
"          curl --fail --silent --show-error --location \\",
"            --max-time 30 \\",
"            --retry 2 --retry-delay 3 \\",
"            -o /tmp/remote-catalog.json \\",
"            \"${{ vars.CATALOG_URL }}\"",
"",
"      - name: Validate schema",
"        run: |",
"          node -e \"",
"          const fs = require('fs');",
"          const data = JSON.parse(fs.readFileSync('/tmp/remote-catalog.json','utf8'));",
"          if (!Array.isArray(data) || data.length === 0) { console.error('Not a non-empty array'); process.exit(1); }",
"          const seen = new Set();",
"          for (const r of data) {",
"            for (const k of ['id','cat','name','d','docs','lic','pr','st','cv']) {",
"              if (!(k in r)) { console.error('Missing field', k, 'in', r.id); process.exit(1); }",
"            }",
"            if (seen.has(r.id)) { console.error('Duplicate id', r.id); process.exit(1); }",
"            seen.add(r.id);",
"          }",
"          console.log('Validated', data.length, 'records');",
"          \"",
"",
"      - name: Diff against the built-in catalog",
"        run: |",
"          node -e \"",
"          const fs = require('fs');",
"          const remote = JSON.parse(fs.readFileSync('/tmp/remote-catalog.json','utf8'));",
"          const html = fs.readFileSync('index.html','utf8');",
"          const m = html.match(/const CATALOG = (\\[[\\s\\S]*?\\n\\];)/);",
"          if (!m) { console.error('Could not locate CATALOG in index.html'); process.exit(1); }",
"          const local = eval(m[1].replace(/;$/,''));",
"          const localIds = new Set(local.map(r => r.id));",
"          const remoteIds = new Set(remote.map(r => r.id));",
"          const added = [...remoteIds].filter(i => !localIds.has(i));",
"          const removed = [...localIds].filter(i => !remoteIds.has(i));",
"          console.log('Added:', added.join(', ') || 'none');",
"          console.log('Removed:', removed.join(', ') || 'none');",
"          \"",
"",
"      - name: Upload the fetched catalog",
"        uses: actions/upload-artifact@v4",
"        with:",
"          name: remote-catalog",
"          path: /tmp/remote-catalog.json",
"          retention-days: 14",
"",
"## Notes on this workflow",
"* `permissions: contents: read` — the workflow cannot write to the repository.",
"* Nothing is committed. The result is an artefact a human downloads and reviews.",
"* The catalog URL is stored as a repository *variable*, not in source code,",
"  so no credentials or private endpoints appear in the file.",
"* To apply the update, download the artefact and use Update Center →",
"  'Import catalog JSON' in the app, then approve the diff.",
"",
"## Rate limits and failure behaviour",
"The workflow uses `curl --fail --retry 2`. If the source is unreachable, rate-limited,",
"or returns malformed JSON, the job fails with a non-zero exit code and no artefact is",
"produced — nothing is silently accepted."
  ].join("\n");
}

/* --- catalog validation & diff --- */
function validateCatalog(data){
  const errors = [];
  if(!Array.isArray(data)){ errors.push("Root value must be a JSON array."); return { ok:false, errors:errors }; }
  if(data.length === 0){ errors.push("Catalog array is empty."); return { ok:false, errors:errors }; }
  const knownCat = CATEGORIES.map(c => c.id);
  const prOk = Object.keys(PRICING_LABEL);
  const stOk = Object.keys(STATUS_LABEL);
  const cvOk = Object.keys(CURVE_LABEL);
  const seen = Object.create(null);
  const cleaned = [];

  data.forEach((rec, i) => {
    const at = "Record #" + (i + 1);
    if(!isPlainObject(rec)){ errors.push(at + ": not an object."); return; }
    const need = ["id","cat","name","d","u","p","c","r","cp","alt","docs","lic","pr","st","cv","tags","v","s"];
    const missing = need.filter(k => !(k in rec));
    if(missing.length){ errors.push(at + ": missing field(s) " + missing.join(", ") + "."); return; }
    if(typeof rec.id !== "string" || !/^[a-z0-9._-]{1,64}$/.test(rec.id)){
      errors.push(at + ": id must match /^[a-z0-9._-]{1,64}$/."); return;
    }
    if(seen[rec.id]){ errors.push(at + ": duplicate id '" + rec.id + "'."); return; }
    seen[rec.id] = true;
    if(typeof rec.cat !== "string" || knownCat.indexOf(rec.cat) === -1){
      errors.push(at + " (" + rec.id + "): unknown category '" + rec.cat + "'."); return;
    }
    function pairOf(v, label){
      if(!Array.isArray(v) || v.length !== 2 || typeof v[0] !== "string" || typeof v[1] !== "string"){
        errors.push(at + " (" + rec.id + "): " + label + " must be [englishString, persianString].");
        return false;
      }
      return true;
    }
    function listPairOf(v, label){
      if(!Array.isArray(v) || v.length !== 2 || !Array.isArray(v[0]) || !Array.isArray(v[1])){
        errors.push(at + " (" + rec.id + "): " + label + " must be [[englishList], [persianList]].");
        return false;
      }
      return true;
    }
    let ok = true;
    ok = pairOf(rec.name, "name") && ok;
    ok = pairOf(rec.d, "d") && ok;
    ok = pairOf(rec.cp, "cp") && ok;
    ok = listPairOf(rec.u, "u") && ok;
    ok = listPairOf(rec.p, "p") && ok;
    ok = listPairOf(rec.c, "c") && ok;
    ok = listPairOf(rec.r, "r") && ok;
    if(!ok) return;
    if(prOk.indexOf(rec.pr) === -1){ errors.push(at + " (" + rec.id + "): pr must be one of " + prOk.join(", ") + "."); return; }
    if(stOk.indexOf(rec.st) === -1){ errors.push(at + " (" + rec.id + "): st must be one of " + stOk.join(", ") + "."); return; }
    if(cvOk.indexOf(rec.cv) === -1){ errors.push(at + " (" + rec.id + "): cv must be one of " + cvOk.join(", ") + "."); return; }
    if(!Array.isArray(rec.alt) || !Array.isArray(rec.tags) || !Array.isArray(rec.s)){
      errors.push(at + " (" + rec.id + "): alt, tags and s must be arrays."); return;
    }
    function safeUrl(u){
      try{ const p = new URL(String(u), "https://example.invalid"); return p.protocol === "http:" || p.protocol === "https:"; }
      catch(_){ return false; }
    }
    if(!safeUrl(rec.docs)){ errors.push(at + " (" + rec.id + "): docs must be an http(s) URL."); return; }
    const badSrc = rec.s.filter(u => !safeUrl(u));
    if(badSrc.length){ errors.push(at + " (" + rec.id + "): sources contain non-http(s) URLs."); return; }
    const tooLong = ["id","lic","v"].concat([]).some(k => String(rec[k]).length > 5000);
    if(tooLong){ errors.push(at + " (" + rec.id + "): a text field exceeds 5000 characters."); return; }

    cleaned.push({
      id: rec.id,
      cat: rec.cat,
      name: [String(rec.name[0]).slice(0,500), String(rec.name[1]).slice(0,500)],
      d: [String(rec.d[0]).slice(0,5000), String(rec.d[1]).slice(0,5000)],
      u: [rec.u[0].map(x => String(x).slice(0,500)), rec.u[1].map(x => String(x).slice(0,500))],
      p: [rec.p[0].map(x => String(x).slice(0,500)), rec.p[1].map(x => String(x).slice(0,500))],
      c: [rec.c[0].map(x => String(x).slice(0,500)), rec.c[1].map(x => String(x).slice(0,500))],
      r: [rec.r[0].map(x => String(x).slice(0,500)), rec.r[1].map(x => String(x).slice(0,500))],
      cp: [String(rec.cp[0]).slice(0,2000), String(rec.cp[1]).slice(0,2000)],
      alt: rec.alt.map(String).slice(0, 40),
      docs: String(rec.docs).slice(0, 2000),
      lic: String(rec.lic).slice(0, 500),
      pr: rec.pr, st: rec.st, cv: rec.cv,
      tags: rec.tags.map(String).slice(0, 40),
      v: String(rec.v).slice(0, 40),
      s: rec.s.map(String).slice(0, 20)
    });
  });

  return { ok: errors.length === 0, errors: errors, cleaned: cleaned };
}

function diffCatalogs(oldList, newList){
  const oldMap = {}; oldList.forEach(r => { oldMap[r.id] = r; });
  const newMap = {}; newList.forEach(r => { newMap[r.id] = r; });
  const added = newList.filter(r => !oldMap[r.id]).map(r => r.id);
  const removed = oldList.filter(r => !newMap[r.id]).map(r => r.id);
  const changed = [];
  newList.forEach(nr => {
    const or = oldMap[nr.id];
    if(!or) return;
    const fields = [];
    ["cat","lic","pr","st","cv","v","docs"].forEach(f => {
      if(String(or[f]) !== String(nr[f])) fields.push(f);
    });
    ["name","d","cp"].forEach(f => {
      if(JSON.stringify(or[f]) !== JSON.stringify(nr[f])) fields.push(f);
    });
    ["u","p","c","r"].forEach(f => {
      if(JSON.stringify(or[f]) !== JSON.stringify(nr[f])) fields.push(f);
    });
    ["alt","tags","s"].forEach(f => {
      if(JSON.stringify(or[f] || []) !== JSON.stringify(nr[f] || [])) fields.push(f);
    });
    if(fields.length) changed.push({ id: nr.id, fields: fields });
  });
  const lines = [];
  lines.push("ADDED (" + added.length + "): " + (added.join(", ") || "—"));
  lines.push("REMOVED (" + removed.length + "): " + (removed.join(", ") || "—"));
  lines.push("CHANGED (" + changed.length + "):");
  if(changed.length){
    changed.forEach(c => lines.push("  " + c.id + " → " + c.fields.join(", ")));
  } else {
    lines.push("  —");
  }
  lines.push("");
  lines.push("Old record count: " + oldList.length);
  lines.push("New record count: " + newList.length);
  return { added: added, removed: removed, changed: changed, diffText: lines.join("\n") };
}
