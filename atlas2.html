   ========================================================================== */
document.addEventListener("click", async e => {
  const navEl = e.target.closest("[data-nav]");
  if(navEl){ e.preventDefault(); navigate(navEl.dataset.nav); return; }

  const navCat = e.target.closest("[data-nav-cat]");
  if(navCat){ state.filters.cat = navCat.dataset.navCat; state.filters.q = ""; navigate("explorer"); return; }

  const openTech = e.target.closest("[data-open-tech]");
  if(openTech){
    if(openTech.dataset.toggleCompare) return;
    navigate("tech", openTech.dataset.openTech);
    return;
  }

  const cmpBtn = e.target.closest("[data-toggle-compare]");
  if(cmpBtn){ e.stopPropagation(); toggleCompare(cmpBtn.dataset.toggleCompare); return; }

  const filterCat = e.target.closest("[data-filter-cat]");
  if(filterCat){ state.filters.cat = filterCat.dataset.filterCat; render(); return; }

  const advDev = e.target.closest("[data-adv-device]");
  if(advDev){
    const d = advDev.dataset.advDevice;
    const i = state.advisor.devices.indexOf(d);
    if(i === -1) state.advisor.devices.push(d); else state.advisor.devices.splice(i, 1);
    state.advisor.ran = false;
    Store.set(KEYS.advisor, state.advisor);
    render();
    return;
  }
  const advPri = e.target.closest("[data-adv-priority]");
  if(advPri){
    const p = advPri.dataset.advPriority;
    const i = state.advisor.priorities.indexOf(p);
    if(i === -1) state.advisor.priorities.push(p); else state.advisor.priorities.splice(i, 1);
    state.advisor.ran = false;
    Store.set(KEYS.advisor, state.advisor);
    render();
    return;
  }

  const stackClear = e.target.closest("[data-stack-clear]");
  if(stackClear){
    delete state.stack[stackClear.dataset.stackClear];
    delete state.stackNotes[stackClear.dataset.stackClear];
    await persistStack();
    render();
    return;
  }

  const docsTab = e.target.closest("[data-docs-tab]");
  if(docsTab){ state.docsTab = docsTab.dataset.docsTab; render(); return; }

  const setLang = e.target.closest("[data-set-lang]");
  if(setLang){
    state.lang = setLang.dataset.setLang;
    await persistPrefs();
    render();
    return;
  }
  const setTheme = e.target.closest("[data-set-theme]");
  if(setTheme){
    state.theme = setTheme.dataset.setTheme;
    await persistPrefs();
    render();
    return;
  }
  const setMotion = e.target.closest("[data-set-motion]");
  if(setMotion){
    state.motion = setMotion.dataset.setMotion;
    await persistPrefs();
    render();
    return;
  }

  const openWs = e.target.closest("[data-open-ws]");
  if(openWs){ openWorkspace(openWs.dataset.openWs); return; }

  const dupWs = e.target.closest("[data-dup-ws]");
  if(dupWs){
    const w = state.workspaces.find(x => x.id === dupWs.dataset.dupWs);
    if(w){
      const copy = clone(w);
      copy.id = uid("ws");
      copy.name = w.name + " (copy)";
      copy.createdAt = nowIso(); copy.updatedAt = nowIso();
      state.workspaces.unshift(copy);
      await persistWorkspaces();
      toast(t("toast.saved"), "good");
      render();
    }
    return;
  }
  const delWs = e.target.closest("[data-del-ws]");
  if(delWs){
    if(confirm(t("ws.deleteConfirm"))){
      state.workspaces = state.workspaces.filter(x => x.id !== delWs.dataset.delWs);
      await persistWorkspaces();
      toast(t("toast.deleted"), "good");
      render();
    }
    return;
  }
  const expWs = e.target.closest("[data-export-ws]");
  if(expWs){
    const w = state.workspaces.find(x => x.id === expWs.dataset.exportWs);
    if(w) downloadJson("tech-atlas-workspace-" + w.id + ".json", w);
    return;
  }

  const closeBtn = e.target.closest("[data-close-modal]");
  if(closeBtn && closeBtn.classList.contains("btn")){ closeModal(); return; }

  const actionEl = e.target.closest("[data-action]");
  if(!actionEl) return;
  const action = actionEl.dataset.action;

  switch(action){
    case "clear-activity":
      state.activity = [];
      await Store.set(KEYS.activity, []);
      render();
      break;

    case "reset-filters":
      state.filters = { q:"", cat:"all", pricing:"all", curve:"all", sort:"name" };
      render();
      break;

    case "compare-clear":
      state.compare = [];
      await persistCompare();
      render();
      break;

    case "stack-clear":
      state.stack = {}; state.stackNotes = {};
      await persistStack();
      render();
      break;

    case "stack-save":
      saveStackAsWorkspace();
      break;

    case "adv-run":
      state.advisor.ran = true;
      await Store.set(KEYS.advisor, state.advisor);
      await logActivity("advisor", state.lang === "fa" ? "اجرای مشاور پروژه" : "Ran Project Advisor");
      render();
      break;

    case "adv-reset":
      state.advisor = {
        projectType:"web-app", budget:"free-only", experience:"intermediate",
        devices:[], offline:false, hosting:"static", teamSize:"solo", priorities:[], ran:false
      };
      await Store.set(KEYS.advisor, state.advisor);
      render();
      break;

    case "export-svg": {
      const svg = buildArchitectureSVG();
      if(!svg){ toast(t("arch.empty"), "warn"); break; }
      downloadBlob("tech-atlas-architecture.svg", svg, "image/svg+xml");
      await logActivity("export", state.lang === "fa" ? "خروجی نقشهٔ معماری" : "Exported architecture map");
      break;
    }

    case "export-catalog":
      downloadJson("tech-atlas-catalog.json", state.catalog || []);
      toast(t("toast.saved"), "good");
      break;

    case "import-catalog":
      pickFile(".json,application/json", async (text, name) => {
        let parsed;
        try{ parsed = JSON.parse(text); }
        catch(err){ toast("Import failed: invalid JSON (" + err.message + ")", "bad"); return; }
        const result = validateCatalog(parsed);
        if(!result.ok){
          toast("Catalog rejected: " + result.errors[0], "bad");
          console.warn("[Tech Atlas Studio] Catalog validation errors:", result.errors);
          return;
        }
        await Store.set(KEYS.rollback, { catalog: clone(state.catalog), meta: clone(state.catalogMeta) });
        state.catalog = result.cleaned;
        state.catalogMeta = {
          version: CATALOG_FORMAT_VERSION,
          snapshot: String((result.cleaned[0] && result.cleaned[0].v) || state.catalogMeta.snapshot),
          origin: "imported:" + name,
          updatedAt: nowIso(),
          count: result.cleaned.length
        };
        await Store.set(KEYS.catalog, { catalog: state.catalog, meta: state.catalogMeta });
        await logActivity("catalog", (state.lang === "fa" ? "ورود کاتالوگ: " : "Imported catalog: ") + name);
        toast(t("upd.applied"), "good");
        render();
      });
      break;

    case "rollback-catalog": {
      const snap = await Store.get(KEYS.rollback);
      if(!snap || !snap.catalog){ toast(t("upd.noRollback"), "warn"); break; }
      state.catalog = snap.catalog;
      state.catalogMeta = snap.meta || state.catalogMeta;
      await Store.set(KEYS.catalog, { catalog: state.catalog, meta: state.catalogMeta });
      await Store.del(KEYS.rollback);
      await logActivity("catalog", state.lang === "fa" ? "بازگردانی کاتالوگ" : "Rolled back catalog");
      toast(t("upd.rolledBack"), "good");
      render();
      break;
    }

    case "check-update": {
      const urlInput = $("#updUrl");
      const url = urlInput ? urlInput.value.trim() : "";
      if(!/^https?:\/\//i.test(url)){ toast("Enter a valid http(s) catalog URL.", "warn"); return; }
      actionEl.disabled = true;
      const originalLabel = actionEl.innerHTML;
      actionEl.innerHTML = "… " + esc(t("upd.fetching"));
      try{
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 20000);
        const res = await fetch(url, { signal: controller.signal, headers: { "Accept":"application/json" }, mode:"cors" });
        clearTimeout(timer);
        if(!res.ok){ throw new Error("HTTP " + res.status + " " + res.statusText); }
        const text = await res.text();
        let parsed;
        try{ parsed = JSON.parse(text); }
        catch(err){ throw new Error("The response is not valid JSON: " + err.message); }
        const result = validateCatalog(parsed);
        if(!result.ok){ throw new Error("Schema validation failed — " + result.errors[0]); }
        const diff = diffCatalogs(state.catalog || [], result.cleaned);
        if(!diff.added.length && !diff.removed.length && !diff.changed.length){
          toast(t("upd.noChange"), "good");
          state.pendingUpdate = null;
        } else {
          state.pendingUpdate = {
            catalog: result.cleaned,
            added: diff.added, removed: diff.removed, changed: diff.changed,
            diffText: diff.diffText, source: url
          };
          toast(t("upd.diff") + ": +" + diff.added.length + " / −" + diff.removed.length + " / ~" + diff.changed.length, "warn");
        }
        await logActivity("catalog", (state.lang === "fa" ? "بررسی منبع کاتالوگ: " : "Checked catalog source: ") + url);
      }catch(err){
        const msg = err && err.name === "AbortError"
          ? "The request timed out after 20 seconds."
          : (err && err.message ? err.message : "Unknown network error.");
        toast("Catalog check failed: " + msg, "bad");
      }finally{
        actionEl.disabled = false;
        actionEl.innerHTML = originalLabel;
        render();
      }
      break;
    }

    case "apply-update": {
      if(!state.pendingUpdate) break;
      await Store.set(KEYS.rollback, { catalog: clone(state.catalog), meta: clone(state.catalogMeta) });
      state.catalog = state.pendingUpdate.catalog;
      state.catalogMeta = {
        version: CATALOG_FORMAT_VERSION,
        snapshot: String((state.catalog[0] && state.catalog[0].v) || state.catalogMeta.snapshot),
        origin: "remote:" + state.pendingUpdate.source,
        updatedAt: nowIso(),
        count: state.catalog.length
      };
      state.pendingUpdate = null;
      await Store.set(KEYS.catalog, { catalog: state.catalog, meta: state.catalogMeta });
      await logActivity("catalog", state.lang === "fa" ? "اعمال به‌روزرسانی کاتالوگ" : "Applied catalog update");
      toast(t("upd.applied"), "good");
      render();
      break;
    }

    case "cancel-update":
      state.pendingUpdate = null;
      render();
      break;

    case "export-all": {
      const payload = {
        app: "Tech Atlas Studio",
        appVersion: APP_VERSION,
        exportedAt: nowIso(),
        prefs: { lang: state.lang, theme: state.theme, motion: state.motion, fontScale: state.fontScale },
        workspaces: state.workspaces,
        stack: state.stack,
        stackNotes: state.stackNotes,
        compare: state.compare,
        advisor: state.advisor,
        activity: state.activity,
        catalogMeta: state.catalogMeta,
        catalog: state.catalog
      };
      downloadJson("tech-atlas-backup-" + new Date().toISOString().slice(0,10) + ".json", payload);
      await logActivity("export", state.lang === "fa" ? "پشتیبان‌گیری کامل" : "Full backup exported");
      break;
    }

    case "import-all":
      pickFile(".json,application/json", async (text, name) => {
        let data;
        try{ data = JSON.parse(text); }
        catch(err){ toast(t("ws.importFailed") + " invalid JSON (" + err.message + ")", "bad"); return; }
        if(!isPlainObject(data)){ toast(t("ws.importFailed") + " root must be an object.", "bad"); return; }

        if(data.prefs && isPlainObject(data.prefs)){
          if(data.prefs.lang === "en" || data.prefs.lang === "fa") state.lang = data.prefs.lang;
          if(data.prefs.theme === "dark" || data.prefs.theme === "light") state.theme = data.prefs.theme;
          if(data.prefs.motion === "full" || data.prefs.motion === "reduced") state.motion = data.prefs.motion;
          const fs = Number(data.prefs.fontScale);
          if(isFinite(fs) && fs >= 0.85 && fs <= 1.3) state.fontScale = fs;
        }
        if(Array.isArray(data.workspaces)){
          const valid = data.workspaces.filter(w =>
            isPlainObject(w) && typeof w.name === "string" && Array.isArray(w.items) &&
            ["stack","compare","advisor","notes"].indexOf(w.kind) !== -1);
          state.workspaces = valid.map(w => ({
            id: typeof w.id === "string" ? w.id : uid("ws"),
            name: String(w.name).slice(0, 200),
            kind: w.kind,
            items: w.items.map(String).slice(0, 60),
            stack: isPlainObject(w.stack) ? w.stack : {},
            notes: isPlainObject(w.notes) ? w.notes : {},
            createdAt: typeof w.createdAt === "string" ? w.createdAt : nowIso(),
            updatedAt: typeof w.updatedAt === "string" ? w.updatedAt : nowIso()
          }));
        }
        if(isPlainObject(data.stack)) state.stack = data.stack;
        if(isPlainObject(data.stackNotes)) state.stackNotes = data.stackNotes;
        if(Array.isArray(data.compare)) state.compare = data.compare.map(String).slice(0, 4);
        if(isPlainObject(data.advisor)) state.advisor = Object.assign(state.advisor, data.advisor);

        if(Array.isArray(data.catalog)){
          const result = validateCatalog(data.catalog);
          if(result.ok){
            await Store.set(KEYS.rollback, { catalog: clone(state.catalog), meta: clone(state.catalogMeta) });
            state.catalog = result.cleaned;
            state.catalogMeta.origin = "imported-backup:" + name;
            state.catalogMeta.updatedAt = nowIso();
            state.catalogMeta.count = result.cleaned.length;
            await Store.set(KEYS.catalog, { catalog: state.catalog, meta: state.catalogMeta });
          } else {
            toast("Backup catalog ignored: " + result.errors[0], "warn");
          }
        }

        await persistPrefs();
        await persistWorkspaces();
        await persistStack();
        await persistCompare();
        await logActivity("import", (state.lang === "fa" ? "بازیابی پشتیبان: " : "Restored backup: ") + name);
        toast(t("toast.saved"), "good");
        render();
      });
      break;

    case "ws-export-all":
      downloadJson("tech-atlas-workspaces.json", { app:"Tech Atlas Studio", workspaces: state.workspaces });
      break;

    case "ws-import":
      pickFile(".json,application/json", async (text) => {
        let data;
        try{ data = JSON.parse(text); }
        catch(err){ toast(t("ws.importFailed") + " " + err.message, "bad"); return; }
        const list = Array.isArray(data) ? data : (isPlainObject(data) ? data.workspaces : null);
        if(!Array.isArray(list)){ toast(t("ws.importFailed") + " no workspace array found.", "bad"); return; }
        const valid = list.filter(w => isPlainObject(w) && typeof w.name === "string" && Array.isArray(w.items));
        if(!valid.length){ toast(t("ws.importFailed") + " no valid workspace entries.", "bad"); return; }
        valid.forEach(w => {
          state.workspaces.unshift({
            id: uid("ws"),
            name: String(w.name).slice(0, 200),
            kind: ["stack","compare","advisor","notes"].indexOf(w.kind) !== -1 ? w.kind : "notes",
            items: w.items.map(String).slice(0, 60),
            stack: isPlainObject(w.stack) ? w.stack : {},
            notes: isPlainObject(w.notes) ? w.notes : {},
            createdAt: nowIso(), updatedAt: nowIso()
          });
        });
        await persistWorkspaces();
        toast(t("ws.imported", { n: valid.length }), "good");
        render();
      });
      break;

    case "reset-all":
      if(confirm(t("set.resetConfirm"))){
        await Store.clearAll();
        state.workspaces = [];
        state.activity = [];
        state.compare = [];
        state.stack = {};
        state.stackNotes = {};
        state.catalog = clone(CATALOG);
        state.catalogMeta = { version: CATALOG_FORMAT_VERSION, snapshot:"2025-01", origin:"built-in", updatedAt:null, count: CATALOG.length };
        state.pendingUpdate = null;
        toast(t("toast.deleted"), "good");
        render();
      }
      break;

    case "copy-docs": {
      const body = $("#docsBody");
      const text = body ? body.textContent : "";
      copyText(text);
      break;
    }

    default:
      break;
  }
});

/* change / input handlers */
document.addEventListener("change", async e => {
  const el = e.target;

  const filterSel = el.closest("[data-filter]");
  if(filterSel){
    state.filters[filterSel.dataset.filter] = filterSel.value;
    render();
    return;
  }

  const advSel = el.closest("[data-adv]");
  if(advSel){
    const key = advSel.dataset.adv;
    if(key === "offline") state.advisor.offline = el.checked;
    else state.advisor[key] = el.value;
    state.advisor.ran = false;
    await Store.set(KEYS.advisor, state.advisor);
    return;
  }

  const stackSel = el.closest("[data-stack-layer]");
  if(stackSel){
    const layer = stackSel.dataset.stackLayer;
    if(stackSel.value) state.stack[layer] = stackSel.value;
    else { delete state.stack[layer]; delete state.stackNotes[layer]; }
    await persistStack();
    render();
    return;
  }

  const stackNote = el.closest("[data-stack-note]");
  if(stackNote){
    state.stackNotes[stackNote.dataset.stackNote] = stackNote.value.slice(0, 2000);
    await persistStack();
    return;
  }

  const compat = el.closest("[data-compat]");
  if(compat){
    if(compat.dataset.compat === "a") state.cmpA = el.value;
    else state.cmpB = el.value;
    render();
    return;
  }

  const fontRange = el.closest("[data-set-fontscale]");
  if(fontRange){
    state.fontScale = Number(el.value);
    await persistPrefs();
    render();
    return;
  }
});

document.addEventListener("input", debounce(e => {
  const el = e.target;
  if(el.id === "expSearch"){
    state.filters.q = el.value;
    const active = document.activeElement;
    render();
    const again = $("#expSearch");
    if(again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    return;
  }
  if(el.id === "cmpSearch"){
    const q = el.value.trim().toLowerCase();
    $$("#cmpPicker .chip").forEach(chip => {
      const id = chip.dataset.toggleCompare;
      const tech = byId(id);
      const hay = (tech ? L(tech.name) + " " + catLabel(tech.cat) : id).toLowerCase();
      chip.style.display = (!q || hay.indexOf(q) !== -1) ? "" : "none";
    });
    return;
  }
  if(el.id === "glossSearch"){
    state.glossaryQuery = el.value;
    render();
    const again = $("#glossSearch");
    if(again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    return;
  }
  if(el.id === "updUrl") return;
}, 180));

/* keyboard activation for card-like elements */
document.addEventListener("keydown", e => {
  if(e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest("[role=\"button\"][data-open-tech], [role=\"button\"][data-nav-cat]");
  if(!el) return;
  e.preventDefault();
  if(el.dataset.openTech) navigate("tech", el.dataset.openTech);
  else if(el.dataset.navCat){ state.filters.cat = el.dataset.navCat; navigate("explorer"); }
});

/* header buttons */
$("#themeBtn").addEventListener("click", async () => {
  state.theme = state.theme === "dark" ? "light" : "dark";
  await persistPrefs();
  applyChrome();
  render();
});
$("#langBtn").addEventListener("click", async () => {
  state.lang = state.lang === "en" ? "fa" : "en";
  await persistPrefs();
  render();
  toast(t("toast.langSwitched"), "good");
});

/* hidden file picker helper */
function pickFile(accept, onLoaded){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = accept;
  input.style.position = "fixed";
  input.style.left = "-9999px";
  document.body.appendChild(input);
  input.addEventListener("change", async () => {
    const file = input.files && input.files[0];
    input.remove();
    if(!file) return;
    try{
      const text = await readFileText(file);
      onLoaded(text, file.name);
    }catch(err){
      toast("Could not read file: " + (err && err.message ? err.message : "unknown error"), "bad");
    }
  });
  input.click();
}

/* clipboard */
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      () => toast(t("common.copied"), "good"),
      () => fallbackCopy(text)
    );
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  try{
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    toast(ok ? t("common.copied") : t("common.copyFailed"), ok ? "good" : "bad");
  }catch(_){ toast(t("common.copyFailed"), "bad"); }
}

/* ==========================================================================
   11. BOOTSTRAP
   ========================================================================== */
async function init(){
  /* 1. storage */
  const mode = await Store.init();

  /* 2. preferences */
  const prefs = await Store.get(KEYS.prefs);
  if(prefs && isPlainObject(prefs)){
    if(prefs.lang === "en" || prefs.lang === "fa") state.lang = prefs.lang;
    if(prefs.theme === "dark" || prefs.theme === "light") state.theme = prefs.theme;
    if(prefs.motion === "full" || prefs.motion === "reduced") state.motion = prefs.motion;
    const fs = Number(prefs.fontScale);
    if(isFinite(fs) && fs >= 0.85 && fs <= 1.3) state.fontScale = fs;
  } else {
    /* first run: follow system preferences */
    if(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) state.theme = "light";
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) state.motion = "reduced";
    const nav = (navigator.language || "en").toLowerCase();
    if(nav.indexOf("fa") === 0) state.lang = "fa";
  }

  /* 3. catalog */
  const stored = await Store.get(KEYS.catalog);
  let catalogOk = false;
  if(stored && isPlainObject(stored) && Array.isArray(stored.catalog)){
    const check = validateCatalog(stored.catalog);
    if(check.ok){
      state.catalog = check.cleaned;
      state.catalogMeta = Object.assign(state.catalogMeta, stored.meta || {}, { count: check.cleaned.length });
      catalogOk = true;
    } else {
      console.warn("[Tech Atlas Studio] Stored catalog failed validation, falling back to built-in:", check.errors);
      toast("Stored catalog was invalid and has been replaced by the built-in catalog.", "warn");
    }
  }
  if(!catalogOk){
    state.catalog = clone(CATALOG);
    state.catalogMeta = {
      version: CATALOG_FORMAT_VERSION,
      snapshot: "2025-01",
      origin: "built-in",
      updatedAt: null,
      count: state.catalog.length
    };
  }

  /* 4. workspaces, stack, comparison, advisor, activity */
  const ws = await Store.get(KEYS.workspaces);
  if(Array.isArray(ws)) state.workspaces = ws;

  const st = await Store.get(KEYS.stack);
  if(st && isPlainObject(st)){
    if(isPlainObject(st.stack)) state.stack = st.stack;
    if(isPlainObject(st.notes)) state.stackNotes = st.notes;
  }

  const cp = await Store.get(KEYS.compare);
  if(Array.isArray(cp)) state.compare = cp.filter(id => byId(id)).slice(0, 4);

  const adv = await Store.get(KEYS.advisor);
  if(adv && isPlainObject(adv)){
    state.advisor = Object.assign(state.advisor, adv, { ran: false });
    if(!Array.isArray(state.advisor.devices)) state.advisor.devices = [];
    if(!Array.isArray(state.advisor.priorities)) state.advisor.priorities = [];
  }

  const act = await Store.get(KEYS.activity);
  if(Array.isArray(act)) state.activity = act;

  /* 5. storage estimate for the Settings view */
  const est = await Store.estimate();
  setTimeout(() => {
    const node = $("#storageEstimate");
    if(node && est){
      const fmt = b => b > 1048576 ? (b / 1048576).toFixed(2) + " MB" : (b / 1024).toFixed(1) + " KB";
      node.textContent = fmt(est.usage) + " / " + fmt(est.quota);
    } else if(node){
      node.textContent = "Unavailable in this browser";
    }
  }, 60);

  /* 6. PWA manifest (best-effort, generated at runtime) */
  try{ installManifest(); }catch(err){ console.warn("Manifest generation skipped:", err); }

  /* 7. routing */
  window.addEventListener("hashchange", route);
  if(!location.hash) location.hash = "#/dashboard";
  route();

  if(mode === "localstorage"){
    toast("IndexedDB is unavailable — using localStorage instead. Data limits are smaller.", "warn");
  }
}

/** Build an inline manifest so the page can offer 'Add to Home Screen' where supported. */
function installManifest(){
  const size = 512;
  const canvas = document.createElement("canvas");
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");
  if(!ctx) return;
  const g = ctx.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, "#22d3ee");
  g.addColorStop(0.55, "#3b82f6");
  g.addColorStop(1, "#8b5cf6");
  ctx.fillStyle = "#070910";
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(size / 2, size / 2, size * 0.40, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#070910";
  ctx.lineWidth = size * 0.045;
  ctx.beginPath();
  ctx.ellipse(size / 2, size / 2, size * 0.16, size * 0.40, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(size * 0.10, size / 2);
  ctx.lineTo(size * 0.90, size / 2);
  ctx.stroke();
  const iconUrl = canvas.toDataURL("image/png");

  const manifest = {
    name: "Tech Atlas Studio",
    short_name: "Tech Atlas",
    description: "Interactive bilingual atlas of software technologies.",
    start_url: ".",
    scope: ".",
    display: "standalone",
    background_color: "#070910",
    theme_color: "#070910",
    lang: "en",
    dir: "auto",
    icons: [
      { src: iconUrl, sizes: "512x512", type: "image/png", purpose: "any" },
      { src: iconUrl, sizes: "512x512", type: "image/png", purpose: "maskable" }
    ]
  };
  const href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifest));
  let link = document.querySelector('link[rel="manifest"]');
  if(!link){
    link = document.createElement("link");
    link.rel = "manifest";
    document.head.appendChild(link);
  }
  link.href = href;

  let apple = document.querySelector('link[rel="apple-touch-icon"]');
  if(!apple){
    apple = document.createElement("link");
    apple.rel = "apple-touch-icon";
    document.head.appendChild(apple);
  }
  apple.href = iconUrl;

  const meta = document.createElement("meta");
  meta.name = "apple-mobile-web-app-capable";
  meta.content = "yes";
  document.head.appendChild(meta);
  const meta2 = document.createElement("meta");
  meta2.name = "mobile-web-app-capable";
  meta2.content = "yes";
  document.head.appendChild(meta2);
}

/* surface unexpected errors instead of failing silently */
window.addEventListener("error", e => {
  console.error("[Tech Atlas Studio] Unhandled error:", e.error || e.message);
});
window.addEventListener("unhandledrejection", e => {
  console.error("[Tech Atlas Studio] Unhandled promise rejection:", e.reason);
});

/* go */
document.addEventListener("DOMContentLoaded", init);
