<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Backend Forge">
<meta name="theme-color" content="#0b0d12">
<title>Local Backend Forge</title>
<style>
:root{
  --bg:#0b0d12; --bg2:#0f1219; --panel:#151925; --panel2:#1b2030; --panel3:#222840;
  --border:#262d42; --border2:#323a55;
  --text:#e7eaf3; --muted:#8b93a7; --dim:#5f6780;
  --accent:#3b82f6; --accent2:#8b5cf6; --accent3:#06b6d4;
  --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
  --radius:14px; --radius-sm:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none}
body{
  background:
    radial-gradient(900px 500px at 100% -10%, rgba(139,92,246,.13), transparent 60%),
    radial-gradient(800px 500px at -10% 0%, rgba(59,130,246,.12), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Vazirmatn","Iranian Sans",Tahoma,sans-serif;
  font-size:15px;line-height:1.6;
  display:flex;flex-direction:column;
}
body[dir="ltr"]{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--accent3)}

/* ---------- Top bar ---------- */
#topbar{
  position:sticky;top:0;z-index:40;
  padding:calc(var(--safe-t) + 8px) 12px 8px;
  display:flex;align-items:center;gap:8px;
  background:rgba(11,13,18,.82);
  backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid var(--border);
}
#topbar h1{
  font-size:15px;margin:0;flex:1;text-align:center;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px;
}
.iconbtn{
  width:38px;height:38px;min-width:38px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  background:var(--panel);border:1px solid var(--border);
  font-size:16px;transition:.15s;
}
.iconbtn:active{transform:scale(.93);background:var(--panel2)}
.iconbtn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}

/* ---------- Main ---------- */
#main{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 14px calc(96px + var(--safe-b));
  max-width:900px;width:100%;margin:0 auto;
}
body.no-tabs #main{padding-bottom:calc(24px + var(--safe-b))}

/* ---------- Tab bar ---------- */
#tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  display:flex;justify-content:space-around;align-items:stretch;
  padding:6px 6px calc(6px + var(--safe-b));
  background:rgba(15,18,25,.92);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--border);
}
#tabbar.hidden{display:none}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 2px;border-radius:11px;color:var(--muted);
  font-size:10px;font-weight:500;transition:.15s;min-width:0;
}
.tab .ti{font-size:19px;line-height:1}
.tab .tl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab.active{color:var(--text);background:var(--panel2)}
.tab.active .ti{filter:drop-shadow(0 0 8px rgba(59,130,246,.7))}
.tab:active{transform:scale(.94)}

/* ---------- Cards / typography ---------- */
.card{
  background:linear-gradient(180deg,rgba(27,32,48,.72),rgba(21,25,37,.72));
  border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.card.tight{padding:11px}
.card h2{margin:0 0 8px;font-size:15px;font-weight:650;display:flex;align-items:center;gap:7px}
.card h3{margin:12px 0 6px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.card p{margin:0 0 8px;color:var(--muted);font-size:13.5px}
.card p:last-child{margin-bottom:0}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.small{font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;direction:ltr;text-align:left}
hr.sep{border:none;border-top:1px solid var(--border);margin:12px 0}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 15px;border-radius:11px;
  background:var(--panel2);border:1px solid var(--border2);
  font-size:14px;font-weight:550;transition:.15s;
  white-space:nowrap;
}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
.btn.ghost{background:transparent}
.btn.danger{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.4);color:#ffb4b4}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---------- Forms ---------- */
label.field{display:block;margin-bottom:12px}
label.field > span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:550}
input[type=text],input[type=password],input[type=number],input[type=url],input[type=search],select,textarea{
  width:100%;padding:11px 12px;border-radius:11px;
  background:var(--bg2);border:1px solid var(--border2);
  outline:none;transition:.15s;font-size:15px; /* 16px avoids iOS zoom; 15 ok */
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
body[dir="rtl"] select{background-position:18px 50%,13px 50%;padding-right:12px;padding-left:34px}
.check{
  display:flex;align-items:flex-start;gap:10px;padding:11px 12px;
  border:1px solid var(--border);border-radius:11px;background:var(--bg2);
  margin-bottom:8px;transition:.15s;
}
.check:active{background:var(--panel2)}
.check input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}
.check .ct{flex:1;min-width:0}
.check .ct b{display:block;font-size:13.5px;font-weight:600}
.check .ct small{color:var(--muted);font-size:11.5px;display:block;line-height:1.45}
.check.on{border-color:var(--accent);background:rgba(59,130,246,.09)}
.opt{
  padding:11px 12px;border:1px solid var(--border);border-radius:11px;
  background:var(--bg2);margin-bottom:8px;transition:.15s;
}
.opt.on{border-color:var(--accent);background:rgba(59,130,246,.1);box-shadow:0 0 0 1px rgba(59,130,246,.25) inset}
.opt b{display:block;font-size:13.5px}
.opt small{color:var(--muted);font-size:11.5px;display:block;margin-top:2px;line-height:1.45}
.opt .tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:20px;background:rgba(139,92,246,.2);color:#c4b5fd;margin-inline-start:6px;vertical-align:middle}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.badge.b-ok{background:rgba(34,197,94,.14);color:#7ee2a8;border-color:rgba(34,197,94,.3)}
.badge.b-warn{background:rgba(245,158,11,.14);color:#fcd34d;border-color:rgba(245,158,11,.3)}
.badge.b-err{background:rgba(239,68,68,.14);color:#fca5a5;border-color:rgba(239,68,68,.3)}
.badge.b-info{background:rgba(59,130,246,.14);color:#93c5fd;border-color:rgba(59,130,246,.3)}
.badge.b-mute{background:var(--panel2);color:var(--muted);border-color:var(--border)}

/* ---------- Project list ---------- */
.pitem{
  display:flex;gap:11px;align-items:center;
  padding:12px;border:1px solid var(--border);border-radius:var(--radius);
  background:linear-gradient(180deg,rgba(27,32,48,.6),rgba(21,25,37,.6));
  margin-bottom:9px;transition:.15s;
}
.pitem:active{transform:scale(.985);background:var(--panel2)}
.pavatar{
  width:42px;height:42px;min-width:42px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:19px;
  background:linear-gradient(135deg,rgba(59,130,246,.25),rgba(139,92,246,.25));
  border:1px solid var(--border2);
}
.pmeta{flex:1;min-width:0}
.pmeta b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- File list ---------- */
.frow{
  display:flex;align-items:center;gap:9px;padding:10px 11px;
  border:1px solid var(--border);border-radius:10px;background:var(--bg2);
  margin-bottom:6px;transition:.15s;
}
.frow:active{background:var(--panel2)}
.frow .fi{font-size:15px;width:20px;text-align:center}
.frow .fn{flex:1;min-width:0;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;direction:ltr;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .fs{font-size:10px;color:var(--dim);white-space:nowrap}

/* ---------- Editor ---------- */
.editor-wrap{
  border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden;background:#0a0c11;
}
.editor-head{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--panel);border-bottom:1px solid var(--border);
}
.editor-head .epath{flex:1;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;direction:ltr;text-align:left;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#codeArea{
  width:100%;min-height:46vh;max-height:62vh;
  background:#0a0c11;border:none;border-radius:0;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12.5px;line-height:1.62;direction:ltr;text-align:left;
  padding:12px;white-space:pre;overflow:auto;tab-size:2;
}
#codeArea:focus{box-shadow:none}
.findbar{display:flex;gap:6px;padding:8px 10px;background:var(--panel);border-top:1px solid var(--border)}
.findbar input{flex:1;padding:7px 10px;font-size:13px}

/* ---------- Tabs strip ---------- */
.strip{
  display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.strip::-webkit-scrollbar{display:none}
.chip{
  padding:7px 13px;border-radius:20px;border:1px solid var(--border);
  background:var(--panel);font-size:12.5px;white-space:nowrap;color:var(--muted);
  transition:.15s;font-weight:550;
}
.chip.on{background:linear-gradient(135deg,rgba(59,130,246,.22),rgba(139,92,246,.22));border-color:var(--accent);color:var(--text)}
.chip:active{transform:scale(.95)}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(96px + var(--safe-b));z-index:200;
  display:flex;flex-direction:column;gap:8px;align-items:center;
  pointer-events:none;width:max-content;max-width:88vw;
}
.tmsg{
  padding:10px 16px;border-radius:12px;font-size:13px;font-weight:550;
  background:rgba(27,32,48,.96);border:1px solid var(--border2);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 10px 34px rgba(0,0,0,.55);
  animation:tin .22s ease;text-align:center;
}
.tmsg.ok{border-color:rgba(34,197,94,.5);color:#a7f3c8}
.tmsg.err{border-color:rgba(239,68,68,.5);color:#fca5a5}
.tmsg.warn{border-color:rgba(245,158,11,.5);color:#fcd34d}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- Modal ---------- */
#modalRoot{position:fixed;inset:0;z-index:300;display:none}
#modalRoot.on{display:block}
.mback{position:absolute;inset:0;background:rgba(4,6,10,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.msheet{
  position:absolute;left:0;right:0;bottom:0;
  background:var(--panel);border-top:1px solid var(--border2);
  border-radius:20px 20px 0 0;padding:16px 16px calc(16px + var(--safe-b));
  max-height:88vh;overflow-y:auto;
  animation:sup .25s cubic-bezier(.2,.9,.3,1);
}
@keyframes sup{from{transform:translateY(100%)}to{transform:none}}
.msheet h3{margin:0 0 10px;font-size:16px}
.mhandle{width:38px;height:4px;border-radius:3px;background:var(--border2);margin:0 auto 12px}

/* ---------- Misc ---------- */
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted);flex-shrink:0}
.kv .v{text-align:end;word-break:break-word;font-weight:550}
pre.code{
  background:#0a0c11;border:1px solid var(--border);border-radius:11px;
  padding:11px;overflow-x:auto;font-size:11.5px;line-height:1.55;
  font-family:ui-monospace,Menlo,Consolas,monospace;
  direction:ltr;text-align:left;margin:0 0 10px;
}
.empty{text-align:center;padding:44px 18px;color:var(--dim)}
.empty .ei{font-size:44px;display:block;margin-bottom:12px;opacity:.5}
.spin{
  width:16px;height:16px;border:2px solid rgba(255,255,255,.2);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;
  display:inline-block;vertical-align:-3px;
}
@keyframes sp{to{transform:rotate(360deg)}}
.pbar{height:5px;border-radius:4px;background:var(--panel2);overflow:hidden;margin:10px 0}
.pbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.note{border-inline-start:3px solid var(--accent);padding:9px 12px;background:rgba(59,130,246,.07);border-radius:0 10px 10px 0;font-size:12.5px;color:var(--muted);margin:10px 0}
.note.warn{border-color:var(--warn);background:rgba(245,158,11,.08)}
.note.err{border-color:var(--err);background:rgba(239,68,68,.08)}
.note.ok{border-color:var(--ok);background:rgba(34,197,94,.08)}
body[dir="rtl"] .note{border-radius:10px 0 0 10px}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hstack{display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.wizhead{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.wizdots{display:flex;gap:5px;flex:1}
.wizdots i{height:4px;flex:1;border-radius:3px;background:var(--panel3);transition:.25s}
.wizdots i.on{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.wizdots i.done{background:var(--accent)}
.tree{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;direction:ltr;text-align:left;line-height:1.75;color:var(--muted);white-space:pre;overflow-x:auto}
.tree b{color:var(--text);font-weight:600}
</style>
</head>
<body>

<header id="topbar">
  <button class="iconbtn" id="btnBack" style="display:none" aria-label="back">‹</button>
  <button class="iconbtn" id="btnMenu" aria-label="menu">☰</button>
  <h1 id="title">Local Backend Forge</h1>
  <button class="iconbtn" id="btnLang" aria-label="language">EN</button>
</header>

<main id="main"></main>
<nav id="tabbar"></nav>
<div id="toast"></div>
<div id="modalRoot"></div>

function slugify(s){
  const base = String(s||"backend").trim().toLowerCase()
    .replace(/[^\w\u0600-\u06FF\- ]+/g,"")
    .replace(/\s+/g,"-")
    .replace(/-+/g,"-").replace(/^-|-$/g,"");
  const ascii = base.replace(/[^\x00-\x7F]/g,"").replace(/^-|-$/g,"");
  return ascii || "backend-project";
}

}

/* ------------------------------ ZIP (write) ------------------------------ */
const CRC_TABLE = (()=>{
  const T = new Uint32Array(256);
  for (let n=0;n<256;n++){
    let c = n;
    for (let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    T[n] = c >>> 0;
  }
  return T;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for (let i=0;i<u8.length;i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
/** entries: [{path:string, data:Uint8Array}] -> Blob (STORE method, UTF-8 names) */
function buildZip(entries){
  const enc = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;
  for (const e of entries){
    const nameB = enc.encode(e.path);
    const data = e.data;
    const crc = crc32(data);
    const size = data.length;

    const lh = new Uint8Array(30 + nameB.length);
    const dvl = new DataView(lh.buffer);
    dvl.setUint32(0, 0x04034b50, true);
    dvl.setUint16(4, 20, true);
    dvl.setUint16(6, 0x0800, true);   // UTF-8 flag
    dvl.setUint16(8, 0, true);        // store
    dvl.setUint16(10, 0, true);
    dvl.setUint16(12, 0x2100, true);  // 2000-01-01
    dvl.setUint32(14, crc, true);
    dvl.setUint32(18, size, true);
    dvl.setUint32(22, size, true);
    dvl.setUint16(26, nameB.length, true);
    dvl.setUint16(28, 0, true);
    lh.set(nameB, 30);

    parts.push(lh, data);

    const cd = new Uint8Array(46 + nameB.length);
    const dvc = new DataView(cd.buffer);
    dvc.setUint32(0, 0x02014b50, true);
    dvc.setUint16(4, 20, true);
    dvc.setUint16(6, 20, true);
    dvc.setUint16(8, 0x0800, true);
    dvc.setUint16(10, 0, true);
    dvc.setUint16(12, 0, true);
    dvc.setUint16(14, 0x2100, true);
    dvc.setUint32(16, crc, true);
    dvc.setUint32(20, size, true);
    dvc.setUint32(24, size, true);
    dvc.setUint16(28, nameB.length, true);
    dvc.setUint16(30, 0, true);
    dvc.setUint16(32, 0, true);
    dvc.setUint16(34, 0, true);
    dvc.setUint16(36, 0, true);
    dvc.setUint32(38, 0, true);
    dvc.setUint32(42, offset, true);
    cd.set(nameB, 46);
    central.push(cd);

    offset += lh.length + size;
  }
  let cdSize = 0;
  for (const c of central) cdSize += c.length;

  const end = new Uint8Array(22);
  const dve = new DataView(end.buffer);
  dve.setUint32(0, 0x06054b50, true);
  dve.setUint16(4, 0, true);
  dve.setUint16(6, 0, true);
  dve.setUint16(8, central.length, true);
  dve.setUint16(10, central.length, true);
  dve.setUint32(12, cdSize, true);
  dve.setUint32(16, offset, true);
  dve.setUint16(20, 0, true);

  return new Blob([...parts, ...central, end], { type: "application/zip" });
}

/* ------------------------------ ZIP (read) ------------------------------- */
async function readZip(arrayBuffer){
  const u8 = new Uint8Array(arrayBuffer);
  const dv = new DataView(arrayBuffer);
  let eocd = -1;
  const minPos = Math.max(0, u8.length - 22 - 65535);
  for (let i = u8.length - 22; i >= minPos; i--){
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error("ZIP: end-of-central-directory not found");
  const count = dv.getUint16(eocd + 10, true);
  const cdOff = dv.getUint32(eocd + 16, true);
  const out = [];
  let p = cdOff;
  const dec = new TextDecoder();
  for (let i=0;i<count;i++){
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method   = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen  = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const cmtLen   = dv.getUint16(p + 32, true);
    const lho      = dv.getUint32(p + 42, true);
    const name     = dec.decode(u8.subarray(p + 46, p + 46 + nameLen));

    if (lho + 30 > u8.length) { p += 46 + nameLen + extraLen + cmtLen; continue; }
    const lNameLen  = dv.getUint16(lho + 26, true);
    const lExtraLen = dv.getUint16(lho + 28, true);
    const dataStart = lho + 30 + lNameLen + lExtraLen;
    const raw = u8.subarray(dataStart, dataStart + compSize);

    let data;
    if (method === 0){
      data = raw;
    } else if (method === 8){
      if (typeof DecompressionStream === "undefined")
        throw new Error("ZIP: this browser cannot decompress deflate entries");
      const ds = new DecompressionStream("deflate-raw");
      const stream = new Blob([raw]).stream().pipeThrough(ds);
      data = new Uint8Array(await new Response(stream).arrayBuffer());
    } else {
      throw new Error("ZIP: unsupported compression method " + method);
    }
    if (!name.endsWith("/")) out.push({ path: name, data });
    p += 46 + nameLen + extraLen + cmtLen;
  }
  return out;
}

/* ------------------------------ IndexedDB -------------------------------- */
const DB_NAME = "backend-forge";
const DB_VERSION = 1;
let _db = null;

function openDB(){
  return new Promise((resolve, reject)=>{
    if (_db) return resolve(_db);
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("projects")){
        const s = db.createObjectStore("projects", { keyPath:"id" });
        s.createIndex("updatedAt", "updatedAt");
        s.createIndex("name", "name");
      }
      if (!db.objectStoreNames.contains("files")){
        const s = db.createObjectStore("files", { keyPath:"id" });
        s.createIndex("projectId", "projectId");
      }
      if (!db.objectStoreNames.contains("versions")){
        const s = db.createObjectStore("versions", { keyPath:"id" });
        s.createIndex("projectId", "projectId");
      }
      if (!db.objectStoreNames.contains("settings")){
        db.createObjectStore("settings", { keyPath:"key" });
      }
    };
    req.onsuccess = () => { _db = req.result; resolve(_db); };
    req.onerror = () => reject(req.error);
  });
}
function tx(store, mode, fn){
  return openDB().then(db => new Promise((resolve, reject)=>{
    const tr = db.transaction(store, mode);
    const s = tr.objectStore(store);
    let result;
    try { result = fn(s); } catch(err){ reject(err); return; }
    tr.oncomplete = () => resolve(result && result.__req ? result.__req.result : result);
    tr.onerror = () => reject(tr.error);
    tr.onabort = () => reject(tr.error || new Error("tx aborted"));
  }));
}
const reqP = r => { const o = { __req:r }; return o; };

const DB = {
  async putProject(p){ return tx("projects","readwrite", s => { s.put(p); }); },
  async getProject(id){ return tx("projects","readonly", s => reqP(s.get(id))); },

      const fi = s.objectStore("files").index("projectId");
      const vi = s.objectStore("versions").index("projectId");
      const drop = (idx) => {

  async putFile(f){ return tx("files","readwrite", s => { s.put(f); }); },

  async filesOf(pid){ return tx("files","readonly", s => reqP(s.index("projectId").getAll(IDBKeyRange.only(pid)))); },

  async versionsOf(pid){ return tx("versions","readonly", s => reqP(s.index("projectId").getAll(IDBKeyRange.only(pid)))); },

  async getSetting(k){ return tx("settings","readonly", s => reqP(s.get(k))); },

        $driver = $cfg['driver'] ?? 'mysql';

        $dsn = match ($driver) {
            'mysql'  => sprintf('mysql:host=%s;port=%d;dbname=%s;charset=%s',
                            $cfg['host'], (int)($cfg['port'] ?? 3306), $cfg['name'], $cfg['charset'] ?? 'utf8mb4'),
            'pgsql'  => sprintf('pgsql:host=%s;port=%d;dbname=%s',
                            $cfg['host'], (int)($cfg['port'] ?? 5432), $cfg['name']),
            'sqlite' => 'sqlite:' . $cfg['name'],
            default  => throw new RuntimeException('Unsupported DB driver: ' . $driver),
        };

        try {
            self::$pdo = new PDO($dsn, $cfg['user'] ?? null, $cfg['pass'] ?? null, [
                PDO::ATTR_ERRMODE            => PDO::ERRMODE_EXCEPTION,
                PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
                PDO::ATTR_EMULATE_PREPARES   => false,
            ]);
        } catch (PDOException $e) {
            throw new RuntimeException('Database connection failed', 0, $e);
        }

        return self::$pdo;
    }
}

declare(strict_types=1);

namespace App;

final class Router
{
    /** @var array<int, array{method:string, pattern:string, handler:mixed}> */
    private array $routes = [];

    public function add(string $method, string $pattern, mixed $handler): void
    {
        $this->routes[] = [
            'method'  => strtoupper($method),
            'pattern' => $pattern,
            'handler' => $handler,
        ];
    }

    public function get(string $p, mixed $h): void    { $this->add('GET', $p, $h); }
    public function post(string $p, mixed $h): void   { $this->add('POST', $p, $h); }
    public function put(string $p, mixed $h): void    { $this->add('PUT', $p, $h); }
    public function delete(string $p, mixed $h): void { $this->add('DELETE', $p, $h); }

    public function dispatch(string $method, string $path): void
    {
        $method = strtoupper($method);
        $path   = '/' . trim($path, '/');

        foreach ($this->routes as $route) {
            if ($route['method'] !== $method) {
                continue;
            }
            $params = $this->match($route['pattern'], $path);
            if ($params === null) {
                continue;
            }

            $handler = $route['handler'];
            if (is_array($handler) && is_string($handler[0])) {
                $handler = [new $handler[0](), $handler[1]];
            }
            if (!is_callable($handler)) {
                Response::error('Route handler is not callable', 500);
                return;
            }

            $handler(...array_values($params));
            return;
        }

        Response::error('Not found', 404);
    }

    private function match(string $pattern, string $path): ?array
    {
        $pattern = '/' . trim($pattern, '/');
        $pParts  = explode('/', trim($pattern, '/'));
        $uParts  = explode('/', trim($path, '/'));

        if (count($pParts) !== count($uParts)) {
            return null;
        }

        $params = [];
        foreach ($pParts as $i => $p) {
            if (preg_match('/^\\{(.+)\\}$/', $p, $m)) {
                $params[$m[1]] = urldecode($uParts[$i]);
                continue;
            }
            if ($p !== $uParts[$i]) {
                return null;
            }
        }
        return $params;
    }
}
`);

declare(strict_types=1);

namespace App;

final class Validator
{
    private array $errors = [];
    private array $clean  = [];

    public function __construct(private array $data) {}

    public function required(string $field, int $min = 1, int $max = 255): self
    {
        $v = trim((string)($this->data[$field] ?? ''));
        $len = mb_strlen($v);
        if ($v === '')            { $this->errors[$field] = 'required'; }
        elseif ($len < $min)      { $this->errors[$field] = 'min_length_' . $min; }
        elseif ($len > $max)      { $this->errors[$field] = 'max_length_' . $max; }
        else                      { $this->clean[$field] = $v; }
        return $this;
    }

    public function email(string $field): self
    {
        $v = trim((string)($this->data[$field] ?? ''));
        if (!filter_var($v, FILTER_VALIDATE_EMAIL)) {
            $this->errors[$field] = 'invalid_email';
        } else {
            $this->clean[$field] = mb_strtolower($v);
        }
        return $this;
    }

    public function in(string $field, array $allowed): self
    {
        $v = $this->data[$field] ?? null;
        if (!in_array($v, $allowed, true)) {
            $this->errors[$field] = 'invalid_value';
        } else {
            $this->clean[$field] = $v;
        }
        return $this;
    }

    public function fails(): bool  { return $this->errors !== []; }
    public function errors(): array { return $this->errors; }
    public function clean(): array  { return $this->clean; }
}
`);

declare(strict_types=1);

namespace App;

use RuntimeException;

/**
 * Minimal HS256 JWT implementation. No external dependency.
 */
final class Jwt
{
    public static function encode(array $payload, string $secret, int $ttl): string
    {
        $header = ['alg' => 'HS256', 'typ' => 'JWT'];
        $payload['iat'] = time();
        $payload['exp'] = time() + $ttl;

        $segments = [
            self::b64url(json_encode($header, JSON_THROW_ON_ERROR)),
            self::b64url(json_encode($payload, JSON_THROW_ON_ERROR)),
        ];
        $signing   = implode('.', $segments);
        $segments[] = self::b64url(hash_hmac('sha256', $signing, $secret, true));

        return implode('.', $segments);
    }

    public static function decode(string $token, string $secret): array
    {
        $parts = explode('.', $token);
        if (count($parts) !== 3) {
            throw new RuntimeException('Malformed token');
        }
        [$h, $p, $s] = $parts;

        $expected = self::b64url(hash_hmac('sha256', $h . '.' . $p, $secret, true));
        if (!hash_equals($expected, $s)) {
            throw new RuntimeException('Invalid signature');
        }

        $payload = json_decode(self::unb64url($p), true, 512, JSON_THROW_ON_ERROR);
        if (!isset($payload['exp']) || (int)$payload['exp'] < time()) {
            throw new RuntimeException('Token expired');
        }
        return $payload;
    }

    private static function b64url(string $data): string
    {
        return rtrim(strtr(base64_encode($data), '+/', '-_'), '=');
    }

    private static function unb64url(string $data): string
    {
        $pad = (4 - strlen($data) % 4) % 4;
        $decoded = base64_decode(strtr($data, '-_', '+/') . str_repeat('=', $pad), true);
        return $decoded === false ? '' : $decoded;
    }
}
`);

final class Auth
{
    public static function user(): ?array
    {
        $header = $_SERVER['HTTP_AUTHORIZATION'] ?? '';
        if (!preg_match('/^Bearer\\s+(.+)$/i', $header, $m)) {
            return null;
        }

        $jwtCfg = Config::get('jwt', []);
        try {
            $payload = Jwt::decode(trim($m[1]), (string)($jwtCfg['secret'] ?? ''));
        } catch (RuntimeException) {
            return null;

        $sub = (int)($payload['sub'] ?? 0);

        }

        $stmt = Database::connect(Config::get('db', []))
            ->prepare('SELECT id, name, email, role, created_at FROM users WHERE id = ?');
        $stmt->execute([$sub]);

        return $stmt->fetch() ?: null;

    {

        if ($user === null) {
            Response::error('Unauthorized', 401);

        $user = self::require();
        if (!in_array($user['role'], $roles, true)) {
            Response::error('Forbidden', 403);
            exit;
        }
        return $user;
    }

namespace App\\Controllers;

use App\\Auth;
use App\\Config;
use App\\Database;
use App\\Jwt;
use App\\Response;
use App\\Validator;

final class AuthController
{
    public function register(): void
    {
        $input = Response::input();
        $v = (new Validator($input))
            ->required('name', 2, 80)
            ->email('email')
            ->required('password', 8, 200);

        if ($v->fails()) {
            Response::error('Validation failed', 422, ['fields' => $v->errors()]);
            return;
        }

        $d   = $v->clean();
        $pdo = Database::connect(Config::get('db', []));

        $check = $pdo->prepare('SELECT id FROM users WHERE email = ?');
        $check->execute([$d['email']]);
        if ($check->fetch()) {
            Response::error('Email already registered', 409);
            return;
        }

        $stmt = $pdo->prepare(
            'INSERT INTO users (name, email, password_hash, role, created_at) VALUES (?, ?, ?, ?, ?)'
        );
        $stmt->execute([
            $d['name'],
            $d['email'],
            password_hash($d['password'], PASSWORD_DEFAULT),
            'user',
            date('Y-m-d H:i:s'),
        ]);

        $id = (int)$pdo->lastInsertId();

        Response::json([
            'user' => ['id' => $id, 'name' => $d['name'], 'email' => $d['email'], 'role' => 'user'],
        ], 201);
    }

    public function login(): void
    {
        $input = Response::input();
        $v = (new Validator($input))->email('email')->required('password', 1, 200);

        if ($v->fails()) {
            Response::error('Validation failed', 422, ['fields' => $v->errors()]);
            return;
        }

        $d   = $v->clean();
        $pdo = Database::connect(Config::get('db', []));

        $stmt = $pdo->prepare('SELECT id, name, email, role, password_hash FROM users WHERE email = ?');
        $stmt->execute([$d['email']]);
        $user = $stmt->fetch();

        if (!$user || !password_verify($d['password'], $user['password_hash'])) {
            Response::error('Invalid credentials', 401);
            return;
        }

        $jwtCfg = Config::get('jwt', []);
        $token  = Jwt::encode(
            ['sub' => (int)$user['id'], 'role' => $user['role']],
            (string)$jwtCfg['secret'],
            (int)($jwtCfg['ttl'] ?? 3600)
        );

        unset($user['password_hash']);

        Response::json(['token' => $token, 'user' => $user]);
    }

    public function me(): void
    {
        $user = Auth::require();
        Response::json(['user' => $user]);
    }
}

declare(strict_types=1);

namespace App\\Controllers;

use App\\Auth;
use App\\Config;
use App\\Response;

final class UploadController
{
    private const ALLOWED = [
        'image/jpeg' => 'jpg',
        'image/png'  => 'png',
        'image/webp' => 'webp',
        'application/pdf' => 'pdf',
        'text/plain' => 'txt',
    ];

    public function store(): void
    {
        Auth::require();

        if (!isset($_FILES['file']) || $_FILES['file']['error'] !== UPLOAD_ERR_OK) {
            Response::error('No file uploaded or upload error', 400);
            return;
        }

        $file = $_FILES['file'];
        $cfg  = Config::get('upload', []);
        $max  = (int)($cfg['max'] ?? 5242880);

        if ($file['size'] > $max) {
            Response::error('File too large', 413);
            return;
        }

        $finfo = new \\finfo(FILEINFO_MIME_TYPE);
        $mime  = $finfo->file($file['tmp_name']) ?: '';

        if (!isset(self::ALLOWED[$mime])) {
            Response::error('Unsupported file type: ' . $mime, 415);
            return;
        }

        $dir = $cfg['dir'] ?? (__DIR__ . '/../../storage/uploads');
        if (!is_dir($dir) && !mkdir($dir, 0775, true) && !is_dir($dir)) {
            Response::error('Storage directory is not writable', 500);
            return;
        }

        $name = bin2hex(random_bytes(16)) . '.' . self::ALLOWED[$mime];
        $dest = rtrim($dir, '/') . '/' . $name;

        if (!move_uploaded_file($file['tmp_name'], $dest)) {
            Response::error('Failed to store file', 500);
            return;
        }

        Response::json([
            'data' => ['file' => $name, 'mime' => $mime, 'size' => $file['size']],
        ], 201);
    }
}

${a.desc || "A PHP backend API."}

Generated by **Local Backend Forge** — stack: **PHP 8.1+ / ${dbLabel(a.database)}**.

## Requirements

- PHP >= 8.1 with the \`${a.database === "postgresql" ? "pdo_pgsql" : (a.database === "sqlite" ? "pdo_sqlite" : "pdo_mysql")}\` extension
- A database (${dbLabel(a.database)})

No Composer. No external packages.

## Installation

1. **Upload** the project. On cPanel the web root must point at \`public/\`.
   If you cannot change the document root, move the contents of \`public/\` to
   \`public_html/\` and change the two \`require\` paths in \`index.php\`

   \`\`\`

   Then edit \`config/config.php\`:
   - database credentials
   - \`jwt.secret\` — generate one with:

3. **Create the schema**

   \`\`\`bash

   \`\`\`

4. **Make the upload directory writable** (only if uploads are enabled)

   \`\`\`bash

   \`\`\`

## Local development

\`\`\`bash
php -S localhost:8000 -t public
\`\`\`

## Running the tests

\`\`\`bash
php tests/run_tests.php
\`\`\`

The tests cover JWT signing/verification and input validation. They need no database.

## API

| Method | Path | Auth | Description |
|---|---|---|---|
| GET | \`/api/health\` | — | Health check |
| POST | \`/api/auth/register\` | — | Create an account |
| POST | \`/api/auth/login\` | — | Get a JWT |
| GET | \`/api/auth/me\` | Bearer | Current user |
| GET | \`/api/users\` | Bearer | List users (paginated) |

| POST | \`/api/users\` | ${a.roles ? "Admin" : "Bearer"} | Create a user |
| PUT | \`/api/users/{id}\` | ${a.roles ? "Admin" : "Bearer"} | Update a user |
| DELETE | \`/api/users/{id}\` | ${a.roles ? "Admin" : "Bearer"} | Delete a user |
${a.upload ? "| POST | `/api/uploads` | Bearer | Upload a file (multipart, field `file`) |\n" : ""}
### Example

curl -X POST https://example.com/api/auth/login \\
  -H "Content-Type: application/json" \\
  -d '{"email":"admin@example.com","password":"yourpassword"}'
\`\`\`

\`\`\`json
{ "token": "eyJhbGciOi...", "user": { "id": 1, "role": "admin" } }
\`\`\`

## Nginx

\`\`\`nginx
root /var/www/${slug}/public;
index index.php;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ \\.php$ {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
}
\`\`\`

## Security notes

- \`config/config.php\` and everything outside \`public/\` must not be web-accessible.
- Passwords are hashed with \`password_hash()\` (bcrypt).
- All queries use prepared statements.
- Change the JWT secret before going live.

  add("src/db.js", `import fs from "node:fs";
import path from "node:path";
import { config } from "./config.js";

let impl = null;

/**
 * Initialises the database driver and exposes a uniform query API.
 *   db.query(sql, params) -> rows (SELECT) or [{ id, changes }] (write)
 *   db.exec(sql)          -> run raw DDL
 *
 * Placeholders are always written as "?" in application code. For PostgreSQL
 * they are rewritten to $1, $2, ... automatically.
 */
export async function initDb(cfg = config.db) {
  if (impl) return impl;

  if (cfg.client === "sqlite") {
    const { default: Database } = await import("better-sqlite3");
    const file = cfg.file;
    fs.mkdirSync(path.dirname(path.resolve(file)), { recursive: true });
    const db = new Database(file);
    db.pragma("journal_mode = WAL");
    db.pragma("foreign_keys = ON");

    impl = {
      async query(sql, params = []) {
        const stmt = db.prepare(sql);
        if (stmt.reader) return stmt.all(...params);
        const info = stmt.run(...params);
        return [{ id: Number(info.lastInsertRowid), changes: info.changes }];
      },
      async exec(sql) {
        db.exec(sql);
      },
    };
  } else if (cfg.client === "pg") {
    const { default: pg } = await import("pg");
    const pool = new pg.Pool({ connectionString: cfg.url });
    const toPg = (sql) => {
      let i = 0;
      return sql.replace(/\\?/g, () => "$" + (++i));
    };
    impl = {
      async query(sql, params = []) {
        const res = await pool.query(toPg(sql), params);
        return res.rows;
      },
      async exec(sql) {
        await pool.query(sql);
      },
    };
  } else if (cfg.client === "mysql") {
    const mysql = await import("mysql2/promise");
    const pool = mysql.createPool(cfg.url);
    impl = {
      async query(sql, params = []) {
        const [rows] = await pool.execute(sql, params);
        return rows;
      },
      async exec(sql) {
        await pool.query(sql);
      },
    };
  } else {
    throw new Error("Unsupported DB_CLIENT: " + cfg.client);
  }

  return impl;
}

export const db = {
  query: (...args) => {
    if (!impl) throw new Error("Database not initialised. Call initDb() first.");
    return impl.query(...args);
  },
  exec: (...args) => {
    if (!impl) throw new Error("Database not initialised. Call initDb() first.");
    return impl.exec(...args);
  },
};
`);

  add("src/middleware/validate.js", `import { badRequest } from "../errors.js";

/**
 * Tiny schema validator. No external dependency.
 *
 *   validate({
 *     name:     { type: "string", min: 2, max: 80, required: true },
 *     email:    { type: "email",  required: true },
 *     password: { type: "string", min: 8, required: true },
 *     role:     { type: "enum", values: ["admin", "user"] },
 *   })
 */
export function validate(schema) {
  return (req, res, next) => {
    const errors = {};
    const clean = {};

    for (const [field, rule] of Object.entries(schema)) {
      let value = req.body ? req.body[field] : undefined;

      if (value === undefined || value === null || value === "") {
        if (rule.required) { errors[field] = "required"; continue; }
        if ("default" in rule) clean[field] = rule.default;
        continue;
      }

      if (rule.type === "string" || rule.type === "email") {
        value = String(value).trim();
        if (rule.type === "email" && !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(value)) {
          errors[field] = "invalid_email";
          continue;
        }
        if (rule.min && value.length < rule.min) { errors[field] = "min_length_" + rule.min; continue; }
        if (rule.max && value.length > rule.max) { errors[field] = "max_length_" + rule.max; continue; }
        if (rule.type === "email") value = value.toLowerCase();
      } else if (rule.type === "number") {
        const n = Number(value);
        if (!Number.isFinite(n)) { errors[field] = "not_a_number"; continue; }
        if (rule.min !== undefined && n < rule.min) { errors[field] = "min_" + rule.min; continue; }
        if (rule.max !== undefined && n > rule.max) { errors[field] = "max_" + rule.max; continue; }
        value = n;
      } else if (rule.type === "enum") {
        if (!rule.values.includes(value)) { errors[field] = "invalid_value"; continue; }
      }

      clean[field] = value;
    }

    if (Object.keys(errors).length) {
      return next(badRequest("Validation failed", errors));
    }

    req.validated = clean;
    next();
  };
}
`);

import crypto from "node:crypto";
import fs from "node:fs";
import path from "node:path";
import { config } from "../config.js";
import { asyncHandler, badRequest } from "../errors.js";
${a.auth === "none" ? "" : `import { requireAuth } from "../middleware/auth.js";\n`}
const router = Router();

const ALLOWED = new Map([
  ["image/jpeg", "jpg"],
  ["image/png",  "png"],
  ["image/webp", "webp"],
  ["application/pdf", "pdf"],
  ["text/plain", "txt"],
]);

/**
 * Minimal multipart/form-data parser for a single file field named "file".
 * Avoids adding multer as a dependency. Buffers the whole body in memory,
 * which is why the size limit is enforced before parsing.
 */
function parseSingleFile(req, maxBytes) {
  return new Promise((resolve, reject) => {
    const ct = req.headers["content-type"] || "";
    const m = ct.match(/boundary=(?:"([^"]+)"|([^;]+))/i);
    if (!m) return reject(badRequest("Expected multipart/form-data"));

    const boundary = "--" + (m[1] || m[2]);
    const chunks = [];
    let size = 0;

    req.on("data", (c) => {
      size += c.length;
      if (size > maxBytes + 4096) {
        reject(Object.assign(badRequest("File too large"), { status: 413 }));
        req.destroy();
        return;
      }
      chunks.push(c);
    });

    req.on("end", () => {
      const body = Buffer.concat(chunks);
      const parts = body.toString("latin1").split(boundary).slice(1, -1);

      for (const part of parts) {
        const headerEnd = part.indexOf("\\r\\n\\r\\n");
        if (headerEnd === -1) continue;

        const rawHeaders = part.slice(0, headerEnd);
        const nameMatch = rawHeaders.match(/name="([^"]+)"/i);
        if (!nameMatch || nameMatch[1] !== "file") continue;

        const typeMatch = rawHeaders.match(/content-type:\\s*([^\\r\\n]+)/i);
        const data = Buffer.from(part.slice(headerEnd + 4).replace(/\\r\\n$/, ""), "latin1");

        resolve({ data, mime: (typeMatch ? typeMatch[1].trim() : "application/octet-stream") });
        return;
      }
      reject(badRequest("No file field found in the request"));
    });

    req.on("error", reject);
  });
}

router.post(
  "/",
  ${a.auth === "none" ? "(req, res, next) => next()" : "requireAuth"},
  asyncHandler(async (req, res) => {
    const { data, mime } = await parseSingleFile(req, config.upload.maxBytes);

    if (data.length > config.upload.maxBytes) {
      throw Object.assign(badRequest("File too large"), { status: 413 });
    }
    if (!ALLOWED.has(mime)) {
      throw Object.assign(badRequest("Unsupported file type: " + mime), { status: 415 });
    }

    const dir = path.resolve(config.upload.dir);
    fs.mkdirSync(dir, { recursive: true });

    const filename = crypto.randomBytes(16).toString("hex") + "." + ALLOWED.get(mime);
    fs.writeFileSync(path.join(dir, filename), data);

    res.status(201).json({ data: { file: filename, mime, size: data.length } });
  })
);

export default router;

${a.desc || "A Node.js REST API."}

Generated by **Local Backend Forge** — stack: **Node.js 18+ / Express / ${dbLabel(a.database)}**.

## Requirements

- Node.js >= 18
- ${a.database === "sqlite" ? "Nothing else — SQLite is embedded." : dbLabel(a.database) + " running and reachable."}

## Setup

\`\`\`bash
npm install
cp .env.example .env
\`\`\`

Edit \`.env\`:

\`\`\`ini

\`\`\`

Then create the schema and start:

\`\`\`bash
npm run migrate
npm run dev
\`\`\`

The API is now at \`http://localhost:3000\`.

## Tests

\`\`\`bash
npm test
\`\`\`

The test suite boots the real Express app against a temporary SQLite database
and exercises the real HTTP endpoints with \`fetch\`. Nothing is mocked.

## API

| Method | Path | Auth | Description |
|---|---|---|---|
| GET | \`/api/health\` | — | Health check |
| POST | \`/api/auth/register\` | — | Create an account |
| POST | \`/api/auth/login\` | — | Get a JWT |
${a.auth === "none" ? "" : "| GET | `/api/auth/me` | Bearer | Current user |\n"}|\ GET | \`/api/users\` | ${a.auth === "none" ? "—" : "Bearer"} | List users (paginated) |
| GET | \`/api/users/:id\` | ${a.auth === "none" ? "—" : "Bearer"} | Get one user |
| POST | \`/api/users\` | ${a.auth === "none" ? "—" : (a.roles ? "Admin" : "Bearer")} | Create a user |
| PUT | \`/api/users/:id\` | ${a.auth === "none" ? "—" : (a.roles ? "Admin" : "Bearer")} | Update a user |
| DELETE | \`/api/users/:id\` | ${a.auth === "none" ? "—" : (a.roles ? "Admin" : "Bearer")} | Delete a user |
${a.upload ? "| POST | `/api/uploads` | Bearer | Upload a file (multipart field `file`) |\n" : ""}
### Example

\`\`\`bash
curl -X POST http://localhost:3000/api/auth/login \\
  -H "Content-Type: application/json" \\
  -d '{"email":"ali@example.com","password":"supersecret123"}'
\`\`\`

\`\`\`json
{
  "token": "eyJhbGciOiJIUzI1NiIs...",
  "user": { "id": 1, "name": "Ali", "email": "ali@example.com", "role": "user" }
}
\`\`\`

## Security notes

- Passwords hashed with bcrypt (cost 12).
- All queries use parameter placeholders — never string concatenation.
- \`JWT_SECRET\` is validated to be >= 32 chars in production.
- \`.env\` is gitignored. Never commit it.
- The built-in multipart parser buffers the whole request in memory; keep the
  size limit low or swap in \`multer\` if you need streaming.

## Production

\`\`\`bash
NODE_ENV=production node src/server.js
\`\`\`

Put it behind Nginx/Caddy with TLS. Do not expose Node directly on port 80.

function defaultAnswers(){
  return {
    name: "",
    type: "crud",
    users: "small",
    language: "php",
    database: "mysql",
    auth: "jwt",
    roles: true,
    deploy: "cpanel",
    api: true,
    upload: false,
    admin: false,
    ai: false,
    budget: "low",
    slug: ""
  };
}

function recommend(a){
  const r = { notes: [], suggest: {} };

  // Language by deployment
  if (a.deploy === "cpanel") r.suggest.language = "php";
  else if (a.deploy === "vps" || a.deploy === "personal") r.suggest.language = "node";

  // Database by scale and deployment
  if (a.users === "large") r.suggest.database = "postgresql";
  else if (a.deploy === "cpanel" && a.users === "small") r.suggest.database = "mysql";
  else if (a.deploy === "personal") r.suggest.database = "sqlite";

  // Auth
  if (a.type === "api" && a.users === "small") r.suggest.auth = "jwt";
  if (a.users === "large") r.suggest.auth = "jwt";

  // Roles
  r.suggest.roles = (a.type === "saas" || a.type === "crud");

  // Features
  if (a.type === "media") r.suggest.upload = true;
  if (a.type === "saas") r.suggest.admin = true;
  if (a.type === "ai") r.suggest.ai = true;

  if (a.budget === "verylow" && a.users !== "small"){
    r.notes.push(LANG === "fa"
      ? "با بودجه بسیار کم و کاربر زیاد، هاست اشتراکی پاسخگو نیست. یک VPS ارزان (۵ دلار) همراه PostgreSQL منطقی‌تر است."
      : "Very low budget with high user count: shared hosting will not cope. A small VPS (~$5) with PostgreSQL is more realistic.");
  }

  return r;
}

/* ---------------- Project helpers ---------------- */
function projectFileRecord(projectId, path, content){
  return {
    id: uid(),
    projectId,
    path,
    content,
    size: bytesOf(content),
    updatedAt: Date.now()
  };
}

async function loadProject(id){
  const p = await DB.getProject(id);
  if (!p) { toast("Project not found", "err"); return null; }
  const files = await DB.filesOf(id);
  files.sort((a,b)=> a.path.localeCompare(b.path));
  state.project = p;
  state.files = files;
  state.currentFileId = files.length ? files[0].id : null;
  state.editorDirty = false;
  state.testResults = null;
  return p;
}

async function refreshProjects(){
  const all = await DB.allProjects();
  all.sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));
  state.projects = all;
}

async function touchProject(){
  if (!state.project) return;
  state.project.updatedAt = Date.now();
  try {
    await DB.putProject(state.project);
  } catch(e){
    toast(t("save_err"), "err");
  }
}

async function snapshotVersion(label){
  if (!state.project) return;
  const versions = await DB.versionsOf(state.project.id);
  const v = {
    id: uid(),
    projectId: state.project.id,
    label: label || "v" + (versions.length + 1),
    createdAt: Date.now(),
    name: state.project.name,
    answers: state.project.answers,
    arch: state.project.arch,
    files: state.files.map(f => ({ path: f.path, content: f.content }))
  };
  await DB.putVersion(v);
  // keep only the newest 20
  versions.push(v);
  versions.sort((a,b)=> b.createdAt - a.createdAt);
  for (const old of versions.slice(20)) await DB.delVersion(old.id);
}

/* =========================================================================

   ========================================================================= */
function applyLang(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "fa" ? "rtl" : "ltr";
  document.body.dir = LANG === "fa" ? "rtl" : "ltr";
  $("#btnLang").textContent = LANG === "fa" ? "EN" : "فا";
  $("#title").textContent = t("appName");
}

function renderTopbar(){
  const back = $("#btnBack");
  const inProject = !!state.project;
  const deep = state.view === "editor";
  back.style.display = (inProject || deep) ? "flex" : "none";
}

function renderTabbar(){
  const bar = $("#tabbar");
  const set = (items)=>{
    bar.innerHTML = items.map(it =>
      '<button class="tab'+(state.view===it.id?" active":"")+'" data-act="nav" data-view="'+it.id+'">'+
        '<span class="ti">'+it.icon+'</span>'+
        '<span class="tl">'+esc(it.label)+'</span>'+
      '</button>'
    ).join("");
    bar.classList.remove("hidden");
    document.body.classList.remove("no-tabs");
  };

  if (state.project){
    set([
      { id:"arch",   icon:"🏛", label:t("tab_arch") },
      { id:"files",  icon:"📁", label:t("tab_files") },
      { id:"editor", icon:"⌨️", label:t("tab_editor") },
      { id:"db",     icon:"🗄", label:t("tab_db") },
      { id:"api",    icon:"🔌", label:t("tab_api") },
      { id:"tests",  icon:"🧪", label:t("tab_tests") },
      { id:"export", icon:"📦", label:t("tab_export") }
    ]);
  } else {
    set([
      { id:"dashboard", icon:"🏠", label:t("tab_dash") },
      { id:"wizard",    icon:"✨", label:t("tab_new") },
      { id:"settings",  icon:"⚙️", label:t("tab_set") }
    ]);
  }
}

function render(){
  applyLang();
  renderTopbar();
  const main = $("#main");
  if (state.project){
    main.innerHTML = renderProjectView();
  } else {
    main.innerHTML = renderGlobalView();
  }
  renderTabbar();
}

function renderGlobalView(){
  switch (state.view){
    case "dashboard": return viewDashboard();
    case "wizard":    return viewWizard();
    case "settings":  return viewSettings();
    default:          state.view = "dashboard"; return viewDashboard();
  }
}

function renderProjectView(){
  switch (state.view){
    case "arch":   return viewArchitecture();
    case "files":  return viewFiles();
    case "editor": return viewEditor();
    case "db":     return viewDatabase();
    case "api":    return viewApiDocs();
    case "tests":  return viewTests();
    case "export": return viewExport();
    default:       state.view = "arch"; return viewArchitecture();
  }
}

/* ---------------- Dashboard ---------------- */

    const q = state.search.trim().toLowerCase();
    list = list.filter(p =>
      (p.name||"").toLowerCase().includes(q) ||

  if (state.sort === "name") list.sort((a,b)=> (a.name||"").localeCompare(b.name||""));
  else if (state.sort === "lang") list.sort((a,b)=> ((a.answers&&a.answers.language)||"").localeCompare((b.answers&&b.answers.language)||""));
  else list.sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));

  let html = '';
  html += '<div class="card">';

  html +=     '<button class="btn" data-act="import-files-global">📥 '+esc(t("import_files"))+'</button>';

  html += '</div>';

    html += '<div class="card tight">';

    html +=   '<div class="strip" style="padding:10px 0 0;margin:0">';
    html +=     '<button class="chip'+(state.filter==="all"?" on":"")+'" data-act="filter" data-v="all">'+esc(t("filter_all"))+'</button>';
    ["php","node","python"].forEach(l=>{
      html += '<button class="chip'+(state.filter===l?" on":"")+'" data-act="filter" data-v="'+l+'">'+esc(l)+'</button>';
    });
    html +=   '</div>';
    html +=   '<div class="strip" style="padding:0 0 4px;margin:0">';
    html +=     '<button class="chip'+(state.sort==="recent"?" on":"")+'" data-act="sort" data-v="recent">'+esc(t("sort_recent"))+'</button>';
    html +=     '<button class="chip'+(state.sort==="name"?" on":"")+'" data-act="sort" data-v="name">'+esc(t("sort_name"))+'</button>';
    html +=     '<button class="chip'+(state.sort==="lang"?" on":"")+'" data-act="sort" data-v="lang">'+esc(t("sort_lang"))+'</button>';
    html +=   '</div>';
    html += '</div>';
  }

  if (!list.length){
    html += '<div class="card empty">';
    html +=   '<span class="ei">🧱</span>';
    html +=   '<div style="font-weight:600;margin-bottom:6px">'+esc(t("no_projects"))+'</div>';
    html +=   '<div class="small">'+esc(t("no_projects_hint"))+'</div>';
    html += '</div>';
    return html;
  }

  for (const p of list){
    const langIcon = p.answers && p.answers.language === "php" ? "🐘"
                   : p.answers && p.answers.language === "node" ? "🟢"
                   : p.answers && p.answers.language === "python" ? "🐍" : "📦";

function renderTree(files){
  const root = {};
  for (const f of files){
    const parts = f.path.split("/");
    let node = root;
    parts.forEach((part, i) => {
      if (i === parts.length - 1){
        node.__files = node.__files || [];
        node.__files.push(part);
      } else {
        node[part] = node[part] || {};
        node = node[part];
      }
    });
  }
  let out = "";
  const walk = (node, prefix) => {
    const dirs = Object.keys(node).filter(k => k !== "__files").sort();
    const fs   = (node.__files || []).sort();
    dirs.forEach((d, i) => {
      const last = (i === dirs.length - 1) && fs.length === 0;
      out += prefix + (last ? "└── " : "├── ") + "<b>" + esc(d) + "/</b>\n";
      walk(node[d], prefix + (last ? "    " : "│   "));
    });
    fs.forEach((f, i) => {
      const last = i === fs.length - 1;
      out += prefix + (last ? "└── " : "├── ") + esc(f) + "\n";
    });
  };
  walk(root, "");
  return out || "—";
}

function fileIcon(path){
  const ext = (path.split(".").pop()||"").toLowerCase();
  const map = {
    php:"🐘", js:"🟨", mjs:"🟨", ts:"🔷", py:"🐍", json:"🔧",
    sql:"🗄", md:"📘", html:"🌐", css:"🎨", txt:"📄",
    env:"🔑", example:"🔑", yml:"⚙️", yaml:"⚙️", toml:"⚙️",
    gitignore:"🚫", lock:"🔒", xml:"📐", sh:"📜", htm:"🌐"
  };
  if (path.split("/").pop() === ".gitignore") return "🚫";
  if (path.endsWith(".env.example")) return "🔑";
  return map[ext] || "📄";
}

/* =========================================================================
   Static validation
   ========================================================================= */
function runStaticChecks(files, answers){
  const results = [];
  const push = (level, msg, file) => results.push({ level, msg, file });

  if (!files.length){
    push("error", LANG==="fa" ? "هیچ فایلی وجود ندارد." : "There are no files at all.");
    return results;
  }
  push("ok", (LANG==="fa"?"تعداد فایل‌ها: ":"File count: ") + files.length);

  // 1. Required files per stack
  const required = {
    php:    ["public/index.php","config/config.example.php","database/schema.sql","src/Database.php","README.md"],
    node:   ["package.json","src/server.js","src/app.js","src/db.js","database/schema.sql","README.md"],
    python: ["requirements.txt","app/main.py","app/db.py","database/schema.sql","README.md"]
  };
  const stack = answers.language;
  const req = required[stack] || [];
  for (const r of req){
    if (files.some(f => f.path === r)){
      push("ok", (LANG==="fa"?"فایل ضروری موجود است: ":"Required file present: ") + r, r);
    } else {
      push("error", (LANG==="fa"?"فایل ضروری گم است: ":"Required file missing: ") + r, r);
    }
  }

  // 2. Empty files
  let emptyCount = 0;
  for (const f of files){
    if (!f.content || !f.content.trim()){
      if (f.path.endsWith(".gitkeep")) continue;
      emptyCount++;
      push("warn", (LANG==="fa"?"فایل خالی: ":"Empty file: ") + f.path, f.path);
    }
  }
  if (!emptyCount) push("ok", LANG==="fa" ? "هیچ فایل خالی‌ای وجود ندارد." : "No empty files.");

  // 3. Bracket balance for code files
  const codeExt = [".php",".js",".mjs",".ts",".py"];
  let balanceErrors = 0;
  for (const f of files){
    if (!codeExt.some(e => f.path.endsWith(e))) continue;
    const src = stripStringsAndComments(f.content);
    const pairs = [["{","}"],["(",")"],["[","]"]];
    for (const [open, close] of pairs){
      const o = (src.match(new RegExp("\\"+open,"g"))||[]).length;
      const c = (src.match(new RegExp("\\"+close,"g"))||[]).length;
      if (o !== c){
        balanceErrors++;
        push("error",
          (LANG==="fa"? "عدم توازن ":"Unbalanced ") + open + close + " (" + o + " / " + c + ")",
          f.path);
        break;
      }
    }
  }
  if (!balanceErrors) push("ok", LANG==="fa" ? "توازن براکت‌ها در همه فایل‌های کد درست است." : "Bracket balance is correct in all code files.");

  // 4. JSON validity
  let jsonErrors = 0;
  for (const f of files){
    if (!f.path.endsWith(".json")) continue;
    try { JSON.parse(f.content); }
    catch(e){
      jsonErrors++;
      push("error", (LANG==="fa"?"JSON نامعتبر: ":"Invalid JSON: ") + e.message, f.path);
    }
  }
  if (!jsonErrors) push("ok", LANG==="fa" ? "همه فایل‌های JSON معتبرند." : "All JSON files parse correctly.");

  // 5. SQL sanity
  const sqlFiles = files.filter(f => f.path.endsWith(".sql"));
  if (!sqlFiles.length){
    push("warn", LANG==="fa" ? "هیچ فایل SQL پیدا نشد." : "No SQL file found.");
  } else {
    let hasCreate = false;
    for (const f of sqlFiles){
      if (/CREATE\s+TABLE/i.test(f.content)) hasCreate = true;
    }
    if (hasCreate) push("ok", LANG==="fa" ? "شِمای SQL شامل CREATE TABLE است." : "SQL schema contains CREATE TABLE.");
    else push("error", LANG==="fa" ? "در فایل SQL هیچ CREATE TABLE یافت نشد." : "No CREATE TABLE found in the SQL schema.");
  }

  // 6. Placeholder / secret leakage
  let secretHits = 0;
  const secretRe = /(password\s*[:=]\s*["'][^"'{}$]{6,}["'])|(secret\s*[:=]\s*["'][A-Za-z0-9]{20,}["'])/gi;
  for (const f of files){
    if (f.path.endsWith(".example") || f.path.endsWith("README.md")) continue;
    const m = f.content.match(secretRe);
    if (m && !/CHANGE_ME|process\.env|getenv|os\.environ|\$\{/.test(m.join(""))){
      secretHits++;
      push("warn", (LANG==="fa"?"مقدار محتمل حساس در کد: ":"Possible hardcoded secret: ") + f.path, f.path);
    }
  }
  if (!secretHits) push("ok", LANG==="fa" ? "هیچ رمز یا کلید ثابتی در کد پیدا نشد." : "No hardcoded secrets detected.");

  // 7. TODO placeholders
  let todoCount = 0;
  for (const f of files){
    const n = (f.content.match(/\bTODO\b|\bFIXME\b/g)||[]).length;
    if (n){ todoCount += n; push("warn", (n + " TODO/FIXME ") + (LANG==="fa"?"در ":"in ") + f.path, f.path); }
  }
  if (!todoCount) push("ok", LANG==="fa" ? "هیچ نشانگر TODO/FIXME باقی نمانده." : "No TODO/FIXME markers remain.");

  // 8. Tests present
  const hasTests = files.some(f =>
    f.path.includes("test") && (f.path.endsWith(".php") || f.path.endsWith(".js") || f.path.endsWith(".py"))
  );
  if (hasTests) push("ok", LANG==="fa" ? "فایل تست قابل اجرا تولید شده است." : "A runnable test file was generated.");
  else push("warn", LANG==="fa" ? "فایل تست یافت نشد." : "No test file found.");

  return results;
}

function stripStringsAndComments(src){
  let out = "";
  let i = 0;
  const n = src.length;
  while (i < n){
    const c = src[i], c2 = src[i+1];

    // line comment
    if ((c === "/" && c2 === "/") || c === "#"){
      while (i < n && src[i] !== "\n") i++;
      continue;
    }
    // block comment
    if (c === "/" && c2 === "*"){
      i += 2;
      while (i < n && !(src[i] === "*" && src[i+1] === "/")) i++;
      i += 2;
      continue;
    }
    // strings
    if (c === '"' || c === "'" || c === "`"){
      const q = c;
      i++;
      while (i < n){
        if (src[i] === "\\"){ i += 2; continue; }
        if (src[i] === q){ i++; break; }
        i++;
      }
      out += '""';
      continue;
    }
    out += c;
    i++;
  }
  return out;
}

async function actGenerate(){
  const a = { ...state.answers };
  if (!a.name.trim()) a.name = LANG === "fa" ? "پروژه بک‌اند من" : "My Backend Project";
  a.slug = slugify(a.name);
  a.desc = "";

  state.busy = true;
  render();

  try {
    const { files, arch } = generateProject(a);

    const id = uid();
    const now = Date.now();

    const project = {
      id,
      name: a.name.trim(),
      createdAt: now,
      updatedAt: now,
      answers: a,
      arch,
      fileCount: files.length
    };

    const fileRecords = files.map(f => projectFileRecord(id, f.path, f.content));

    await DB.putProject(project);
    await DB.putFiles(fileRecords);

    state.project = project;
    state.files = fileRecords.sort((x,y)=> x.path.localeCompare(y.path));
    state.currentFileId = state.files.length ? state.files[0].id : null;
    state.view = "arch";
    state.wizardStep = 0;
    state.answers = defaultAnswers();
    state.testResults = null;

    await refreshProjects();
    toast(t("gen_done"), "ok");
  } catch(e){
    console.error(e);
    toast(t("err_occurred") + ": " + e.message, "err");
  } finally {
    state.busy = false;
    render();
  }
}

  const copy = {
    ...src,
    id: newId,
    name: src.name + " (copy)",
    createdAt: now,
    updatedAt: now
  };
  delete copy.fileCount;

  await DB.putProject(copy);
  const recs = files.map(f => ({
    id: uid(),
    projectId: newId,
    path: f.path,
    content: f.content,
    size: f.size,
    updatedAt: now

  copy.fileCount = recs.length;
  await DB.putProject(copy);

  await refreshProjects();
  toast(t("duplicate") + " ✓", "ok");
  render();

function openFilePicker(multiple = true){
  const input = document.createElement("input");
  input.type = "file";
  input.multiple = multiple;
  input.accept = [
    ".php",".js",".mjs",".cjs",".ts",".tsx",".jsx",".py",".rb",".go",".rs",".java",
    ".kt",".swift",".cs",".cpp",".cc",".c",".h",".hpp",".m",".mm",
    ".sql",".json",".md",".markdown",".txt",".yml",".yaml",".toml",".ini",".conf",
    ".html",".htm",".css",".scss",".less",".xml",".sh",".bash",".zsh",".ps1",
    ".env",".example",".gitignore",".dockerfile",".vue",".svelte",".graphql",
    ".lock",".csv",".log"
  ].join(",");
  input.style.position = "fixed";
  input.style.left = "-9999px";
  document.body.appendChild(input);

  input.onchange = async () => {
    const files = Array.from(input.files || []);
    input.remove();
    if (!files.length) return;
    await handleImportedFiles(files);
  };
  input.click();
  // iOS needs the element to stay in the DOM briefly
  setTimeout(() => { if (input.parentNode) input.remove(); }, 60000);
}

async function handleImportedFiles(fileList){
  if (!state.project){
    // Import at dashboard level: create a project to hold them
    const name = LANG === "fa" ? "پروژه وارد‌شده" : "Imported Project";
    const id = uid();
    const now = Date.now();
    const project = {
      id, name, createdAt: now, updatedAt: now,
      answers: { ...defaultAnswers(), name, language:"php", database:"mysql", slug: slugify(name) },
      arch: {
        stack: LANG==="fa" ? "پروژه وارد‌شده (بدون تولید خودکار)" : "Imported project (no auto-generation)",
        why: [LANG==="fa"
          ? "این پروژه از فایل‌های موجود شما ساخته شد، نه از قالب داخلی. بنابراین معماری پیشنهادی برای آن وجود ندارد."
          : "This project was created from your own files, not from a built-in template. There is no generated architecture for it."],
        deps: [], install: [], run: [], limits: [], notes: [], warnings: []
      },
      fileCount: 0
    };
    await DB.putProject(project);
    state.project = project;
    state.files = [];
    state.view = "files";
  }

  const MAX = 2 * 1024 * 1024;
  const added = [];
  const skipped = [];

  for (const f of fileList){
    try {
      if (f.size > MAX){ skipped.push(f.name + " (" + t("too_big") + ")"); continue; }

      const lower = f.name.toLowerCase();
      let records = [];

      if (lower.endsWith(".zip")){
        const buf = await f.arrayBuffer();
        const entries = await readZip(buf);
        for (const e of entries){
          if (e.data.length > MAX){ skipped.push(e.path); continue; }
          let text;
          try {
            text = new TextDecoder("utf-8", { fatal:false }).decode(e.data);
          } catch { skipped.push(e.path + " (binary)"); continue; }
          if (text.includes("\u0000")) { skipped.push(e.path + " (binary)"); continue; }
          records.push({ path: e.path, content: text });
        }
      } else if (lower.endsWith(".json")){
        const text = await f.text();
        // Try to detect a Local Backend Forge project backup
        let parsed = null;
        try { parsed = JSON.parse(text); } catch {}
        if (parsed && parsed.__forge === "project" && parsed.project && Array.isArray(parsed.files)){
          await importForgeProject(parsed);
          continue;
        }
        records.push({ path: f.name, content: text });
      } else {
        const text = await f.text();
        if (text.includes("\u0000")){ skipped.push(f.name + " (binary)"); continue; }
        records.push({ path: f.name, content: text });
      }

      for (const r of records){
        // Avoid collisions: prefix with a folder if the path already exists
        let path = r.path;
        if (state.files.some(x => x.path === path)){
          path = "imported/" + path;
          let n = 2;
          while (state.files.some(x => x.path === path)){
            path = "imported/" + n + "/" + r.path;
            n++;
          }
        }
        const rec = projectFileRecord(state.project.id, path, r.content);
        await DB.putFile(rec);
        state.files.push(rec);
        added.push(path);
      }
    } catch(e){
      skipped.push(f.name + " — " + e.message);
    }
  }

  state.files.sort((a,b)=> a.path.localeCompare(b.path));
  if (state.files.length && !state.currentFileId) state.currentFileId = state.files[0].id;

  state.project.fileCount = state.files.length;
  state.project.updatedAt = Date.now();
  await DB.putProject(state.project);
  await refreshProjects();

  if (added.length){
    toast(added.length + " " + t("imported_n"), "ok");
  }
  if (skipped.length){
    toast(skipped.length + " " + t("skipped") + ": " + skipped.slice(0,2).join(", "), "warn");
  }
  if (!added.length && !skipped.length){
    toast(t("no_content"), "warn");
  }

  render();
}

/* ---------------- Export / Import ---------------- */
async function actExportZip(){
  if (!state.project) return;
  const p = state.project;
  const enc = new TextEncoder();
  const entries = state.files.map(f => ({
    path: p.answers.slug + "/" + f.path,
    data: enc.encode(f.content)
  }));

  // Add a machine-readable manifest so the ZIP is self-describing
  const manifest = {
    __forge: "project",
    version: 1,
    exportedAt: new Date().toISOString(),
    project: {
      name: p.name,
      answers: p.answers,
      arch: p.arch
    },
    files: state.files.map(f => f.path)
  };
  entries.push({
    path: p.answers.slug + "/.forge-manifest.json",
    data: enc.encode(JSON.stringify(manifest, null, 2))
  });

  try {
    const blob = buildZip(entries);
    download(blob, p.answers.slug + "-" + Date.now() + ".zip");
    toast(t("ex_zip") + " ✓", "ok");
  } catch(e){
    toast(t("err_occurred") + ": " + e.message, "err");
  }
}

async function actExportJson(){
  if (!state.project) return;
  const p = state.project;
  const payload = {
    __forge: "project",
    version: 1,
    exportedAt: new Date().toISOString(),
    project: {
      id: p.id,
      name: p.name,
      createdAt: p.createdAt,
      updatedAt: p.updatedAt,
      answers: p.answers,
      arch: p.arch
    },
    files: state.files.map(f => ({ path: f.path, content: f.content }))
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  download(blob, p.answers.slug + "-" + Date.now() + ".json");
  toast(t("ex_json") + " ✓", "ok");
}

function download(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 4000);
}

async function importForgeProject(payload){
  const proj = payload.project || {};
  if (!proj.name || !Array.isArray(payload.files)){
    toast(t("bad_file"), "err");
    return;
  }

  const exists = await DB.getProject(proj.id);
  if (exists){
    const ok = await confirmBox(t("import_json"), t("overwrite_q"), t("yes"));
    if (!ok) return;
  }

  const newId = exists ? proj.id : uid();
  const now = Date.now();

  const project = {
    id: newId,
    name: String(proj.name).slice(0, 120),
    createdAt: proj.createdAt || now,
    updatedAt: now,
    answers: proj.answers || defaultAnswers(),
    arch: proj.arch || { stack:"", why:[], deps:[], install:[], run:[], limits:[], notes:[], warnings:[] },
    fileCount: payload.files.length
  };

  if (exists){
    await DB.delFilesOf(newId);
  }
  await DB.putProject(project);

  const recs = [];
  for (const f of payload.files){
    if (typeof f.path !== "string" || typeof f.content !== "string") continue;
    recs.push(projectFileRecord(newId, f.path, f.content));
  }
  await DB.putFiles(recs);
  project.fileCount = recs.length;
  await DB.putProject(project);

  await refreshProjects();
  toast(t("import_json") + " ✓", "ok");
}

async function actImportJson(){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".json,application/json,.zip,application/zip";
  input.style.position = "fixed";
  input.style.left = "-9999px";
  document.body.appendChild(input);

  input.onchange = async () => {
    const f = input.files && input.files[0];
    input.remove();
    if (!f) return;

    try {
      if (f.name.toLowerCase().endsWith(".zip")){
        const buf = await f.arrayBuffer();
        const entries = await readZip(buf);
        const manifestEntry = entries.find(e => e.path.endsWith(".forge-manifest.json"));
        if (!manifestEntry){
          toast(LANG==="fa"
            ? "این ZIP فایل manifest ندارد؛ نمی‌توان آن را به‌عنوان پروژه بازگرداند. از «افزودن فایل‌های کد» استفاده کنید."
            : "This ZIP has no manifest; it cannot be restored as a project. Use 'Import code files' instead.", "err");
          return;
        }
        const manifest = JSON.parse(new TextDecoder().decode(manifestEntry.data));
        const prefix = manifestEntry.path.replace(/\.forge-manifest\.json$/, "");
        const files = entries
          .filter(e => e.path.startsWith(prefix) && e.path !== manifestEntry.path)
          .map(e => ({
            path: e.path.slice(prefix.length),
            content: new TextDecoder().decode(e.data)
          }));
        await importForgeProject({ project: manifest.project, files });
      } else {
        const text = await f.text();
        const payload = JSON.parse(text);
        if (payload.__forge !== "project" || !payload.project || !Array.isArray(payload.files)){
          toast(t("bad_file"), "err");
          return;
        }
        await importForgeProject(payload);
      }
      state.project = null;
      state.view = "dashboard";
      render();
    } catch(e){
      toast(t("bad_file") + ": " + e.message, "err");
    }
  };
  input.click();
  setTimeout(() => { if (input.parentNode) input.remove(); }, 60000);
}

/* ---------------- AI probe (honest connectivity check) ---------------- */
async function actProbeAi(){
  const url = ($("#aiUrl")||{}).value || "";
  if (!url.trim()){ toast(LANG==="fa"?"آدرس را وارد کنید":"Enter a URL first", "warn"); return; }
  toast(LANG==="fa"?"در حال بررسی اتصال…":"Probing connectivity…");

  const controller = new AbortController();
  const timer = setTimeout(()=> controller.abort(), 7000);

  try {
    // HEAD/GET to the endpoint root only — no key, no payload, no data.
    await fetch(url, { method:"GET", mode:"no-cors", signal: controller.signal, cache:"no-store" });
    toast(LANG==="fa"
      ? "درخواست ارسال شد. حالت no-cors پاسخ را قابل خواندن نمی‌کند؛ این یعنی فقط دسترسی شبکه تأیید شد، نه اعتبار کلید."
      : "Request dispatched. no-cors mode hides the response, so only network reachability was confirmed — not key validity.", "ok");
  } catch(e){
    if (e.name === "AbortError"){
      toast(LANG==="fa" ? "زمان انتظار تمام شد (بدون پاسخ)." : "Timed out (no response).", "err");
    } else {
      toast(LANG==="fa" ? "اتصال برقرار نشد: " + e.message : "No connection: " + e.message, "err");
    }
  } finally {
    clearTimeout(timer);
  }
}

/* ---------------- Versions ---------------- */
async function actRestoreVersion(vid){
  const versions = await DB.versionsOf(state.project.id);
  const v = versions.find(x => x.id === vid);
  if (!v) return;

  const ok = await confirmBox(
    t("ex_restore"),
    LANG==="fa"
      ? "فایل‌های فعلی با نسخه «" + v.label + "» جایگزین می‌شوند. یک نسخه پشتیبان از وضعیت فعلی گرفته می‌شود."
      : "Current files will be replaced with version \"" + v.label + "\". A snapshot of the current state will be taken first.",
    t("ex_restore")
  );
  if (!ok) return;

  await snapshotVersion("pre-restore");

  await DB.delFilesOf(state.project.id);
  const recs = v.files.map(f => projectFileRecord(state.project.id, f.path, f.content));
  await DB.putFiles(recs);

  state.files = recs.sort((a,b)=> a.path.localeCompare(b.path));
  state.currentFileId = state.files.length ? state.files[0].id : null;

  state.project.name = v.name || state.project.name;
  state.project.arch = v.arch || state.project.arch;
  state.project.answers = v.answers || state.project.answers;
  state.project.fileCount = recs.length;
  state.project.updatedAt = Date.now();
  await DB.putProject(state.project);

  await refreshProjects();
  toast(t("ex_restore") + " ✓", "ok");
  render();
}
