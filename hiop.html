document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.getAttribute("data-act");
  const id  = el.getAttribute("data-id");
  const v   = el.getAttribute("data-v");

  switch (act){
    case "nav":
      state.view = v;
      state.search = "";
      render();
      break;

    case "go":
      state.view = v;
      render();
      break;

    case "new-project":
      state.answers = defaultAnswers();
      state.wizardStep = 0;
      state.view = "wizard";
      render();
      break;

    case "wiz-set": {
      const k = el.getAttribute("data-k");
      state.answers[k] = v;
      // Re-apply recommendations the user hasn't explicitly contradicted
      if (k === "deploy"){
        const rec = recommend(state.answers);
        if (rec.suggest.language) state.answers.language = rec.suggest.language;
        if (rec.suggest.database) state.answers.database = rec.suggest.database;
      }
      if (k === "users"){
        const rec = recommend(state.answers);
        if (rec.suggest.database) state.answers.database = rec.suggest.database;
      }
      if (k === "type"){
        const rec = recommend(state.answers);
        if (rec.suggest.roles !== undefined) state.answers.roles = rec.suggest.roles;
        if (state.answers.type === "media") state.answers.upload = true;
        if (state.answers.type === "saas") state.answers.admin = true;
        if (state.answers.type === "ai") state.answers.ai = true;
      }
      render();
      break;
    }

    case "wiz-toggle": {
      const k = el.getAttribute("data-k");
      state.answers[k] = !state.answers[k];
      render();
      break;
    }

    case "wiz-next":
      if (state.wizardStep < WIZARD_STEPS.length - 1){
        state.wizardStep++;
        render();
        $("#main").scrollTop = 0;
      }
      break;

    case "wiz-prev":
      if (state.wizardStep > 0){
        state.wizardStep--;
        render();
        $("#main").scrollTop = 0;
      }
      break;

    case "wiz-generate":
      await actGenerate();
      break;

    case "open-project":
      await actOpenProject(id);
      break;

    case "proj-menu": {
      const res = await sheet(
        (state.projects.find(x=>x.id===id)||{}).name || "Project",
        '<div class="row" style="flex-direction:column;gap:8px">'+
          '<button class="btn block" data-mc="open">🚪 '+esc(t("open"))+'</button>'+
          '<button class="btn block" data-mc="rename">✏️ '+esc(t("rename"))+'</button>'+
          '<button class="btn block" data-mc="dup">📑 '+esc(t("duplicate"))+'</button>'+
          '<button class="btn block danger" data-mc="del">🗑 '+esc(t("del"))+'</button>'+
        '</div>'
      );
      if (res === "open")   await actOpenProject(id);
      if (res === "rename") await actRenameProject(id);
      if (res === "dup")    await actDuplicateProject(id);
      if (res === "del")    await actDeleteProject(id);
      break;
    }

    case "filter":
      state.filter = v;
      render();
      break;

    case "sort":
      state.sort = v;
      render();
      break;

    case "open-file":
      state.currentFileId = id;
      state.view = "editor";
      state.editorDirty = false;
      render();
      break;

    case "save-file":
      await actSaveFile();
      break;

    case "delete-file":
      await actDeleteFile();
      break;

    case "new-file":
      await actNewFile();
      break;

    case "copy-file": {
      const f = state.files.find(x => x.id === state.currentFileId);
      if (f) await copyText(f.content);
      break;
    }

    case "copy-sql": {
      const f = state.files.find(x => x.path.endsWith(".sql"));
      if (f) await copyText(f.content);
      break;
    }

    case "find-toggle": {
      const bar = $("#findBar");
      if (bar){
        bar.style.display = bar.style.display === "none" ? "flex" : "none";
        if (bar.style.display === "flex") $("#findInput").focus();
      }
      break;
    }

    case "find-close": {
      const bar = $("#findBar");
      if (bar) bar.style.display = "none";
      break;
    }

    case "find-next": {
      const area = $("#codeArea");
      const q = ($("#findInput")||{}).value || "";
      if (!area || !q) break;
      const txt = area.value;
      const start = area.selectionEnd || 0;
      let idx = txt.indexOf(q, start);
      if (idx === -1) idx = txt.indexOf(q, 0);
      if (idx === -1){ toast(t("ed_findnone"), "warn"); break; }
      area.focus();
      area.setSelectionRange(idx, idx + q.length);
      // Scroll the selection into view
      const before = txt.slice(0, idx);
      const lineNo = before.split("\n").length - 1;
      const lineHeight = 12.5 * 1.62;
      area.scrollTop = Math.max(0, lineNo * lineHeight - area.clientHeight / 2);
      break;
    }

    case "import-files":
    case "import-files-global":
      openFilePicker(true);
      break;

    case "import-json":
      await actImportJson();
      break;

    case "export-zip":
      await actExportZip();
      break;

    case "export-json":
      await actExportJson();
      break;

    case "snapshot":
      await snapshotVersion();
      toast(t("ex_snapshot") + " ✓", "ok");
      render();
      break;

    case "restore":
      await actRestoreVersion(id);
      break;

    case "run-tests": {
      state.busy = true;
      render();
      await new Promise(r => setTimeout(r, 60));
      state.testResults = runStaticChecks(state.files, state.project.answers || {});
      state.busy = false;
      render();
      const errs = state.testResults.filter(x=>x.level==="error").length;
      toast(errs ? (errs + " " + t("ts_failed")) : t("ts_ok"), errs ? "err" : "ok");
      break;
    }

    case "save-ai": {
      const url = ($("#aiUrl")||{}).value || "";
      const key = ($("#aiKey")||{}).value || "";
      const model = ($("#aiModel")||{}).value || "";
      state.settings.aiUrl = url.trim();
      state.settings.aiKey = key.trim();
      state.settings.aiModel = model.trim();
      await DB.setSetting("aiUrl", state.settings.aiUrl);
      await DB.setSetting("aiKey", state.settings.aiKey);
      await DB.setSetting("aiModel", state.settings.aiModel);
      toast(t("save_ok"), "ok");
      render();
      break;
    }

    case "probe-ai":
      await actProbeAi();
      break;

    case "clear-all": {
      const ok = await confirmBox(t("st_clear"), t("st_clear_confirm"), t("st_clear"));
      if (!ok) return;
      await DB.clearAll();
      state.projects = [];
      state.project = null;
      state.files = [];
      state.currentFileId = null;
      state.settings = {};
      state.view = "dashboard";
      toast(t("st_clear") + " ✓", "ok");
      render();
      break;
    }
  }
});

    const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });

        '<h2>IndexedDB unavailable</h2>' +

    for (const s of settings){
      if (s.key === "lang" && (s.value === "fa" || s.value === "en")) LANG = s.value;
      else state.settings[s.key] = s.value;
    }

    await refreshProjects();

    // Fix file counts that were never stored
    for (const p of state.projects){
      if (p.fileCount == null){
        const files = await DB.filesOf(p.id);
        p.fileCount = files.length;
        await DB.putProject(p);
      }
    }

    render();
  } catch(e){
    console.error(e);
    document.body.innerHTML =
      '<div style="padding:40px;text-align:center;color:#e7eaf3">' +
      '<h2>' + esc(t("err_occurred")) + '</h2>' +
      '<p class="mono" style="color:#8b93a7;font-size:12px">' + esc(e.message) + '</p>' +
      '</div>';
  }
})();
</script>
</body>
</html>
