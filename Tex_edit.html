<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#05060A" />
<meta name="description" content="NONO AI — همه مدل‌های هوش مصنوعی، در یک گفت‌وگو" />
<title>NONO AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ RESET & BASE ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Vazirmatn', 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg-0);
  color: var(--text-0);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overscroll-behavior: none;
  touch-action: manipulation;
}
html[dir="ltr"] body { font-family: 'Inter', 'Vazirmatn', system-ui, sans-serif; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; border: none; outline: none; background: none; color: inherit; }
a { color: inherit; text-decoration: none; }
::selection { background: var(--accent); color: white; }

/* ============ THEME VARIABLES ============ */
:root {
  --bg-0: #05060A;
  --bg-1: #0B0D14;
  --bg-2: #111522;
  --bg-3: #1A1F33;
  --bg-4: #242A42;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.14);
  --text-0: #F5F6FA;
  --text-1: #C8CCD8;
  --text-2: #8A90A3;
  --text-3: #5A6078;
  --accent: #7C5CFF;
  --accent-2: #4F8CFF;
  --accent-3: #00D4FF;
  --success: #3DDC97;
  --warning: #FFB547;
  --danger: #FF5C7C;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 16px 48px rgba(0,0,0,0.5);
  --glass: rgba(17, 21, 34, 0.6);
  --glass-border: rgba(255,255,255,0.06);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --radius-xl: 32px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}
html[data-theme="light"] {
  --bg-0: #F7F8FC;
  --bg-1: #FFFFFF;
  --bg-2: #F0F2F8;
  --bg-3: #E6E9F2;
  --bg-4: #D8DCE8;
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.14);
  --text-0: #0B0D14;
  --text-1: #3A3F52;
  --text-2: #6B7088;
  --text-3: #9096AC;
  --shadow-sm: 0 2px 8px rgba(10,20,60,0.06);
  --shadow-md: 0 8px 24px rgba(10,20,60,0.08);
  --shadow-lg: 0 16px 48px rgba(10,20,60,0.12);
  --glass: rgba(255,255,255,0.7);
  --glass-border: rgba(0,0,0,0.06);
}

/* ============ SCROLLBAR ============ */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

/* ============ APP SHELL ============ */
#app {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg-0);
  overflow: hidden;
}
.bg-gradient {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 10%, rgba(124,92,255,0.15), transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 90%, rgba(0,212,255,0.10), transparent 60%),
    radial-gradient(ellipse 40% 30% at 50% 50%, rgba(79,140,255,0.08), transparent 60%);
}
html[data-theme="light"] .bg-gradient {
  background:
    radial-gradient(ellipse 60% 50% at 20% 10%, rgba(124,92,255,0.10), transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 90%, rgba(0,212,255,0.08), transparent 60%);
}

/* ============ HEADER ============ */
.app-header {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(var(--safe-top) + 12px) 16px 12px;
  background: var(--glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.header-left, .header-right { display: flex; align-items: center; gap: 8px; }
.header-center { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; min-width: 0; }
.header-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
.header-sub { font-size: 11px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.icon-btn {
  width: 40px; height: 40px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 12px;
  transition: background 0.2s, transform 0.1s;
  color: var(--text-1);
}
.icon-btn:hover { background: var(--bg-2); }
.icon-btn:active { transform: scale(0.92); }
.icon-btn svg { width: 20px; height: 20px; }

/* ============ MAIN AREA ============ */
.main-area {
  position: relative;
  flex: 1;
  display: flex;
  overflow: hidden;
  z-index: 1;
}
.view {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  overflow: hidden;
}
.view.active { display: flex; }

/* ============ HOME VIEW ============ */
.home-view {
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow-y: auto;
  padding-bottom: calc(var(--safe-bottom) + 100px);
}
.home-content {
  width: 100%;
  max-width: 640px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}
.orb-wrap {
  position: relative;
  width: 220px; height: 220px;
  display: flex; align-items: center; justify-content: center;
  margin: 20px 0 8px;
}
.orb {
  width: 160px; height: 160px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), transparent 50%),
    radial-gradient(circle at 70% 70%, rgba(0,212,255,0.6), transparent 50%),
    radial-gradient(circle at 50% 50%, #7C5CFF, #4F8CFF 60%, #00D4FF 100%);
  box-shadow:
    0 0 60px rgba(124,92,255,0.5),
    0 0 100px rgba(0,212,255,0.3),
    inset 0 0 40px rgba(255,255,255,0.2);
  animation: orbFloat 6s ease-in-out infinite, orbPulse 3s ease-in-out infinite;
  position: relative;
}
.orb::before {
  content: '';
  position: absolute;
  inset: -20px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(124,92,255,0.3), transparent 70%);
  filter: blur(20px);
  animation: orbGlow 4s ease-in-out infinite;
}
.orb-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid rgba(124,92,255,0.3);
  animation: orbRing 8s linear infinite;
}
.orb-ring:nth-child(2) { inset: -15px; animation-duration: 12s; animation-direction: reverse; border-color: rgba(0,212,255,0.2); }
.orb-ring:nth-child(3) { inset: -30px; animation-duration: 16s; border-color: rgba(79,140,255,0.15); }

@keyframes orbFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}
@keyframes orbPulse {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.15); }
}
@keyframes orbGlow {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.1); }
}
@keyframes orbRing {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.orb[data-state="thinking"] { animation: orbFloat 6s ease-in-out infinite, orbThink 1s ease-in-out infinite; }
@keyframes orbThink {
  0%, 100% { filter: brightness(1) hue-rotate(0deg); }
  50% { filter: brightness(1.3) hue-rotate(20deg); }
}
.orb[data-state="streaming"] { animation: orbFloat 6s ease-in-out infinite, orbStream 2s ease-in-out infinite; }
@keyframes orbStream {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-8px) scale(1.05); }
}
.orb[data-state="success"] { background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), transparent 50%), radial-gradient(circle at 70% 70%, rgba(61,220,151,0.6), transparent 50%), radial-gradient(circle at 50% 50%, #3DDC97, #00D4FF 100%); }
.orb[data-state="error"] { background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), transparent 50%), radial-gradient(circle at 70% 70%, rgba(255,92,124,0.6), transparent 50%), radial-gradient(circle at 50% 50%, #FF5C7C, #FFB547 100%); }

.home-greeting {
  text-align: center;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.home-subtitle {
  text-align: center;
  font-size: 16px;
  color: var(--text-1);
  margin-top: -8px;
}
.primary-btn {
  padding: 14px 32px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white;
  border-radius: 16px;
  font-size: 16px;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(124,92,255,0.4);
  transition: transform 0.15s, box-shadow 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.primary-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(124,92,255,0.5); }
.primary-btn:active { transform: scale(0.97); }

.quick-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  width: 100%;
  margin-top: 8px;
}
.quick-action {
  padding: 16px 12px;
  background: var(--glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
  font-size: 13px;
  color: var(--text-1);
}
.quick-action:hover { background: var(--bg-2); border-color: var(--border-strong); transform: translateY(-2px); }
.quick-action:active { transform: scale(0.96); }
.quick-action .qa-icon { font-size: 22px; }

.provider-shortcuts {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 16px;
}
.provider-shortcuts-label {
  font-size: 12px;
  color: var(--text-2);
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.provider-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}
.provider-chip {
  padding: 8px 14px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 100px;
  font-size: 13px;
  color: var(--text-1);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}
.provider-chip:hover { background: var(--bg-3); border-color: var(--accent); }
.provider-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }

/* ============ CHAT VIEW ============ */
.chat-view { display: none; flex-direction: column; }
.chat-view.active { display: flex; }
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}
.msg {
  display: flex;
  gap: 10px;
  max-width: 100%;
  animation: msgIn 0.3s ease-out;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg.user { flex-direction: row-reverse; }
.msg-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white;
}
.msg.user .msg-avatar { background: var(--bg-3); color: var(--text-1); }
.msg-bubble {
  max-width: calc(100% - 50px);
  padding: 12px 16px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.6;
  word-wrap: break-word;
  position: relative;
}
.msg.user .msg-bubble {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white;
  border-bottom-right-radius: 6px;
}
.msg.ai .msg-bubble {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-bottom-left-radius: 6px;
  color: var(--text-0);
}
.msg-bubble.collapsed .msg-content {
  max-height: 240px;
  overflow: hidden;
  position: relative;
}
.msg-bubble.collapsed .msg-content::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 80px;
  background: linear-gradient(to bottom, transparent, var(--bg-2));
  pointer-events: none;
}
.msg-expand {
  margin-top: 8px;
  padding: 6px 12px;
  background: var(--bg-3);
  border-radius: 100px;
  font-size: 12px;
  color: var(--text-1);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.2s;
}
.msg-expand:hover { background: var(--bg-4); }
.msg-actions {
  display: flex;
  gap: 4px;
  margin-top: 8px;
  opacity: 0;
  transition: opacity 0.2s;
}
.msg:hover .msg-actions { opacity: 1; }
.msg-action {
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 11px;
  color: var(--text-2);
  transition: all 0.15s;
}
.msg-action:hover { background: var(--bg-3); color: var(--text-0); }
.msg-meta {
  font-size: 11px;
  color: var(--text-2);
  margin-top: 4px;
  display: flex;
  gap: 8px;
  align-items: center;
}
.msg-meta .provider-tag {
  padding: 2px 8px;
  background: var(--bg-3);
  border-radius: 100px;
  font-size: 10px;
}

.typing-indicator {
  display: flex;
  gap: 4px;
  padding: 4px 0;
}
.typing-indicator span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text-2);
  animation: typing 1.4s ease-in-out infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* Composer */
.composer-wrap {
  padding: 12px 16px calc(var(--safe-bottom) + 12px);
  background: var(--glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
}
.composer {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 8px 8px 8px 12px;
  transition: border-color 0.2s;
}
.composer:focus-within { border-color: var(--accent); }
html[dir="ltr"] .composer { padding: 8px 12px 8px 8px; }
.composer-input {
  flex: 1;
  min-height: 24px;
  max-height: 160px;
  padding: 6px 4px;
  font-size: 15px;
  line-height: 1.5;
  resize: none;
  overflow-y: auto;
}
.composer-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2);
  transition: all 0.2s;
  flex-shrink: 0;
}
.composer-btn:hover { background: var(--bg-3); color: var(--text-0); }
.composer-btn.send {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white;
}
.composer-btn.send:disabled { opacity: 0.4; cursor: not-allowed; }
.composer-btn.recording { background: var(--danger); color: white; animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,92,124,0.6); }
  50% { box-shadow: 0 0 0 8px rgba(255,92,124,0); }
}

/* ============ MODELS VIEW ============ */
.models-view { display: none; flex-direction: column; }
.models-view.active { display: flex; }
.models-toolbar {
  padding: 12px 16px;
  display: flex;
  gap: 8px;
  align-items: center;
  border-bottom: 1px solid var(--border);
}
.search-box {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  transition: border-color 0.2s;
}
.search-box:focus-within { border-color: var(--accent); }
.search-box input { flex: 1; font-size: 14px; }
.search-box svg { width: 16px; height: 16px; color: var(--text-2); }

.models-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 16px 100px;
}
.provider-group {
  margin-bottom: 16px;
}
.provider-group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 4px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-1);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.provider-group-count {
  font-size: 11px;
  color: var(--text-2);
  font-weight: 400;
}
.model-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 6px;
  transition: all 0.2s;
  cursor: pointer;
}
.model-card:hover { border-color: var(--border-strong); background: var(--bg-2); }
.model-card.selected { border-color: var(--accent); background: rgba(124,92,255,0.08); }
.model-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  background: var(--bg-3);
  flex-shrink: 0;
}
.model-info { flex: 1; min-width: 0; }
.model-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.model-meta { font-size: 11px; color: var(--text-2); margin-top: 2px; display: flex; gap: 8px; align-items: center; }
.model-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.badge {
  padding: 2px 6px;
  background: var(--bg-3);
  border-radius: 4px;
  font-size: 10px;
  color: var(--text-2);
}
.badge.accent { background: rgba(124,92,255,0.15); color: var(--accent); }
.badge.success { background: rgba(61,220,151,0.15); color: var(--success); }
.model-toggle {
  width: 38px; height: 22px;
  border-radius: 100px;
  background: var(--bg-3);
  position: relative;
  transition: background 0.2s;
  flex-shrink: 0;
}
.model-toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: white;
  transition: all 0.2s;
}
html[dir="rtl"] .model-toggle::after { right: 2px; }
html[dir="ltr"] .model-toggle::after { left: 2px; }
.model-toggle.on { background: var(--accent); }
html[dir="rtl"] .model-toggle.on::after { right: 18px; }
html[dir="ltr"] .model-toggle.on::after { left: 18px; }

/* ============ CANVAS VIEW ============ */
.canvas-view { display: none; flex-direction: column; }
.canvas-view.active { display: flex; }
.canvas-toolbar {
  padding: 10px 12px;
  display: flex;
  gap: 6px;
  align-items: center;
  border-bottom: 1px solid var(--border);
  background: var(--bg-1);
  overflow-x: auto;
  scrollbar-width: none;
}
.canvas-toolbar::-webkit-scrollbar { display: none; }
.canvas-tab {
  padding: 7px 12px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
  color: var(--text-1);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.2s;
}
.canvas-tab:hover { background: var(--bg-3); }
.canvas-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
.canvas-tab .close {
  width: 14px; height: 14px;
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 10px;
  margin-inline-start: 4px;
  opacity: 0.7;
}
.canvas-tab .close:hover { opacity: 1; background: rgba(255,255,255,0.2); }
.canvas-new {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 14px;
  color: var(--text-1);
}
.canvas-new:hover { background: var(--bg-3); }

.canvas-body {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}
.canvas-editor-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
.canvas-editor {
  flex: 1;
  width: 100%;
  padding: 20px;
  font-size: 15px;
  line-height: 1.7;
  resize: none;
  overflow-y: auto;
  background: var(--bg-0);
  font-family: 'Vazirmatn', 'Inter', monospace;
  tab-size: 2;
}
html[dir="ltr"] .canvas-editor.code { font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace; font-size: 13px; }
html[dir="rtl"] .canvas-editor.code { font-family: 'Vazirmatn', monospace; font-size: 13px; direction: ltr; text-align: left; }

.canvas-preview-wrap {
  flex: 1;
  display: none;
  flex-direction: column;
  background: white;
  overflow: hidden;
}
.canvas-preview-wrap.active { display: flex; }
.canvas-preview-toolbar {
  padding: 8px 12px;
  display: flex;
  gap: 6px;
  align-items: center;
  background: var(--bg-1);
  border-bottom: 1px solid var(--border);
}
.canvas-preview-frame {
  flex: 1;
  border: none;
  width: 100%;
  background: white;
}

.canvas-selection-toolbar {
  position: absolute;
  background: var(--bg-2);
  border: 1px solid var(--border-strong);
  border-radius: 12px;
  padding: 6px;
  display: none;
  gap: 4px;
  box-shadow: var(--shadow-md);
  z-index: 100;
  flex-wrap: wrap;
  max-width: 320px;
}
.canvas-selection-toolbar.visible { display: flex; }
.sel-action {
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 12px;
  color: var(--text-1);
  transition: all 0.15s;
  white-space: nowrap;
}
.sel-action:hover { background: var(--accent); color: white; }

.canvas-versions {
  position: absolute;
  top: 8px;
  inset-inline-end: 8px;
  display: flex;
  gap: 4px;
  z-index: 10;
}
.version-btn {
  padding: 6px 10px;
  background: var(--glass);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 11px;
  color: var(--text-1);
}
.version-btn:hover { background: var(--bg-2); }

/* ============ FILES VIEW ============ */
.files-view { display: none; flex-direction: column; }
.files-view.active { display: flex; }
.files-list {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
  align-content: start;
}
.file-card {
  padding: 16px 12px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.file-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.file-icon { font-size: 32px; }
.file-name { font-size: 12px; color: var(--text-1); text-align: center; word-break: break-all; }
.file-meta { font-size: 10px; color: var(--text-2); }

/* ============ SETTINGS VIEW ============ */
.settings-view { display: none; flex-direction: column; }
.settings-view.active { display: flex; }
.settings-list {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}
.settings-group {
  margin-bottom: 24px;
}
.settings-group-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-2);
  padding: 0 4px 8px;
}
.settings-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 12px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 6px;
  gap: 12px;
}
.settings-item-label { font-size: 14px; color: var(--text-0); }
.settings-item-desc { font-size: 11px; color: var(--text-2); margin-top: 2px; }
.settings-item-control { flex-shrink: 0; }
.settings-select {
  padding: 6px 10px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-0);
}
.settings-input {
  padding: 8px 12px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-0);
  width: 200px;
  max-width: 100%;
}
.settings-btn {
  padding: 8px 14px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-0);
  transition: all 0.2s;
}
.settings-btn:hover { background: var(--bg-3); }
.settings-btn.danger { color: var(--danger); }
.settings-btn.danger:hover { background: rgba(255,92,124,0.1); border-color: var(--danger); }

/* ============ BOTTOM NAV ============ */
.bottom-nav {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: space-around;
  padding: 8px 8px calc(var(--safe-bottom) + 8px);
  background: var(--glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 4px;
  border-radius: 12px;
  color: var(--text-2);
  transition: all 0.2s;
  font-size: 10px;
}
.nav-item svg { width: 22px; height: 22px; }
.nav-item.active { color: var(--accent); }
.nav-item:active { transform: scale(0.92); }

/* ============ MODAL ============ */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 1000;
  display: none;
  align-items: flex-end;
  justify-content: center;
  animation: fadeIn 0.2s;
}
.modal-backdrop.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: 100%;
  max-width: 520px;
  max-height: 85vh;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 20px 20px 0 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: slideUp 0.3s cubic-bezier(0.32, 0.72, 0, 1);
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
@media (min-width: 640px) {
  .modal-backdrop { align-items: center; }
  .modal { border-radius: 20px; max-height: 80vh; }
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title { font-size: 16px; font-weight: 600; }
.modal-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}
.modal-footer {
  padding: 12px 20px calc(var(--safe-bottom) + 12px);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

/* ============ FORM ============ */
.form-group { margin-bottom: 14px; }
.form-label {
  display: block;
  font-size: 12px;
  color: var(--text-2);
  margin-bottom: 6px;
  font-weight: 500;
}
.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  color: var(--text-0);
  transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { min-height: 80px; resize: vertical; font-family: inherit; }
.form-checkbox {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  cursor: pointer;
}
.form-checkbox input { width: 18px; height: 18px; accent-color: var(--accent); }

/* ============ TOAST ============ */
.toast-container {
  position: fixed;
  top: calc(var(--safe-top) + 16px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
  max-width: 90%;
}
.toast {
  padding: 12px 18px;
  background: var(--bg-2);
  border: 1px solid var(--border-strong);
  border-radius: 12px;
  box-shadow: var(--shadow-md);
  font-size: 13px;
  color: var(--text-0);
  display: flex;
  align-items: center;
  gap: 8px;
  animation: toastIn 0.3s, toastOut 0.3s 3.7s forwards;
  pointer-events: auto;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes toastOut {
  to { opacity: 0; transform: translateY(-20px); }
}
.toast.success { border-color: var(--success); }
.toast.error { border-color: var(--danger); }
.toast.warning { border-color: var(--warning); }

/* ============ DEMO BANNER ============ */
.demo-banner {
  position: fixed;
  top: calc(var(--safe-top) + 8px);
  left: 50%;
  transform: translateX(-50%);
  padding: 6px 14px;
  background: rgba(255,181,71,0.15);
  border: 1px solid rgba(255,181,71,0.4);
  color: var(--warning);
  border-radius: 100px;
  font-size: 11px;
  font-weight: 500;
  z-index: 100;
  display: none;
  align-items: center;
  gap: 6px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.demo-banner.visible { display: inline-flex; }

/* ============ DROP ZONE ============ */
.drop-zone {
  position: fixed;
  inset: 0;
  background: rgba(124,92,255,0.15);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 3px dashed var(--accent);
  z-index: 3000;
  display: none;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.drop-zone.active { display: flex; }
.drop-zone-content {
  padding: 40px;
  background: var(--glass);
  border-radius: 24px;
  text-align: center;
}
.drop-zone-icon { font-size: 48px; margin-bottom: 12px; }
.drop-zone-text { font-size: 18px; font-weight: 600; }

/* ============ SPLIT VIEW (DESKTOP) ============ */
@media (min-width: 900px) {
  .split-view .canvas-view {
    display: flex;
    border-inline-start: 1px solid var(--border);
  }
  .split-view .chat-view,
  .split-view .canvas-view {
    flex: 1;
    position: relative;
  }
  .bottom-nav { display: none; }
}

/* ============ UTILITIES ============ */
.hidden { display: none !important; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-center { justify-content: center; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.text-center { text-align: center; }
.w-full { width: 100%; }
.mt-2 { margin-top: 8px; }
.mt-3 { margin-top: 12px; }
.p-2 { padding: 8px; }
.p-3 { padding: 12px; }

/* ============ REDUCED MOTION ============ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ============ FOCUS STATES ============ */
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
</style>
</head>
<body>
<div id="app">
  <div class="bg-gradient"></div>

  <!-- DEMO BANNER -->
  <div class="demo-banner" id="demoBanner">
    <span>🟡</span>
    <span data-i18n="demo_mode">حالت نمایشی</span>
  </div>

  <!-- HEADER -->
  <header class="app-header" id="appHeader">
    <div class="header-left">
      <button class="icon-btn" id="btnBack" aria-label="Back" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
    <div class="header-center">
      <div class="header-title" id="headerTitle">NONO AI</div>
      <div class="header-sub" id="headerSub" data-i18n="tagline">همه مدل‌های هوش مصنوعی، در یک گفت‌وگو</div>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="btnTheme" aria-label="Theme">
        <svg id="iconTheme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="icon-btn" id="btnLang" aria-label="Language">
        <span style="font-size:12px;font-weight:600" id="langLabel">EN</span>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main-area" id="mainArea">
    <!-- HOME -->
    <section class="view home-view active" id="viewHome">
      <div class="home-content">
        <div class="orb-wrap">
          <div class="orb" id="homeOrb" data-state="idle"></div>
          <div class="orb-ring"></div>
          <div class="orb-ring"></div>
          <div class="orb-ring"></div>
        </div>
        <h1 class="home-greeting" data-i18n="greeting">سلام 👋</h1>
        <p class="home-subtitle" data-i18n="home_subtitle">امروز چه کاری برات انجام بدم؟</p>
        <button class="primary-btn" id="btnStartChat">
          <span data-i18n="start_chat">شروع چت</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </button>
        <div class="quick-actions">
          <button class="quick-action" data-action="chat"><span class="qa-icon">💬</span><span data-i18n="qa_chat">چت جدید</span></button>
          <button class="quick-action" data-action="canvas"><span class="qa-icon">🎨</span><span>Canvas</span></button>
          <button class="quick-action" data-action="code"><span class="qa-icon">💻</span><span data-i18n="qa_code">کدنویسی</span></button>
          <button class="quick-action" data-action="write"><span class="qa-icon">✍️</span><span data-i18n="qa_write">نوشتن</span></button>
          <button class="quick-action" data-action="preview"><span class="qa-icon">🌐</span><span>Preview</span></button>
          <button class="quick-action" data-action="files"><span class="qa-icon">📁</span><span data-i18n="qa_files">فایل</span></button>
        </div>
        <div class="provider-shortcuts">
          <div class="provider-shortcuts-label" data-i18n="providers">ارائه‌دهندگان</div>
          <div class="provider-chips" id="providerChips"></div>
        </div>
      </div>
    </section>

    <!-- CHAT -->
    <section class="view chat-view" id="viewChat">
      <div class="chat-messages" id="chatMessages"></div>
      <div class="composer-wrap">
        <div class="composer">
          <button class="composer-btn" id="btnAttach" aria-label="Attach">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <textarea class="composer-input" id="composerInput" placeholder="پیامت رو بنویس..." rows="1" data-i18n-placeholder="composer_placeholder"></textarea>
          <button class="composer-btn" id="btnVoice" aria-label="Voice">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
          </button>
          <button class="composer-btn send" id="btnSend" aria-label="Send" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- MODELS -->
    <section class="view models-view" id="viewModels">
      <div class="models-toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="modelSearch" placeholder="جستجوی مدل..." data-i18n-placeholder="search_models">
        </div>
        <button class="settings-btn" id="btnAddModel">+ <span data-i18n="add_model">افزودن</span></button>
      </div>
      <div class="models-list" id="modelsList"></div>
    </section>

    <!-- CANVAS -->
    <section class="view canvas-view" id="viewCanvas">
      <div class="canvas-toolbar" id="canvasToolbar">
        <button class="canvas-new" id="btnNewCanvas" title="New">+</button>
      </div>
      <div class="canvas-body">
        <div class="canvas-editor-wrap">
          <div class="canvas-versions">
            <button class="version-btn" id="btnUndo">↶</button>
            <button class="version-btn" id="btnRedo">↷</button>
            <button class="version-btn" id="btnVersions">📜</button>
          </div>
          <textarea class="canvas-editor" id="canvasEditor" placeholder="شروع به نوشتن کن..."></textarea>
        </div>
        <div class="canvas-preview-wrap" id="canvasPreviewWrap">
          <div class="canvas-preview-toolbar">
            <button class="canvas-tab" id="btnRunPreview">▶ <span data-i18n="run">اجرا</span></button>
            <button class="canvas-tab" id="btnRefreshPreview">⟳</button>
            <button class="canvas-tab" id="btnExportHtml">⬇ <span data-i18n="export">خروجی</span></button>
            <button class="canvas-tab" id="btnOpenPreview">↗</button>
            <button class="canvas-tab active" id="btnPreviewMode">👁 Preview</button>
          </div>
          <iframe class="canvas-preview-frame" id="canvasPreviewFrame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
        </div>
      </div>
      <div class="canvas-selection-toolbar" id="selectionToolbar"></div>
    </section>

    <!-- FILES -->
    <section class="view files-view" id="viewFiles">
      <div class="models-toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="fileSearch" placeholder="جستجو..." data-i18n-placeholder="search">
        </div>
        <button class="settings-btn" id="btnImportFile">+ <span data-i18n="import">وارد کردن</span></button>
      </div>
      <div class="files-list" id="filesList"></div>
    </section>

    <!-- SETTINGS -->
    <section class="view settings-view" id="viewSettings">
      <div class="settings-list" id="settingsList"></div>
    </section>
  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item active" data-view="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span data-i18n="nav_home">خانه</span>
    </button>
    <button class="nav-item" data-view="chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span data-i18n="nav_chat">چت</span>
    </button>
    <button class="nav-item" data-view="models">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/><path d="M12 6v6l4 2"/></svg>
      <span data-i18n="nav_models">مدل‌ها</span>
    </button>
    <button class="nav-item" data-view="canvas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
      <span>Canvas</span>

const debounce = (fn, ms = 300) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============ TOAST ============ */
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  $('#toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

/* ============ I18N APPLY ============ */
function applyI18n() {
  document.documentElement.lang = State.lang;
  document.documentElement.dir = State.lang === 'fa' ? 'rtl' : 'ltr';
  $$('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (I18N[State.lang]?.[key]) el.textContent = I18N[State.lang][key];
  });
  $$('[data-i18n-placeholder]').forEach(el => {
    const key = el.dataset.i18nPlaceholder;
    if (I18N[State.lang]?.[key]) el.placeholder = I18N[State.lang][key];
  });
  $('#langLabel').textContent = State.lang === 'fa' ? 'EN' : 'FA';
}

  document.documentElement.dataset.theme = State.theme;

/* ============ VIEW NAVIGATION ============ */
function setView(view) {
  State.currentView = view;
  $$('.view').forEach(v => v.classList.remove('active'));
  const target = $(`#view${view.charAt(0).toUpperCase() + view.slice(1)}`);
  if (target) target.classList.add('active');

  $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === view));

  const titles = {
    home: 'NONO AI',
    chat: t('nav_chat'),
    models: t('nav_models'),
    canvas: 'Canvas',
    files: t('qa_files'),
    settings: t('nav_settings')
  };
  $('#headerTitle').textContent = titles[view] || 'NONO AI';
  $('#btnBack').style.display = view === 'home' ? 'none' : 'inline-flex';

  if (view === 'models') renderModels();
  if (view === 'settings') renderSettings();
  if (view === 'files') renderFiles();
}

/* ============ PROVIDER CHIPS ============ */
function renderProviderChips() {
  const wrap = $('#providerChips');
  wrap.innerHTML = '';
  Object.values(PROVIDERS).forEach(p => {
    if (p.id === 'custom') return;
    const chip = document.createElement('button');
    chip.className = 'provider-chip';
    chip.innerHTML = `<span class="dot"></span><span>${p.icon} ${p.name}</span>`;
    chip.onclick = () => {
      const model = State.models.find(m => m.provider === p.id && m.enabled);
      if (model) {
        State.currentModel = model.id;
        setView('chat');
        toast(`${p.name} ✓`);
        Storage.save();
      }
    };
    wrap.appendChild(chip);
  });
}

function renderModels(filter = '') {
  const list = $('#modelsList');
  list.innerHTML = '';
  const q = filter.trim().toLowerCase();

  const filtered = State.models.filter(m => {
    if (!q) return true;
    return m.name.toLowerCase().includes(q) ||
           m.modelId.toLowerCase().includes(q) ||
           (m.capabilities || []).some(c => c.toLowerCase().includes(q)) ||
           (PROVIDERS[m.provider]?.name || '').toLowerCase().includes(q);
  });

  const byProvider = {};
  filtered.forEach(m => {
    const p = m.provider;
    if (!byProvider[p]) byProvider[p] = [];
    byProvider[p].push(m);
  });

  Object.keys(byProvider).sort().forEach(pKey => {
    const p = PROVIDERS[pKey] || { name: pKey, icon: '⚙️' };
    const group = document.createElement('div');
    group.className = 'provider-group';
    group.innerHTML = `
      <div class="provider-group-header">
        <span>${p.icon} ${p.name}</span>
        <span class="provider-group-count">${byProvider[pKey].length}</span>
      </div>
    `;
    byProvider[pKey].sort((a,b) => a.priority - b.priority).forEach(m => {
      const card = document.createElement('div');
      card.className = 'model-card' + (State.currentModel === m.id ? ' selected' : '');
      card.innerHTML = `
        <div class="model-icon">${p.icon}</div>
        <div class="model-info">
          <div class="model-name">${escapeHtml(m.name)}</div>
          <div class="model-meta">
            <span>${escapeHtml(m.modelId)}</span>
          </div>
          <div class="model-badges">
            ${(m.capabilities || []).map(c => `<span class="badge">${c}</span>`).join('')}
            <span class="badge accent">ctx ${(m.contextWindow/1000).toFixed(0)}k</span>
          </div>
        </div>
        <div class="model-toggle ${m.enabled ? 'on' : ''}" data-id="${m.id}"></div>
      `;
      card.onclick = (e) => {
        if (e.target.closest('.model-toggle')) {
          m.enabled = !m.enabled;
          Storage.save();
          renderModels($('#modelSearch').value);
          return;
        }
        State.currentModel = m.id;
        Storage.save();
        renderModels($('#modelSearch').value);
        toast(`${m.name} ✓`);
      };
      group.appendChild(card);
    });
    list.appendChild(group);
  });

  if (filtered.length === 0) {
    list.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-2)">No models found</div>`;
  }
}

/* ============ CHAT ============ */
function ensureConversation() {
  if (!State.currentConversation) {
    const conv = {
      id: uid(),
      title: 'New Chat',
      messages: [],
      createdAt: Date.now()
    };
    State.conversations.push(conv);
    State.currentConversation = conv.id;
    Storage.save();
  }
  return State.conversations.find(c => c.id === State.currentConversation);
}

function renderChat() {
  const conv = ensureConversation();
  const wrap = $('#chatMessages');
  wrap.innerHTML = '';

  if (conv.messages.length === 0) {
    wrap.innerHTML = `
      <div style="margin:auto;text-align:center;color:var(--text-2);padding:40px">
        <div style="font-size:40px;margin-bottom:12px">💬</div>
        <div>${t('greeting')}</div>
        <div style="font-size:13px;margin-top:8px">${t('home_subtitle')}</div>
      </div>
    `;
    return;
  }

  conv.messages.forEach((msg, idx) => {
    const el = document.createElement('div');
    el.className = `msg ${msg.role}`;
    el.dataset.idx = idx;

    const isLong = State.autoCollapse && msg.content && msg.content.length > CHAT_DISPLAY_CONFIG.collapseAfterCharacters;
    const content = isLong ? msg.content.slice(0, CHAT_DISPLAY_CONFIG.previewCharacters) + '...' : msg.content;

    el.innerHTML = `
      <div class="msg-avatar">${msg.role === 'user' ? '👤' : '✨'}</div>
      <div style="flex:1;min-width:0">
        <div class="msg-bubble ${isLong ? 'collapsed' : ''}">
          <div class="msg-content">${formatMessage(content)}</div>
          ${isLong ? `<button class="msg-expand" data-action="expand">${t('show_more')}</button>` : ''}
        </div>
        ${msg.role === 'ai' ? `
          <div class="msg-meta">
            ${msg.provider ? `<span class="provider-tag">${escapeHtml(msg.provider)}</span>` : ''}
            ${msg.model ? `<span>${escapeHtml(msg.model)}</span>` : ''}
          </div>
          <div class="msg-actions">
            <button class="msg-action" data-act="copy">${t('copy')}</button>
            <button class="msg-action" data-act="regen">${t('regenerate')}</button>
            <button class="msg-action" data-act="to-canvas">→ Canvas</button>
          </div>
        ` : `
          <div class="msg-actions">
            <button class="msg-action" data-act="copy">${t('copy')}</button>
            <button class="msg-action" data-act="edit">${t('edit')}</button>
            <button class="msg-action" data-act="delete">${t('delete')}</button>
          </div>
        `}
      </div>
    `;

    el.querySelector('.msg-expand')?.addEventListener('click', (e) => {
      const bubble = e.target.closest('.msg-bubble');
      const contentEl = bubble.querySelector('.msg-content');
      const isCollapsed = bubble.classList.contains('collapsed');
      if (isCollapsed) {
        contentEl.innerHTML = formatMessage(msg.content);
        bubble.classList.remove('collapsed');
        e.target.textContent = t('show_less');
      } else {
        contentEl.innerHTML = formatMessage(msg.content.slice(0, CHAT_DISPLAY_CONFIG.previewCharacters) + '...');
        bubble.classList.add('collapsed');
        e.target.textContent = t('show_more');
      }
    });

    el.querySelectorAll('.msg-action').forEach(btn => {
      btn.onclick = () => handleMsgAction(btn.dataset.act, idx, msg);
    });

    wrap.appendChild(el);
  });

  wrap.scrollTop = wrap.scrollHeight;
}

function formatMessage(text) {
  if (!text) return '';
  let html = escapeHtml(text);
  // code blocks
  html = html.replace(/
