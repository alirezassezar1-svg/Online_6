<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROJECTVERSE Notebook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --surface: #121215;
            --surface-hover: #1a1a1f;
            --border: #27272a;
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent-blue: #3b82f6;
            --accent-violet: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.15);
            --radius: 16px;
            --font-en: 'Outfit', sans-serif;
            --font-fa: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-en);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease;
        }

        body[dir="rtl"] {
            font-family: var(--font-fa);
        }

        .glass-panel {
            background: rgba(18, 18, 21, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .glass-card {
            background: linear-gradient(145deg, #121215, #0e0e11);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .glass-card:hover, .glass-card.active {
            border-color: var(--accent-violet);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .glass-card.active {
            background: rgba(139, 92, 246, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-violet));
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: scale(1.02);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-secondary:hover {
            background: var(--surface-hover);
            border-color: var(--text-muted);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            text-decoration: none;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--surface-hover);
            color: var(--text);
        }

        input, textarea, select {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 16px;
            border-radius: 12px;
            width: 100%;
            outline: none;
            transition: border-color 0.3s;
            font-family: inherit;
            font-size: 14px;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--accent-violet);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        /* Mobile Responsive Layout */
        .layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .sidebar {
            display: none;
            width: 300px;
            border-right: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
            overflow-y: auto;
        }

        .main-editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
        }

        @media (min-width: 768px) {
            .layout {
                flex-direction: row;
            }
            .sidebar {
                display: flex;
                flex-direction: column;
                padding: 20px;
            }
            .main-editor {
                padding: 40px;
            }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface);
            border: 1px solid var(--accent-violet);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .tab-btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
        }
        .tab-btn.active {
            background: var(--surface-hover);
            color: var(--text);
            border-color: var(--border);
        }
    </style>
</head>
<body>

    <div class="toast" id="toast">Saved!</div>

    <div class="layout">
        <!-- Sidebar: List of Drafts -->
        <div class="sidebar">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-violet-600 flex items-center justify-center">
                    <i data-lucide="notebook-pen" class="text-white w-4 h-4"></i>
                </div>
                <h1 class="font-bold text-lg tracking-tight">Notebook</h1>
            </div>
            
            <button class="btn-primary w-full mb-6 text-sm" onclick="createNewDraft()">
                <i data-lucide="plus" class="w-4 h-4"></i>
                New Draft
            </button>

            <div class="flex-1 overflow-y-auto space-y-2 pr-1" id="drafts-list">
                <!-- Drafts will be rendered here -->
                <div class="text-center text-zinc-500 text-sm py-10">No drafts yet.</div>
            </div>

            <div class="pt-4 border-t border-zinc-800 space-y-2 mt-4">
                <button class="btn-secondary w-full text-sm" onclick="exportForProjectVerse()">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    Export for PROJECTVERSE
                </button>
                <div class="text-[10px] text-zinc-500 text-center mt-2 px-2">
                    Exports a JSON file containing all drafts, formatted for direct import into the main app.
                </div>
            </div>
        </div>

        <!-- Main Editor Area -->
        <div class="main-editor">
            <div id="empty-editor" class="flex-1 flex flex-col items-center justify-center text-zinc-500">
                <i data-lucide="file-text" class="w-16 h-16 mb-4 text-zinc-700"></i>
                <p>Select a draft or create a new one to start writing.</p>
            </div>

            <div id="editor-container" class="hidden flex-1 flex flex-col">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold truncate" id="editor-title">Draft Title</h2>
                    <button class="btn-secondary text-sm text-red-400 border-red-900/50 hover:bg-red-950/30" onclick="deleteCurrentDraft()">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> Delete
                    </button>
                </div>

                <!-- Mode Toggle -->
                <div class="flex gap-2 mb-6 bg-zinc-900 p-1 rounded-xl w-fit">
                    <button class="tab-btn active" onclick="switchEditorMode('wizard')" id="tab-wizard">Quick Wizard</button>
                    <button class="tab-btn" onclick="switchEditorMode('freewrite')" id="tab-freewrite">Free Write</button>
                </div>

                <!-- WIZARD MODE -->
                <div id="editor-wizard" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-zinc-400 mb-1">Project Name (EN)</label>
                            <input type="text" id="w-name" placeholder="e.g. Nono Nick" oninput="saveDraftData()">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-zinc-400 mb-1">Project Name (FA)</label>
                            <input type="text" id="w-nameFa" placeholder="مثلاً نونو نیک" oninput="saveDraftData()" dir="rtl">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-zinc-400 mb-1">Short Description (EN)</label>
                        <textarea id="w-desc" rows="2" placeholder="What does it do?" oninput="saveDraftData()"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-zinc-400 mb-1">Short Description (FA)</label>
                        <textarea id="w-descFa" rows="2" placeholder="توضیح کوتاه" oninput="saveDraftData()" dir="rtl"></textarea>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-zinc-400 mb-1">Live Demo URL</label>
                            <input type="url" id="w-liveUrl" placeholder="https://..." oninput="saveDraftData()">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-zinc-400 mb-1">Repo URL</label>
                            <input type="url" id="w-repoUrl" placeholder="https://github.com/..." oninput="saveDraftData()">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-zinc-400 mb-1">Tech Stack (comma separated)</label>
                        <input type="text" id="w-techStack" placeholder="React, Tailwind, Node.js" oninput="saveDraftData()">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-zinc-400 mb-1">Key Features (one per line)</label>
                        <textarea id="w-features" rows="3" placeholder="User auth&#10;Dark mode" oninput="saveDraftData()"></textarea>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-zinc-400 mb-1">Your Role</label>
                            <input type="text" id="w-role" placeholder="Frontend Developer" oninput="saveDraftData()">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-zinc-400 mb-1">Status</label>
                            <select id="w-status" onchange="saveDraftData()">
                                <option value="working">Working</option>
                                <option value="partial">Partially Working</option>
                                <option value="experimental">Experimental</option>
                                <option value="archived">Archived</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- FREE WRITE MODE -->
                <div id="editor-freewrite" class="hidden flex-1 flex flex-col">
                    <div class="text-xs text-zinc-400 mb-2">Write anything here. It won't be parsed automatically, but will be saved as a note in the export.</div>
                    <textarea id="w-freewrite" class="flex-1 w-full min-h-[300px] resize-y" placeholder="Paste README, raw notes, or ideas here..." oninput="saveDraftData()"></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State
        let drafts = [];
        let activeDraftId = null;
        let editorMode = 'wizard'; // 'wizard' or 'freewrite'

        // Init
        function init() {
            const saved = localStorage.getItem('projectverse_notebook_drafts');
            if (saved) {
                try { drafts = JSON.parse(saved); } catch(e) { drafts = []; }
            }
            renderSidebar();
            if (drafts.length > 0) {
                selectDraft(drafts[0].id);
            }
            lucide.createIcons();
        }

        // Persistence
        function saveToLocalStorage() {
            localStorage.setItem('projectverse_notebook_drafts', JSON.stringify(drafts));
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        // CRUD Operations
        function createNewDraft() {
            const newDraft = {
                id: crypto.randomUUID(),
                name: 'Untitled Project',
                nameFa: '',
                desc: '',
                descFa: '',
                techStack: '',
                features: '',
                role: '',
                liveUrl: '',
                repoUrl: '',
                status: 'working',
                freewrite: '',
                updatedAt: Date.now()
            };
            drafts.unshift(newDraft);
            saveToLocalStorage();
            renderSidebar();
            selectDraft(newDraft.id);
        }

        function deleteCurrentDraft() {
            if (!activeDraftId) return;
            if (!confirm('Are you sure you want to delete this draft?')) return;
            drafts = drafts.filter(d => d.id !== activeDraftId);
            saveToLocalStorage();
            activeDraftId = null;
            document.getElementById('editor-container').classList.add('hidden');
            document.getElementById('empty-editor').classList.remove('hidden');
            renderSidebar();
            showToast('Draft deleted');
        }

        function selectDraft(id) {
            activeDraftId = id;
            const draft = drafts.find(d => d.id === id);
            if (!draft) return;

            // Update Sidebar Active State
            document.querySelectorAll('.glass-card').forEach(el => {
                el.classList.toggle('active', el.dataset.id === id);
            });

            // Show Editor
            document.getElementById('empty-editor').classList.add('hidden');
            document.getElementById('editor-container').classList.remove('hidden');
            document.getElementById('editor-title').innerText = draft.name || 'Untitled';

            // Populate Fields
            document.getElementById('w-name').value = draft.name || '';
            document.getElementById('w-nameFa').value = draft.nameFa || '';
            document.getElementById('w-desc').value = draft.desc || '';
            document.getElementById('w-descFa').value = draft.descFa || '';
            document.getElementById('w-liveUrl').value = draft.liveUrl || '';
            document.getElementById('w-repoUrl').value = draft.repoUrl || '';
            document.getElementById('w-techStack').value = draft.techStack || '';
            document.getElementById('w-features').value = draft.features || '';
            document.getElementById('w-role').value = draft.role || '';
            document.getElementById('w-status').value = draft.status || 'working';
            document.getElementById('w-freewrite').value = draft.freewrite || '';

            // Set Mode
            switchEditorMode(editorMode);
        }

        function saveDraftData() {
            if (!activeDraftId) return;
            const draft = drafts.find(d => d.id === activeDraftId);
            if (!draft) return;

            draft.name = document.getElementById('w-name').value;
            draft.nameFa = document.getElementById('w-nameFa').value;
            draft.desc = document.getElementById('w-desc').value;
            draft.descFa = document.getElementById('w-descFa').value;
            draft.liveUrl = document.getElementById('w-liveUrl').value;
            draft.repoUrl = document.getElementById('w-repoUrl').value;
            draft.techStack = document.getElementById('w-techStack').value;
            draft.features = document.getElementById('w-features').value;
            draft.role = document.getElementById('w-role').value;
            draft.status = document.getElementById('w-status').value;
            draft.freewrite = document.getElementById('w-freewrite').value;
            draft.updatedAt = Date.now();

            saveToLocalStorage();
            
            // Update Title in real-time
            document.getElementById('editor-title').innerText = draft.name || 'Untitled';
            
            // Update Sidebar List item text
            const sidebarItem = document.querySelector(`.glass-card[data-id="${activeDraftId}"] h4`);
            if (sidebarItem) sidebarItem.innerText = draft.name || 'Untitled';
        }

        // UI Rendering
        function renderSidebar() {
            const container = document.getElementById('drafts-list');
            container.innerHTML = '';
            
            if (drafts.length === 0) {
                container.innerHTML = '<div class="text-center text-zinc-500 text-sm py-10">No drafts yet.</div>';
                return;
            }

            // Sort by latest updated
            const sorted = [...drafts].sort((a, b) => b.updatedAt - a.updatedAt);

            sorted.forEach(d => {
                const isActive = d.id === activeDraftId;
                container.innerHTML += `
                    <div class="glass-card p-3 ${isActive ? 'active' : ''}" data-id="${d.id}" onclick="selectDraft('${d.id}')">
                        <h4 class="font-medium text-sm truncate">${d.name || 'Untitled'}</h4>
                        <p class="text-[10px] text-zinc-500 mt-1">${new Date(d.updatedAt).toLocaleDateString()}</p>
                    </div>
                `;
            });
        }

        function switchEditorMode(mode) {
            editorMode = mode;
            document.getElementById('tab-wizard').classList.toggle('active', mode === 'wizard');
            document.getElementById('tab-freewrite').classList.toggle('active', mode === 'freewrite');
            document.getElementById('editor-wizard').classList.toggle('hidden', mode !== 'wizard');
            document.getElementById('editor-freewrite').classList.toggle('hidden', mode !== 'freewrite');
        }

        // EXPORT ENGINE (The Magic Bridge)
        function exportForProjectVerse() {
            if (drafts.length === 0) {
                alert('No drafts to export.');
                return;
            }

            // Map notebook drafts to PROJECTVERSE import schema
            const exportData = drafts.map(d => ({
                id: d.id, // Keep the same ID for deduplication logic
                name: d.name || 'Untitled Project',
                nameFa: d.nameFa || '',
                desc: d.desc || '',
                descFa: d.descFa || '',
                techStack: d.techStack || '',
                features: d.features || '',
                role: d.role || '',
                liveUrl: d.liveUrl || '',
                repoUrl: d.repoUrl || '',
                status: d.status || 'working',
                // Default values for fields not in the quick wizard
                type: 'website',
                platform: 'github-pages',
                aiUsed: 'no',
                audience: '',
                isPublic: true,
                isConfidential: false,
                verifiedTech: [],
                createdAt: Date.now(),
                updatedAt: d.updatedAt,
                // Include freewrite as a note if present
                notes: d.freewrite || ''
            }));

            const dataStr = JSON.stringify(exportData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `projectverse_notebook_export_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast('Export completed! Import this file into PROJECTVERSE.');
        }

        window.onload = init;
    </script>
</body>
</html>
