    });
    items.push({
      group: 'Settings', title: 'Toggle reduced motion', subtitle: 'Performance → reduced motion',
      icon: 'zap', keywords: ['reduced motion', 'accessibility'],
      run: () => { Actions['toggle-setting'](null, { dataset: { setting: 'performance.reducedMotion' } }); }
    });

    return items;
  }

  function open(initialQuery = '') {
    if (overlay) return;
    overlay = document.createElement('div');
    overlay.className = 'palette-wrap';
    overlay.innerHTML = `
      <div class="palette" role="dialog" aria-modal="true" aria-label="Search">
        <div class="palette-input-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input class="palette-input" id="palette-input" type="text"
                 placeholder="Search projects, pages, elements, commands…"
                 autocomplete="off" spellcheck="false" aria-label="Search query" />
          <span class="palette-key">ESC</span>
        </div>
        <div class="palette-results" id="palette-results"></div>
        <div class="palette-foot">
          <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
          <span><kbd>↵</kbd> open</span>
          <span><kbd>ESC</kbd> close</span>
        </div>
      </div>`;

    overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(); });
    root.appendChild(overlay);

    const input = overlay.querySelector('#palette-input');
    input.value = initialQuery;
    input.addEventListener('input', Utils.debounce(() => { currentQuery = input.value; render(); }, 90));
    input.addEventListener('keydown', onKeyDown);

    currentQuery = initialQuery;
    render();
    setTimeout(() => input.focus(), 40);
  }

  function close() {
    if (!overlay) return;
    overlay.remove();
    overlay = null;
    results = [];
    activeIndex = 0;
  }

  async function render() {
    const box = overlay?.querySelector('#palette-results');
    if (!box) return;

    const all = buildIndex();
    const ranked = await SearchService.query(all, currentQuery);

    // Recent searches shown when the query is empty
    if (!currentQuery.trim()) {
      const recent = Store.get().search.recent || [];
      if (recent.length) {
        const recentItems = recent
          .map((r) => all.find((i) => i.title === r))
          .filter(Boolean);
        results = [...recentItems, ...ranked.filter((r) => !recentItems.includes(r))].slice(0, 14);
      } else {
        results = ranked.slice(0, 14);
      }
    } else {
      results = ranked.slice(0, 20);
    }

    activeIndex = 0;

    if (!results.length) {
      box.innerHTML = `
        <div class="palette-empty">
          <div style="margin-bottom:10px;opacity:.5">
            <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor"
                 stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </div>
          No matches for “${Utils.esc(currentQuery)}”
        </div>`;
      return;
    }

    // Group results
    const groups = new Map();
    results.forEach((r) => {
      if (!groups.has(r.group)) groups.set(r.group, []);
      groups.get(r.group).push(r);
    });

    let html = '';
    let flatIndex = 0;
    groups.forEach((items, groupName) => {
      html += `<div class="palette-group-label">${Utils.esc(groupName)}</div>`;
      items.forEach((item) => {
        const i = flatIndex++;
        html += `
          <button class="palette-item${i === activeIndex ? ' active' : ''}" data-index="${i}">
            <span class="palette-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[item.icon] || ICON_PATHS.file}</svg>
            </span>
            <span class="palette-text">
              <span class="palette-title">${highlight(item.title, currentQuery)}</span>
              <span class="palette-sub">${Utils.esc(item.subtitle || '')}</span>
            </span>
          </button>`;
      });
    });

    box.innerHTML = html;

    box.querySelectorAll('.palette-item').forEach((btn) => {
      btn.addEventListener('click', () => runIndex(Number(btn.dataset.index)));
      btn.addEventListener('mousemove', () => {
        const idx = Number(btn.dataset.index);
        if (idx === activeIndex) return;
        activeIndex = idx;
        box.querySelectorAll('.palette-item').forEach((b) =>
          b.classList.toggle('active', Number(b.dataset.index) === activeIndex));
      });
    });
  }

  function highlight(text, query) {
    const safe = Utils.esc(text);
    const q = String(query || '').trim();
    if (!q) return safe;
    const terms = q.split(/\s+/).filter(Boolean).map(escapeRegExp);
    if (!terms.length) return safe;
    return safe.replace(new RegExp(`(${terms.join('|')})`, 'gi'), '<mark>$1</mark>');
  }

  function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function onKeyDown(e) {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIndex = Math.min(results.length - 1, activeIndex + 1);
      syncActive();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIndex = Math.max(0, activeIndex - 1);
      syncActive();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      runIndex(activeIndex);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      close();
    }
  }

  function syncActive() {
    const box = overlay?.querySelector('#palette-results');
    if (!box) return;
    box.querySelectorAll('.palette-item').forEach((b) =>
      b.classList.toggle('active', Number(b.dataset.index) === activeIndex));
    box.querySelector('.palette-item.active')?.scrollIntoView({ block: 'nearest' });
  }

  function runIndex(i) {
    const item = results[i];
    if (!item) return;
    if (currentQuery.trim()) {
      const recent = [currentQuery, ...(Store.get().search.recent || []).filter((r) => r !== currentQuery)].slice(0, 5);
      Store.patch('search', { recent });
      Storage.set('search', Store.get().search);
    }
    close();
    try { item.run(); }
    catch (err) { Notify.error('Action failed', err.message || 'Something went wrong.'); }
  }

  return { open, close, isOpen: () => Boolean(overlay) };
})();

/** Returns the layout for an element at a given breakpoint. */
function getLayout(el, device) {
  const base = el.layout.desktop;
  if (device === 'desktop') return base;
  if (el.layout[device]) return el.layout[device];

  // Auto-derive a sensible layout for smaller breakpoints (not persisted
  // until the user actually edits it).
  const ratio = DEVICE_WIDTHS[device] / DEVICE_WIDTHS.desktop;
  const pad = device === 'mobile' ? 20 : 40;
  const maxW = DEVICE_WIDTHS[device] - pad * 2;
  const x = Math.round(Math.min(base.x * ratio, DEVICE_WIDTHS[device] - pad - 40));
  const w = Math.round(Math.min(Math.max(base.w * ratio, 120), maxW));
  return { x: Math.max(pad * 0.5, x), y: base.y, w, h: base.h };
}

/** Persist a layout value for the active breakpoint (creating an override). */
function setLayoutValue(el, device, key, value) {
  if (device === 'desktop') {
    el.layout.desktop[key] = value;
  } else {
    if (!el.layout[device]) el.layout[device] = Object.assign({}, getLayout(el, device));
    el.layout[device][key] = value;
  }
}

/** Serialize an element's computed style into an inline CSS string. */
function elementStyleString(el, layout) {
  const s = el.style || {};
  const parts = [
    `left:${layout.x}px`,
    `top:${layout.y}px`,
    `width:${layout.w}px`,
    `height:${layout.h}px`,
    `z-index:${el.z || 1}`,
    `opacity:${el.visible === false ? 0.25 : (s.opacity == null ? 1 : s.opacity)}`,
    `color:${s.color || '#e9edf7'}`,
    `background:${s.bg || 'transparent'}`,
    `border-radius:${s.radius || 0}px`,
    `padding:${s.padding || 0}px`,
    `font-size:${s.fontSize || 16}px`,
    `font-weight:${s.fontWeight || 400}`,
    `font-family:${s.fontFamily === 'inherit' || !s.fontFamily ? 'inherit' : s.fontFamily}`,
    `line-height:${s.lineHeight || 1.5}`,
    `letter-spacing:${s.letterSpacing || 0}px`,
    `text-align:${s.align || 'left'}`,
    `box-shadow:${SHADOWS[s.shadow] || s.shadow || 'none'}`,
    `border:${s.borderWidth || 0}px solid ${s.borderColor || 'transparent'}`,
    `display:flex`,
    `flex-direction:column`,
    `justify-content:${s.vAlign || 'flex-start'}`,
    `overflow:hidden`
  ];
  return parts.join(';');
}

/** Build the inner markup for an element based on its type. */
function elementInnerHTML(el) {
  const p = el.props || {};
  const s = el.style || {};

  switch (el.type) {
    case 'image': {
      const src = p.src || buildGradientDataURI(el.id);
      return `<img class="el-img" src="${Utils.esc(src)}" alt="${Utils.esc(p.alt || el.name)}" draggable="false" />`;
    }
    case 'divider':
      return `<div class="el-divider"></div>`;
    case 'button':
      return `<div class="el-inner" style="align-items:center;justify-content:center">
        <span class="el-btn" style="background:${s.bg && s.bg !== 'transparent' ? s.bg : 'linear-gradient(135deg,#2f8bff,#7c5cf6)'};color:${s.color || '#fff'}">${Utils.esc(p.text || 'Button')}</span>
      </div>`;
    case 'card':
      return `<div class="el-inner" style="flex-direction:column;gap:8px;justify-content:center">
        ${p.title ? `<div style="font-weight:650;font-size:${Math.max(15, (s.fontSize || 16))}px;line-height:1.3">${Utils.esc(p.title)}</div>` : ''}
        ${p.text ? `<div style="font-size:13.5px;opacity:.72;line-height:1.55;font-weight:400">${Utils.esc(p.text)}</div>` : ''}
      </div>`;
    case 'badge':
      return `<div class="el-inner" style="align-items:center;justify-content:center">
        <span style="display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;
          background:${s.bg && s.bg !== 'transparent' ? s.bg : 'rgba(77,163,255,.14)'};
          color:${s.color || '#9ecbff'};font-weight:600;font-size:${s.fontSize || 12}px;white-space:nowrap">
          ${Utils.esc(p.text || 'Badge')}</span>
      </div>`;
    case 'spacer':
      return '';
    case 'heading':
    case 'text':
    default:
      return `<div class="el-inner">
        <div class="el-text">${Utils.esc(p.text || '')}</div>
      </div>`;
  }
}

/** Create a brand-new element of a given type, positioned in the viewport. */
function createElementOfType(type, x = 80, y = 80) {
  const base = {
    id: Utils.uid('el'),
    type,
    name: ELEMENT_TYPES[type] || 'Element',
    layout: { desktop: { x, y, w: 320, h: 80 } },
    props: {},
    style: Object.assign({}, DEFAULT_STYLE),
    motion: { type: 'none', duration: 500, delay: 0 },
    z: 100,
    visible: true,
    locked: false
  };

  switch (type) {
    case 'heading':
      base.props = { text: 'A clear, confident headline' };
      base.style = Object.assign(base.style, {
        fontSize: 40, fontWeight: 750, color: '#ffffff', lineHeight: 1.15, letterSpacing: -1
      });
      base.layout.desktop = { x, y, w: 640, h: 60 };
      break;
    case 'text':
      base.props = { text: 'Supporting copy that explains the value in one or two sentences.' };
      base.style = Object.assign(base.style, { fontSize: 16, color: 'rgba(233,237,247,.7)', lineHeight: 1.6 });
      base.layout.desktop = { x, y, w: 520, h: 60 };
      break;
    case 'button':
      base.props = { text: 'Get started' };
      base.style = Object.assign(base.style, { fontSize: 15, fontWeight: 650, align: 'center' });
      base.layout.desktop = { x, y, w: 176, h: 48 };
      break;
    case 'image':
      base.props = { src: buildGradientDataURI('new-image-' + Date.now()), alt: 'Placeholder visual' };
      base.style = Object.assign(base.style, { radius: 18, shadow: 'deep' });
      base.layout.desktop = { x, y, w: 420, h: 280 };
      break;
    case 'card':
      base.props = { title: 'Card title', text: 'A short supporting sentence for this card.' };
      base.style = Object.assign(base.style, {
        bg: 'rgba(255,255,255,.045)', radius: 18, padding: 22,
        borderWidth: 1, borderColor: 'rgba(255,255,255,.09)', shadow: 'soft'
      });
      base.layout.desktop = { x, y, w: 340, h: 160 };
      break;
    case 'badge':
      base.props = { text: 'New' };
      base.style = Object.assign(base.style, {
        bg: 'rgba(77,163,255,.14)', color: '#9ecbff', fontSize: 12, fontWeight: 700, radius: 999
      });
      base.layout.desktop = { x, y, w: 84, h: 30 };
      break;
    case 'divider':
      base.style = Object.assign(base.style, {});
      base.layout.desktop = { x, y, w: 520, h: 1 };
      break;
    case 'spacer':
      base.layout.desktop = { x, y, w: 320, h: 40 };
      break;
    default:
      break;
  }

  return base;
}

/* ---------- 14a. SHELL RENDER (sidebar, status bar, nav counts) ---------- */
function renderShell() {
  const s = Store.get();

  // Nav counts
  const elCount = s.projects.reduce((acc, p) =>
    acc + p.pages.reduce((a, pg) => a + pg.elements.length, 0), 0);
  const navEl = document.getElementById('nav-el-count');
  const navAct = document.getElementById('nav-activity-count');
  if (navEl) navEl.textContent = String(elCount);
  if (navAct) navAct.textContent = String(s.activity.length);

  // Active nav item
  document.querySelectorAll('.nav-item[data-view]').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.view === s.activeView);
  });

  // Sidebar project list
  const list = document.getElementById('sidebar-projects');
  if (list) {
    list.innerHTML = s.projects.map((p) => `
      <button class="proj-mini${p.id === s.activeProjectId ? ' active' : ''}" data-action="open-project" data-id="${p.id}">
        <span class="proj-swatch" style="background:linear-gradient(135deg,${p.accent},${p.accent}55)"></span>
        <span>${Utils.esc(p.name)}</span>
      </button>`).join('');
  }

  // Status bar
  const project = getActiveProject();
  const page = getActivePage();
  const statusProject = document.getElementById('status-project');
  const statusElements = document.getElementById('status-elements');
  const statusApi = document.getElementById('status-api');
  const saveStatus = document.getElementById('save-status');
  const saveDot = document.getElementById('save-dot');

  if (statusProject) statusProject.textContent = project ? `${project.name} · ${page ? page.name : '—'}` : 'No project';
  if (statusElements) statusElements.textContent = page ? `${page.elements.length} elements` : '0 elements';
  if (statusApi) statusApi.textContent = AIService.isLive() ? `Live · ${API_CONFIG.provider}` : 'Mock services';

  if (saveStatus && saveDot) {
    const st = s.ui.saveState;
    if (st === 'saving') { saveStatus.textContent = 'Saving…'; saveDot.className = 'status-dot saving'; }
    else if (st === 'saved') { saveStatus.textContent = 'Saved ' + Utils.relTime(s.ui.lastSavedAt || Date.now()); saveDot.className = 'status-dot'; }
    else { saveStatus.textContent = 'Ready'; saveDot.className = 'status-dot'; }
  }

  // Mode badge
  const badge = document.getElementById('mode-badge');
  if (badge) {
    if (AIService.isLive()) {
      badge.className = 'badge live';
      badge.innerHTML = '<span class="dot"></span> Live API';
    } else {
      badge.className = 'badge demo';
      badge.innerHTML = '<span class="dot"></span> Demo Mode';
    }
  }

  // Mobile sidebar state
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebar-backdrop');
  if (sidebar) sidebar.classList.toggle('open', s.editor.sidebarOpen);
  if (backdrop) backdrop.classList.toggle('show', s.editor.sidebarOpen);
}

function elementHTML(el, device, s) {
  const layout = getLayout(el, device);
  const classes = ['canvas-el'];
  if (el.id === s.selectedElementId) classes.push('selected');
  if (el.visible === false) classes.push('hidden-el');
  if (el.locked) classes.push('locked-el');

  const motionAttr = el.motion && el.motion.type !== 'none'
    ? `data-motion="${el.motion.type}" data-motion-dur="${el.motion.duration}"`
    : '';

  return `<div class="${classes.join(' ')}"
               data-el-id="${el.id}"
               style="${elementStyleString(el, layout)}"
               ${motionAttr}
               role="img"
               aria-label="${Utils.esc(el.name)}">${elementInnerHTML(el)}</div>`;
}

function setView(viewName) {
  const s = Store.get();
  if (s.activeView === viewName) {
    renderCurrentView();
    return;
  }

  document.querySelectorAll('.view').forEach((v) => {
    v.classList.toggle('active', v.dataset.view === viewName);
  });
  Store.patch('activeView', viewName);
  renderCurrentView();
  renderShell();
}

function renderCurrentView() {
  const view = Store.get().activeView;
  if (view === 'dashboard') renderDashboard();
  else if (view === 'editor') renderEditor();
  else if (view === 'activity') renderActivity();
  else if (view === 'settings') renderSettings();
}

/* ==========================================================================
 * 15. EDITOR INTERACTIONS (drag, resize, inline edit)
 * ========================================================================== */
const EditorInteraction = (() => {
  let drag = null;

  function getCanvas() { return document.getElementById('canvas'); }
  function getViewport() { return document.getElementById('canvas-viewport'); }

  /** Compute effective scale of the canvas (zoom × viewport fit). */
  function currentScale() {
    return Store.get().editor.zoom || 1;
  }

  function onPointerDown(e) {
    const s = Store.get();
    if (s.editor.previewMode) return;
    if (s.activeView !== 'editor') return;

    const canvas = getCanvas();
    if (!canvas) return;

    const handleEl = e.target.closest('[data-handle]');
    const elNode = e.target.closest('[data-el-id]');

    // Clicking empty canvas deselects
    if (!elNode) {
      if (!e.target.closest('.float-bar')) {
        selectElement(null);
      }
      return;
    }

    const elId = elNode.dataset.elId;
    const page = getActivePage();
    if (!page) return;
    const el = page.elements.find((x) => x.id === elId);
    if (!el) return;

    selectElement(elId);

    if (el.locked && !handleEl) return;

    const device = s.editor.device;
    const layout = getLayout(el, device);
    const scale = currentScale();

    drag = {
      id: elId,
      mode: handleEl ? 'resize' : 'move',
      dir: handleEl ? handleEl.dataset.handle : null,
      startX: e.clientX,
      startY: e.clientY,
      origin: Object.assign({}, layout),
      scale,
      moved: false,
      node: elNode
    };

    elNode.setPointerCapture?.(e.pointerId);
    e.preventDefault();

    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
  }

  function onPointerMove(e) {
    if (!drag) return;
    const s = Store.get();
    const dx = (e.clientX - drag.startX) / drag.scale;
    const dy = (e.clientY - drag.startY) / drag.scale;

    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) drag.moved = true;

    const snapOn = s.settings.editor.snapping && !e.altKey;
    const grid = s.settings.editor.gridSize || GRID_SIZE;
    const snap = (v) => (snapOn ? Math.round(v / grid) * grid : Math.round(v));

    let next = Object.assign({}, drag.origin);

    if (drag.mode === 'move') {
      next.x = snap(drag.origin.x + dx);
      next.y = snap(drag.origin.y + dy);
    } else {
      const dir = drag.dir;
      let { x, y, w, h } = drag.origin;
      const MIN = 20;

      if (dir.includes('e')) { w = Math.max(MIN, snap(drag.origin.w + dx)); }
      if (dir.includes('s')) { h = Math.max(4, snap(drag.origin.h + dy)); }
      if (dir.includes('w')) {
        const nx = snap(drag.origin.x + dx);
        const nw = Math.max(MIN, drag.origin.w - (nx - drag.origin.x));
        x = drag.origin.x + (drag.origin.w - nw);
        w = nw;
      }
      if (dir.includes('n')) {
        const ny = snap(drag.origin.y + dy);
        const nh = Math.max(4, drag.origin.h - (ny - drag.origin.y));
        y = drag.origin.y + (drag.origin.h - nh);
        h = nh;
      }
      next = { x, y, w, h };
    }

    // Live DOM update (no state churn during the drag)
    drag.node.style.left = next.x + 'px';
    drag.node.style.top = next.y + 'px';
    drag.node.style.width = next.w + 'px';
    drag.node.style.height = next.h + 'px';
    drag.live = next;

    updateFloatingBar(next);
  }

  function onPointerUp() {
    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', onPointerUp);
    window.removeEventListener('pointercancel', onPointerUp);

    if (!drag) return;
    const finished = drag;
    drag = null;

    if (!finished.moved || !finished.live) return;

    const page = getActivePage();
    if (!page) return;
    const el = page.elements.find((x) => x.id === finished.id);
    if (!el) return;

    const device = Store.get().editor.device;
    ['x', 'y', 'w', 'h'].forEach((k) => {
      setLayoutValue(el, device, k, Math.round(finished.live[k]));
    });

    commitHistory('Move element');
    scheduleAutosave();
    renderInspector();
    renderShell();
  }

  /** Inline text editing on double-click. */
  function onDoubleClick(e) {
    const s = Store.get();
    if (s.editor.previewMode) return;
    const elNode = e.target.closest('[data-el-id]');
    if (!elNode) return;

    const page = getActivePage();
    if (!page) return;
    const el = page.elements.find((x) => x.id === elNode.dataset.elId);
    if (!el) return;
    if (el.locked) { Notify.warning('Element is locked', 'Unlock it from the Content tab to edit.'); return; }
    if (!['heading', 'text', 'button', 'badge', 'card'].includes(el.type)) return;

    const target = elNode.querySelector('.el-text')
      || elNode.querySelector('.el-btn')
      || elNode.querySelector('.el-inner > div:first-child');
    if (!target) return;

    target.setAttribute('contenteditable', 'true');
    target.style.outline = '2px solid rgba(77,163,255,.7)';
    target.style.outlineOffset = '4px';
    target.style.cursor = 'text';
    target.focus();

    // Select all content
    try {
      const range = document.createRange();
      range.selectNodeContents(target);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    } catch (err) { /* noop */ }

    const finish = () => {
      target.removeAttribute('contenteditable');
      target.style.outline = '';
      target.style.outlineOffset = '';
      target.style.cursor = '';

      const newText = target.textContent.trim();
      const field = el.type === 'card' ? 'title' : 'text';
      if (newText !== (el.props[field] || '')) {
        el.props[field] = newText;
        commitHistory('Edit text');
        scheduleAutosave();
        renderInspector();
      }
      target.removeEventListener('blur', finish);
      target.removeEventListener('keydown', onKey);
    };

    const onKey = (ev) => {
      if (ev.key === 'Escape') { ev.preventDefault(); target.blur(); }
      if (ev.key === 'Enter' && (el.type === 'button' || el.type === 'badge')) {
        ev.preventDefault(); target.blur();
      }
    };

    target.addEventListener('blur', finish);
    target.addEventListener('keydown', onKey);
  }

  function attach() {
    const viewport = getViewport();
    if (viewport && !viewport.dataset.bound) {
      viewport.dataset.bound = '1';
      viewport.addEventListener('pointerdown', onPointerDown);
      viewport.addEventListener('dblclick', onDoubleClick);
    }
  }

  return { attach, currentScale };
})();

/* ---------- Floating contextual toolbar ---------- */
function updateFloatingBar(liveLayout) {
  const canvas = document.getElementById('canvas');
  if (!canvas) return;

  // Remove any existing bar
  canvas.querySelector('.float-bar')?.remove();
  canvas.querySelectorAll('.handle').forEach((h) => h.remove());

  const s = Store.get();
  if (s.editor.previewMode) return;

  const el = getSelectedElement();
  if (!el) return;

  const node = canvas.querySelector(`[data-el-id="${el.id}"]`);
  if (!node) return;

  const layout = liveLayout || getLayout(el, s.editor.device);

  // Selection handles
  ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'].forEach((dir) => {
    const h = document.createElement('div');
    h.className = 'handle';
    h.dataset.handle = dir;
    h.setAttribute('aria-hidden', 'true');
    node.appendChild(h);
  });

  // Floating toolbar
  const bar = document.createElement('div');
  bar.className = 'float-bar';
  bar.style.left = (layout.x + layout.w / 2) + 'px';
  bar.style.top = Math.max(0, layout.y - 12) + 'px';
  bar.innerHTML = `
    <span class="float-tag">${Utils.esc(el.name)}</span>
    <div class="fb-sep"></div>
    <button data-fb="duplicate" title="Duplicate" aria-label="Duplicate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS.copy}</svg>
    </button>
    <button data-fb="front" title="Bring to front" aria-label="Bring to front">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS.bringFwd}</svg>
    </button>
    <button data-fb="back" title="Send to back" aria-label="Send to back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS.sendBack}</svg>
    </button>
    <button data-fb="visible" title="Toggle visibility" aria-label="Toggle visibility">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${el.visible === false ? ICON_PATHS.eyeOff : ICON_PATHS.eye}</svg>
    </button>
    <button data-fb="lock" title="Toggle lock" aria-label="Toggle lock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${el.locked ? ICON_PATHS.lock : ICON_PATHS.unlock}</svg>
    </button>
    <div class="fb-sep"></div>
    <button data-fb="delete" class="danger" title="Delete" aria-label="Delete">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS.trash}</svg>
    </button>`;

  bar.addEventListener('pointerdown', (e) => e.stopPropagation());
  bar.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-fb]');
    if (!btn) return;
    e.stopPropagation();
    const action = btn.dataset.fb;
    if (action === 'duplicate') Actions['duplicate-element']();
    else if (action === 'front') Actions['z-order'](null, { dataset: { mode: 'front' } });
    else if (action === 'back') Actions['z-order'](null, { dataset: { mode: 'back' } });
    else if (action === 'visible') toggleVisibility();
    else if (action === 'lock') toggleLock();
    else if (action === 'delete') Actions['delete-element']();
  });

  canvas.appendChild(bar);
}

function toggleVisibility() {
  const el = getSelectedElement();
  if (!el) return;
  el.visible = el.visible === false;
  commitHistory('Toggle visibility');
  scheduleAutosave();
  rerenderCanvas();
  renderInspector();
}

function toggleLock() {
  const el = getSelectedElement();
  if (!el) return;
  el.locked = !el.locked;
  commitHistory('Toggle lock');
  scheduleAutosave();
  rerenderCanvas();
  renderInspector();
}

/* ==========================================================================
 * 16. ACTIONS
 * ========================================================================== */
let autosaveTimer = null;

function scheduleAutosave() {
  const s = Store.get();
  if (!s.settings.editor.autosave) return;
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => saveToStorage(true), AUTOSAVE_MS);
}

function commitHistory(label) {
  const project = getActiveProject();
  if (!project) return;
  History.commit(project, label);
  updateHistoryButtons();
}

function updateHistoryButtons() {
  const undoBtn = document.getElementById('btn-undo');
  const redoBtn = document.getElementById('btn-redo');
  if (undoBtn) undoBtn.disabled = !History.canUndo();
  if (redoBtn) redoBtn.disabled = !History.canRedo();
}

/** Re-render just the canvas elements (cheap, avoids full view rebuild). */
function rerenderCanvas() {
  const canvas = document.getElementById('canvas');
  if (!canvas) return;
  const page = getActivePage();
  if (!page) return;
  const s = Store.get();
  canvas.querySelectorAll('.canvas-el, .float-bar, .handle').forEach((n) => n.remove());
  canvas.insertAdjacentHTML('afterbegin',
    page.elements.map((el) => elementHTML(el, s.editor.device, s)).join(''));
  updateFloatingBar();
}

function selectElement(id) {
  if (Store.get().selectedElementId === id) return;
  Store.patch('selectedElementId', id);
  rerenderCanvas();
  renderInspector();
}

function ScrollToElement(id) {
  const canvas = document.getElementById('canvas');
  const viewport = document.getElementById('canvas-viewport');
  if (!canvas || !viewport) return;
  const node = canvas.querySelector(`[data-el-id="${id}"]`);
  if (!node) return;
  const nodeTop = parseFloat(node.style.top) || 0;
  const zoom = Store.get().editor.zoom || 1;
  viewport.scrollTo({ top: Math.max(0, nodeTop * zoom - 120), behavior: 'smooth' });
}

function openProject(id) {
  const s = Store.get();
  const project = s.projects.find((p) => p.id === id);
  if (!project) return;
  Store.patch('activeProjectId', id);
  const firstPage = project.pages[0];
  Store.patch('activePageId', firstPage ? firstPage.id : null);
  Store.patch('selectedElementId', null);
  History.reset(project);
  updateHistoryButtons();
  saveToStorage(true);
  renderShell();
}

function openPage(id) {
  Store.patch('activePageId', id);
  Store.patch('selectedElementId', null);
  saveToStorage(true);
  renderCurrentView();
  EditorInteraction.attach();
}

const Actions = {
  /* -------- Navigation -------- */
  navigate(el, e) {
    const view = e?.dataset?.view || el?.dataset?.view;
    if (!view) return;
    if (view === 'editor' && !getActiveProject()) {
      const s = Store.get();

  async 'delete-project'(el) {
    const s = Store.get();
    const project = s.projects.find((p) => p.id === el.dataset.id);
    if (!project) return;

    const ok = await Modal.confirm({
      title: 'Delete project?',
      message: `“${project.name}” and all of its pages will be removed from this device. This cannot be undone.`,
      confirmLabel: 'Delete',
      variant: 'danger'
    });
    if (!ok) return;

    const remaining = s.projects.filter((p) => p.id !== project.id);
    Store.patch('projects', remaining);

    if (s.activeProjectId === project.id) {
      const next = remaining[0];
      Store.patch('activeProjectId', next ? next.id : null);
      Store.patch('activePageId', next && next.pages[0] ? next.pages[0].id : null);
      Store.patch('selectedElementId', null);
      History.reset(next || null);
    }

    logActivity('delete', `Deleted project “${project.name}”`);
    saveToStorage(true);
    renderCurrentView();
    renderShell();
    Notify.success('Project deleted', project.name);

    const project = s.projects.find((p) => p.id === id);
    if (!project) { Notify.warning('Nothing to export', 'Open a project first.'); return; }

    const payload = {
      format: 'nebula-studio-project',
      version: APP_VERSION,
      exportedAt: new Date().toISOString(),
      project

      `${Utils.slugify(project.name)}.nebula.json`,
      JSON.stringify(payload, null, 2)
    );

      Notify.error('Export failed', 'Your browser blocked the download.');

    const input = document.getElementById('file-input');
    if (!input) return;
    input.value = '';
    input.onchange = () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => handleImport(String(reader.result));
      reader.onerror = () => Notify.error('Import failed', 'The file could not be read.');
      reader.readAsText(file);
    };
    input.click();

  'preview-motion'() {
    const sel = getSelectedElement();
    if (!sel) return;
    const canvas = document.getElementById('canvas');
    const node = canvas?.querySelector(`[data-el-id="${sel.id}"]`);
    if (!node) return;

    const type = sel.motion.type;
    const dur = sel.motion.duration;
    if (type === 'none') { Notify.info('No animation set', 'Choose an animation in the Motion tab.'); return; }

    const keyframes = {
      fade:       [{ opacity: 0 }, { opacity: 1 }],
      'slide-up': [{ transform: 'translateY(36px)', opacity: 0 }, { transform: 'none', opacity: 1 }],
      'slide-left':[{ transform: 'translateX(-40px)', opacity: 0 }, { transform: 'none', opacity: 1 }],
      scale:      [{ transform: 'scale(.9)', opacity: 0 }, { transform: 'none', opacity: 1 }],
      blur:       [{ filter: 'blur(14px)', opacity: 0 }, { filter: 'blur(0)', opacity: 1 }]
    }[type] || [];

    try {
      const anim = node.animate(keyframes, { duration: dur, easing: 'cubic-bezier(.16,1,.3,1)' });
      anim.onfinish = () => { node.style.transform = ''; node.style.filter = ''; };
    } catch (err) {
      Notify.warning('Preview unavailable', 'Your browser does not support the Web Animations API.');
    }
  },

/* ---------- Helper: apply a history snapshot ---------- */
function applyHistorySnapshot(snap) {
  const s = Store.get();
  const idx = s.projects.findIndex((p) => p.id === snap.id);
  if (idx === -1) return;
  const projects = s.projects.slice();
  projects[idx] = snap;
  Store.patch('projects', projects);

  // Keep selection valid
  const stillExists = snap.pages
    .some((pg) => pg.id === Store.get().activePageId && pg.elements.some((e) => e.id === Store.get().selectedElementId));
  if (!stillExists) Store.patch('selectedElementId', null);

  updateHistoryButtons();
  saveToStorage(true);
  renderCurrentView();
  EditorInteraction.attach();
  renderShell();
}

/* ---------- Helper: add an element ---------- */
function addElement(type) {
  const page = getActivePage();
  if (!page) { Notify.warning('No page open', 'Open a project first.'); return; }

  const baseY = page.elements.reduce((m, e) =>
    Math.max(m, e.layout.desktop.y + e.layout.desktop.h), 0) + 40;

  const el = createElementOfType(type, 80, baseY);
  el.z = page.elements.length + 1;
  page.elements.push(el);
  page.height = Math.max(page.height, baseY + 260);

  Store.patch('selectedElementId', el.id);
  commitHistory('Add element');
  scheduleAutosave();
  rerenderCanvas();
  renderInspector();
  renderShell();
  Notify.success('Element added', el.name);
}

/* ---------- Helper: import handling ---------- */
function handleImport(raw) {
  let data;
  try {
    data = JSON.parse(raw);
  } catch (err) {
    Notify.error('Import failed', 'The file is not valid JSON.');
    return;
  }

  // Accept a single project or a full bundle
  let incoming = [];
  if (data && data.format === 'nebula-studio-project' && data.project) {
    incoming = [data.project];
  } else if (data && data.format === 'nebula-studio-bundle' && Array.isArray(data.projects)) {
    incoming = data.projects;
  } else if (data && typeof data === 'object' && data.pages && data.name) {
    incoming = [data]; // bare project object
  } else {
    Notify.error('Import failed', 'This file does not look like a Nebula Studio project.');
    return;
  }

  // Validate structure
  const valid = [];
  incoming.forEach((p) => {
    if (!p || typeof p !== 'object') return;
    if (!p.name || !Array.isArray(p.pages)) return;
    const project = {
      id: Utils.uid('prj'),
      name: String(p.name).slice(0, 120),
      description: String(p.description || 'Imported project').slice(0, 300),
      tag: String(p.tag || 'Imported').slice(0, 24),
      createdAt: Number(p.createdAt) || Date.now(),
      updatedAt: Date.now(),
      accent: typeof p.accent === 'string' && p.accent ? p.accent : '#4da3ff',
      pages: p.pages
        .filter((pg) => pg && Array.isArray(pg.elements))
        .map((pg) => ({
          id: Utils.uid('pg'),
          name: String(pg.name || 'Page').slice(0, 80),
          path: String(pg.path || '/').slice(0, 120),
          height: Number(pg.height) || 900,
          elements: pg.elements
            .filter((e) => e && typeof e === 'object')
            .map((e) => normalizeElement(e))
        }))
    };
    if (project.pages.length) valid.push(project);
  });

  if (!valid.length) {
    Notify.error('Import failed', 'No valid projects were found in that file.');
    return;
  }

  const s = Store.get();
  Store.patch('projects', [...valid, ...s.projects]);
  logActivity('import', `Imported ${valid.length} project${valid.length === 1 ? '' : 's'}`);
  saveToStorage(true);
  renderCurrentView();
  renderShell();
  Notify.success('Import complete', `${valid.length} project${valid.length === 1 ? '' : 's'} added.`);
}

/** Coerce an imported element into the current schema. */
function normalizeElement(e) {
  const layout = (e.layout && e.layout.desktop) || { x: 40, y: 40, w: 320, h: 80 };
  return {
    id: Utils.uid('el'),
    type: ELEMENT_TYPES[e.type] ? e.type : 'text',
    name: String(e.name || ELEMENT_TYPES[e.type] || 'Element').slice(0, 80),
    layout: {
      desktop: {
        x: Number(layout.x) || 0,
        y: Number(layout.y) || 0,
        w: Math.max(16, Number(layout.w) || 320),
        h: Math.max(1, Number(layout.h) || 80)
      }
    },
    props: (e.props && typeof e.props === 'object') ? e.props : {},
    style: Object.assign({}, DEFAULT_STYLE, (e.style && typeof e.style === 'object') ? e.style : {}),
    motion: Object.assign({ type: 'none', duration: 500, delay: 0 },
      (e.motion && typeof e.motion === 'object') ? e.motion : {}),
    z: Number(e.z) || 1,
    visible: e.visible !== false,
    locked: Boolean(e.locked)
  };
}

/* ---------- Helper: context menu (lightweight popover) ---------- */
function showContextMenu(anchorRect, items) {
  document.querySelectorAll('.ctx-menu').forEach((m) => m.remove());

  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.style.cssText = `
    position:fixed; z-index:9400; min-width:190px; padding:6px;
    border-radius:14px; background:rgba(14,17,28,.97);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 24px 60px -18px rgba(0,0,0,.95);
    animation:modalIn .18s cubic-bezier(.16,1,.3,1);`;

  items.forEach((item) => {
    const btn = document.createElement('button');
    btn.className = 'palette-item';
    btn.style.cssText = 'padding:8px 10px;width:100%';
    btn.innerHTML = `
      <span class="palette-icon" style="width:26px;height:26px">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[item.icon] || ICON_PATHS.plus}</svg>
      </span>
      <span class="palette-text"><span class="palette-title">${Utils.esc(item.label)}</span></span>`;
    btn.addEventListener('click', () => {
      menu.remove();
      item.run();
    });
    menu.appendChild(btn);
  });

  document.body.appendChild(menu);

  const rect = menu.getBoundingClientRect();
  let left = anchorRect.left;
  let top = (anchorRect.bottom || anchorRect.top) + 8;
  if (left + rect.width > window.innerWidth - 12) left = window.innerWidth - rect.width - 12;
  if (top + rect.height > window.innerHeight - 12) top = anchorRect.top - rect.height - 8;
  menu.style.left = Math.max(12, left) + 'px';
  menu.style.top = Math.max(12, top) + 'px';

  setTimeout(() => {
    const close = (ev) => {
      if (!menu.contains(ev.target)) {
        menu.remove();
        document.removeEventListener('pointerdown', close, true);
      }
    };
    document.addEventListener('pointerdown', close, true);
  }, 10);
}

/* ---------- Helper: zoom & fit ---------- */
function applyZoom() {
  const s = Store.get();
  const stage = document.getElementById('canvas-stage');
  const label = document.getElementById('zoom-label');
  if (stage) stage.style.transform = `scale(${s.editor.zoom})`;
  if (label) label.textContent = Math.round(s.editor.zoom * 100) + '%';
}

function fitCanvas(notify) {
  const viewport = document.getElementById('canvas-viewport');
  const stage = document.getElementById('canvas-stage');
  if (!viewport || !stage) return;

  const s = Store.get();
  const device = s.editor.device;
  const canvasWidth = DEVICE_WIDTHS[device];
  const available = viewport.clientWidth - 68;

  let zoom = available / canvasWidth;
  zoom = Utils.clamp(zoom, 0.2, 1);

  Store.patch('editor', Object.assign({}, s.editor, { zoom, autoFit: true }));
  applyZoom();
  if (notify) Notify.info('Zoom fitted', `${Math.round(zoom * 100)}% for ${DEVICE_LABELS[device]}`);
}

/* ==========================================================================
 * 17. GLOBAL EVENT DELEGATION
 * ========================================================================== */

/** Click delegation — every [data-action] is routed through Actions. */
document.addEventListener('click', (e) => {
  const stopEl = e.target.closest('[data-stop-propagation]');
  const actionEl = e.target.closest('[data-action]');

  if (!actionEl) return;
  if (stopEl && stopEl.contains(actionEl) === false && !actionEl.closest('[data-stop-propagation]')) {
    // fallthrough
  }

  const action = actionEl.dataset.action;
  const handler = Actions[action];
  if (!handler) return;

  e.preventDefault();
  e.stopPropagation();

  try {
    handler(actionEl, { dataset: actionEl.dataset });
  } catch (err) {
    console.error(`[Action:${action}]`, err);
    Notify.error('Action failed', err.message || 'Something went wrong.');
  }
});

/** Input delegation for the inspector + settings. */
document.addEventListener('input', Utils.debounce((e) => {
  const target = e.target;

  // ---- Settings controls ----
  if (target.dataset.setting) {
    const path = target.dataset.setting;
    let value;
    if (target.type === 'checkbox') value = target.checked;
    else if (target.type === 'range' || target.type === 'number') value = Number(target.value);
    else value = target.value;

    const s = Store.get();
    const next = Utils.clone(s.settings);
    Utils.deepSet(next, path, value);
    Store.patch('settings', next);
    Storage.set('settings', next);
    applySettings();

    // Live-update the numeric labels without a full re-render
    const label = target.closest('.field')?.querySelector('.field-label .val');
    if (label && (target.type === 'range' || target.type === 'number')) {
      const suffix = path.includes('opacity') ? '%'
        : path.includes('glass') || path.includes('glow') ? '%'
        : path.includes('letterSpacing') || path.includes('radius') || path.includes('padding') || path.includes('borderWidth') ? 'px'
        : '';
      const display = path.includes('opacity') ? Math.round(value * 100) : value;
      label.textContent = display + suffix;
    }
    return;
  }

  // ---- Inspector element controls ----
  if (target.dataset.prop) {
    const sel = getSelectedElement();
    if (!sel) return;

    const path = target.dataset.prop;
    let value;
    if (target.type === 'checkbox') value = target.checked;
    else if (target.type === 'range' || target.type === 'number') value = Number(target.value);
    else value = target.value;

    if (path.startsWith('layout.')) {
      const key = path.split('.')[1];
      const device = Store.get().editor.device;
      const num = Number(value);
      if (!isNaN(num)) setLayoutValue(sel, device, key, num);
    } else if (path === 'name') {
      sel.name = value;
    } else if (path === 'z') {
      sel.z = Number(value) || 1;
    } else if (path === 'visible') {
      sel.visible = value;
    } else if (path === 'locked') {
      sel.locked = value;
    } else {
      Utils.deepSet(sel, path, value);
    }

    // Live DOM update
    if (path.startsWith('layout.')) {
      const node = document.querySelector(`[data-el-id="${sel.id}"]`);
      const layout = getLayout(sel, Store.get().editor.device);
      if (node) {
        node.style.left = layout.x + 'px';
        node.style.top = layout.y + 'px';
        node.style.width = layout.w + 'px';
        node.style.height = layout.h + 'px';
      }
      updateFloatingBar(layout);
    } else {
      rerenderCanvas();
    }

    // Keep labels in sync
    const label = target.closest('.field')?.querySelector('.field-label .val');
    if (label && (target.type === 'range' || target.type === 'number')) {
      const suffix = path.includes('fontSize') || path.includes('radius') || path.includes('padding')
        || path.includes('borderWidth') || path.includes('letterSpacing') ? 'px'
        : path.includes('opacity') ? '%'
        : path.includes('lineHeight') ? '' : '';
      const display = path.includes('opacity') ? Math.round(value * 100) : value;
      label.textContent = display + suffix;
    }

    debouncedElementCommit();
  }
}, 20));

const debouncedElementCommit = Utils.debounce(() => {
  commitHistory('Edit element');
  scheduleAutosave();
}, 420);

/** Change event for select elements inside the inspector. */
document.addEventListener('change', (e) => {
  const target = e.target;
  if (target.tagName !== 'SELECT') return;

  if (target.dataset.prop) {
    const sel = getSelectedElement();
    if (!sel) return;
    const path = target.dataset.prop;
    let value = target.value;
    if (path === 'style.fontWeight' || path === 'motion.duration' || path === 'motion.delay') {
      value = Number(value);
    }
    Utils.deepSet(sel, path, value);
    commitHistory('Change element');
    scheduleAutosave();
    rerenderCanvas();
    renderInspector();
  }
});

/** Mobile sidebar toggle. */
document.getElementById('menu-btn')?.addEventListener('click', () => {
  const s = Store.get();
  const open = !s.editor.sidebarOpen;
  Store.patch('editor', Object.assign({}, s.editor, { sidebarOpen: open }));
  renderShell();
  document.getElementById('menu-btn')?.setAttribute('aria-expanded', String(open));
});

document.getElementById('sidebar-backdrop')?.addEventListener('click', () => {
  const s = Store.get();
  Store.patch('editor', Object.assign({}, s.editor, { sidebarOpen: false }));
  renderShell();
});

/** Search trigger. */
document.getElementById('search-trigger')?.addEventListener('click', () => Palette.open());

/** Topbar buttons. */
document.getElementById('btn-settings')?.addEventListener('click', () => setView('settings'));
document.getElementById('btn-shortcuts')?.addEventListener('click', () => Actions['show-shortcuts']());

/* ==========================================================================
 * 18. KEYBOARD SHORTCUTS
 * ========================================================================== */
document.addEventListener('keydown', (e) => {
  const mod = e.metaKey || e.ctrlKey;
  const tag = (e.target.tagName || '').toLowerCase();
  const isTyping = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;

  // Ctrl/Cmd + K — search (works even while typing)
  if (mod && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    Palette.isOpen() ? Palette.close() : Palette.open();
    return;
  }

  // Escape — close things
  if (e.key === 'Escape') {
    if (Palette.isOpen()) { Palette.close(); return; }
    if (Modal.isOpen()) { Modal.close(); return; }
    if (isTyping) { e.target.blur(); return; }
    const s = Store.get();
    if (s.editor.previewMode) { Actions['toggle-preview'](); return; }
    if (s.selectedElementId) { selectElement(null); return; }
    document.querySelectorAll('.ctx-menu').forEach((m) => m.remove());
    return;
  }

  if (isTyping) return;

  // Ctrl/Cmd + S — save
  if (mod && e.key.toLowerCase() === 's') {
    e.preventDefault();
    Actions['save-project']();
    return;
  }

  // Ctrl/Cmd + Z / Shift + Z — undo / redo
  if (mod && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    if (e.shiftKey) Actions.redo(); else Actions.undo();
    return;
  }

  // Ctrl/Cmd + D — duplicate element
  if (mod && e.key.toLowerCase() === 'd') {
    e.preventDefault();
    Actions['duplicate-element']();
    return;
  }

  // Ctrl/Cmd + P — preview mode
  if (mod && e.key.toLowerCase() === 'p') {
    e.preventDefault();
    Actions['toggle-preview']();
    return;
  }

  // Ctrl/Cmd + ' — toggle grid
  if (mod && e.key === "'") {
    e.preventDefault();
    Actions['toggle-grid']();
    return;
  }

  // Ctrl/Cmd + 1/2/3 — device preview
  if (mod && ['1', '2', '3'].includes(e.key)) {
    e.preventDefault();
    const device = { '1': 'desktop', '2': 'tablet', '3': 'mobile' }[e.key];
    Actions['set-device'](null, { dataset: { device } });
    return;
  }

  // ? — shortcuts panel
  if (e.key === '?' && e.shiftKey) {
    e.preventDefault();
    Actions['show-shortcuts']();
    return;
  }

  // Delete / Backspace — delete selected element
  if ((e.key === 'Delete' || e.key === 'Backspace') && Store.get().activeView === 'editor') {
    if (Store.get().selectedElementId) {
      e.preventDefault();
      Actions['delete-element']();
    }
  }
});

/* ==========================================================================
 * 19. PERSISTENCE HELPERS
 * ========================================================================== */
function buildDefaultSettings() {
  return {
    appearance: { accent: 'blue', animations: true, glass: 60, glow: 70 },
    editor: { autosave: true, grid: true, snapping: true, guides: true, gridSize: GRID_SIZE },
    performance: { effectsQuality: 'high', reducedMotion: false },
    api: { provider: 'mock', model: 'nebula-demo-1', baseURL: '' }
  };
}

function saveToStorage(silent) {
  try {
    const s = Store.get();
    if (!silent) Store.patch('ui', Object.assign({}, s.ui, { saveState: 'saving' }));

    Storage.set('projects', s.projects);
    Storage.set('activity', s.activity);
    Storage.set('settings', s.settings);
    Storage.set('activeProjectId', s.activeProjectId);
    Storage.set('activePageId', s.activePageId);
    Storage.set('search', s.search);
    Storage.set('editor', {
      device: s.editor.device,
      zoom: s.editor.zoom,
      autoFit: s.editor.autoFit
    });

    Store.patch('ui', Object.assign({}, Store.get().ui, {
      saveState: 'saved',
      lastSavedAt: Date.now()
    }));
    renderShell();
    return true;
  } catch (err) {
    console.error('[saveToStorage]', err);
    if (!silent) Notify.error('Save failed', 'Local storage is unavailable or full.');
    return false;
  }
}

function logActivity(type, text) {
  const s = Store.get();
  const entry = { id: Utils.uid('act'), type, text, ts: Date.now() };
  const activity = [entry, ...s.activity].slice(0, 200);
  Store.patch('activity', activity);
  Storage.set('activity', activity);
}

/* ==========================================================================
 * 20. SETTINGS APPLICATION (visual effects)
 * ========================================================================== */
function applySettings() {
  const s = Store.get();
  const a = s.settings.appearance;
  const perf = s.settings.performance;

  const root = document.documentElement;

  // Glass intensity → CSS variable
  const glassAlpha = Utils.clamp((a.glass / 100) * 0.12, 0, 0.16);
  root.style.setProperty('--glass-alpha', glassAlpha.toFixed(4));

  const blur = Utils.clamp(6 + (a.glass / 100) * 22, 0, 30);
  root.style.setProperty('--blur', blur.toFixed(0) + 'px');

  // Glow intensity
  const glow = Utils.clamp(a.glow / 100, 0, 1);
  root.style.setProperty('--glow-strength', glow.toFixed(2));
  document.querySelectorAll('.orb').forEach((o) => {
    o.style.opacity = (0.14 + glow * 0.4).toFixed(2);
  });

  // Motion preferences
  const reduceMotion = perf.reducedMotion ||
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.body.dataset.motion = (reduceMotion || !a.animations) ? 'off' : 'on';

  // Effects quality
  document.body.dataset.effects = perf.effectsQuality === 'low' ? 'low' : 'high';

  // API config sync
  API_CONFIG.provider = s.settings.api.provider;
  API_CONFIG.model = s.settings.api.model;
  API_CONFIG.baseURL = s.settings.api.baseURL;

  const live = AIService.isLive();
  Store.patch('apiStatus', {
    connected: live,
    provider: s.settings.api.provider,
    label: live ? `Live · ${s.settings.api.provider}` : 'Mock services',
    lastCheck: Date.now()
  });
}

/* ==========================================================================
 * 21. ERROR BOUNDARY
 * ========================================================================== */
function installErrorBoundary() {
  window.addEventListener('error', (e) => {
    console.error('[Global error]', e.error || e.message);
    // Do not surface raw internals to the user
    Notify.error('Something went wrong', 'The action could not be completed. Your work has been preserved.');
  });

  window.addEventListener('unhandledrejection', (e) => {
    console.error('[Unhandled rejection]', e.reason);
    Notify.error('Something went wrong', 'An asynchronous task failed. Your work has been preserved.');
  });
}

/* ==========================================================================
 * 22. BOOTSTRAP
 * ========================================================================== */
function bootstrap() {
  installErrorBoundary();

  const s = Store.get();

  // ---- Load persisted settings ----
  const savedSettings = Storage.get('settings', null);
  if (savedSettings && typeof savedSettings === 'object') {
    const merged = Utils.clone(buildDefaultSettings());
    Object.keys(merged).forEach((k) => {
      if (savedSettings[k] && typeof savedSettings[k] === 'object') {
        Object.assign(merged[k], savedSettings[k]);
      }
    });
    s.settings = merged;
  }
  applySettings();

  // ---- Load projects (or seed demo data) ----
  const savedProjects = Storage.get('projects', null);
  if (Array.isArray(savedProjects) && savedProjects.length) {
    s.projects = savedProjects;
  } else {
    s.projects = buildDemoProjects();
  }

  // ---- Load activity ----
  const savedActivity = Storage.get('activity', null);
  s.activity = Array.isArray(savedActivity) && savedActivity.length
    ? savedActivity
    : buildDemoActivity();

  // ---- Load search history ----
  const savedSearch = Storage.get('search', null);
  if (savedSearch && typeof savedSearch === 'object') s.search = savedSearch;

  // ---- Restore active selection ----
  const savedProjectId = Storage.get('activeProjectId', null);
  const savedPageId = Storage.get('activePageId', null);
  const savedEditor = Storage.get('editor', null);

  if (savedEditor && typeof savedEditor === 'object') {
    Object.assign(s.editor, {
      device: DEVICE_WIDTHS[savedEditor.device] ? savedEditor.device : 'desktop',
      zoom: typeof savedEditor.zoom === 'number' ? Utils.clamp(savedEditor.zoom, 0.2, 2) : 1,
      autoFit: savedEditor.autoFit !== false
    });
  }

  let activeProject = s.projects.find((p) => p.id === savedProjectId);
  if (!activeProject) activeProject = s.projects[0] || null;

  if (activeProject) {
    s.activeProjectId = activeProject.id;
    let activePage = activeProject.pages.find((pg) => pg.id === savedPageId);
    if (!activePage) activePage = activeProject.pages[0] || null;
    s.activePageId = activePage ? activePage.id : null;
    History.reset(activeProject);
  }

  // ---- Initial render ----
  renderShell();
  renderDashboard();
  renderEditor();
  renderActivity();
  renderSettings();

  document.querySelectorAll('.view').forEach((v) => {
    v.classList.toggle('active', v.dataset.view === s.activeView);
  });

  updateHistoryButtons();

  // ---- Attach editor interactions ----
  EditorInteraction.attach();

  // ---- Responsive handling ----
  let resizeTimer = null;
  window.addEventListener('resize', Utils.throttle(() => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const st = Store.get();
      if (st.activeView === 'editor' && st.editor.autoFit) fitCanvas();
      // Auto-close the mobile inspector on wide screens
      if (window.innerWidth > 920) {
        document.getElementById('inspector')?.classList.remove('open');
      }
    }, 140);
  }, 140));

  // ---- Save before unload ----
  window.addEventListener('beforeunload', () => saveToStorage(true));

  // ---- Auto-fit the canvas on first editor visit ----
  if (s.activeView === 'editor') setTimeout(fitCanvas, 60);

  // ---- Demo Mode notice (shown once per session) ----
  if (!sessionStorage.getItem('nebula_welcomed')) {
    sessionStorage.setItem('nebula_welcomed', '1');
    setTimeout(() => {
      Notify.info(
        'Demo Mode active',
        'Everything runs locally with mock services. No API key is required — connect a real provider later in Settings → API.',
        7000
      );
    }, 900);
  }

  console.log(
    `%cNebula Studio v${APP_VERSION}`,
    'color:#4da3ff;font-weight:700;font-size:13px',
    '\nMode: Demo (mock services)' +
    '\nStorage: ' + (Storage.persistent ? 'localStorage' : 'in-memory') +
    '\nProjects loaded: ' + s.projects.length
  );
}

/* ---------------------------------------------------------------------------
 * Run once the DOM is ready.
 * ------------------------------------------------------------------------- */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootstrap);
} else {
  bootstrap();
}

})();
